<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>placemat studio</title>
<style>
:root {
  color-scheme: light dark;
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
  /* chrome */
  --bg: #f4f5f7; --surface: #ffffff; --surface2: #eef0f3; --hover: #f3f5f8; --ink: #1b1f24; --dim: #5b6570; --line: #dde1e7;
  --accent: #2563eb; --accent-soft: #e2ebfd; --sel: #f5b301;
  /* meaning: good, bad, warning, changed */
  --good: #1a7f47; --good-soft: #dcf3e4; --bad: #c8312c; --bad-soft: #fde4e2; --warn: #9a5b00; --warn-soft: #fdf0cf; --mark: #d9480f;
  /* the board */
  --canvas: #e6e9ed; --substrate: #fbfbf8; --outline: #3a4350; --grid-minor: rgba(20,30,50,0.07); --grid-major: rgba(20,30,50,0.18); --grid-ink: #6b7480;
  --copper: #b45f2c; --via: #7d4a22; --plane: #c98a5e; --pad: #dca21e; --thru: #b7870c; --courtyard: #5b54c9; --body: #4d78a3; --silk: #6b7480;
  --keepout: #d6336c; --reserve: #3b6fe0; --ok: #1a7f47; --over: #d1342f; --free: #8a929d; --pocket: #e8590c; --finding: #d97706; --ref: #26396b;
  --copperB: #2f6fb8; --copperIn: #2e8b57; --tk: #a626a4; --ts: #2a7a3b; --tc: #7a8490; --tn: #b5560a; --tf: #1f5fbf; --td: #9a5b00;
  --sev-notice: #2563eb; --sev-warning: #9a5b00; --sev-critical: #c8312c;
  --sev-warning-mark: #f2c200;     /* a filled warning mark (a marker, an area, a count): yellow; --sev-warning is for text, dark enough to read */
  /* hues for what a chip names (a kind of step or command), apart from the state colours: blue running, green done, yellow warning, red error */
  --k-teal: #0b7285; --k-violet: #6d3fc4; --k-pink: #b02a75;
  --shadow: 0 1px 2px rgba(0,0,0,0.08), 0 4px 14px rgba(0,0,0,0.10);
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #111418; --surface: #1a1e23; --surface2: #232930; --hover: #20262d; --ink: #e5e8ec; --dim: #9ba5b0; --line: #2d343c;
    --accent: #6f9cff; --accent-soft: #1f2c4a; --sel: #ffcc33;
    --good: #4cc27e; --good-soft: #17301f; --bad: #ff7a73; --bad-soft: #3a1b1a; --warn: #f0b24a; --warn-soft: #382a0d; --mark: #ff8a4d;
    --canvas: #0e1114; --substrate: #1b2025; --outline: #aab4c0; --grid-minor: rgba(255,255,255,0.06); --grid-major: rgba(255,255,255,0.15); --grid-ink: #8c97a4;
    --copper: #e8895a; --via: #c47a45; --plane: #b8734a; --pad: #f0b93a; --thru: #d4a021; --courtyard: #9a90ff; --body: #6f9bc9; --silk: #8c97a4;
    --keepout: #ff6b9a; --reserve: #6f9cff; --ok: #4cc27e; --over: #ff6a62; --free: #7d8793; --pocket: #ff8a4d; --finding: #f5a524; --ref: #b4c4ee;
    --copperB: #6aa3ff; --copperIn: #5dc48a; --tk: #d196ff; --ts: #8fd18f; --tc: #7d8794; --tn: #ffb070; --tf: #7fb2ff; --td: #f0c060;
    --sev-notice: #6f9cff; --sev-warning: #f0b24a; --sev-critical: #ff7a73;
    --sev-warning-mark: #ffd400;
    --k-teal: #4cc9d9; --k-violet: #b79bff; --k-pink: #f27fb8;
    --shadow: 0 1px 2px rgba(0,0,0,0.4), 0 4px 14px rgba(0,0,0,0.45);
  }
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--ink); font: 13px/1.45 var(--sans); display: flex; flex-direction: column; font-variant-numeric: tabular-nums; touch-action: manipulation; -webkit-text-size-adjust: 100%; }
button, select, input { font: inherit; color: inherit; }
button { cursor: pointer; }
code, .mono { font-family: var(--mono); font-size: 0.92em; }
.dim { color: var(--dim); }
.add { color: var(--good); } .del { color: var(--bad); }

/* header */
header { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 14px; padding: 8px 14px; background: var(--surface); border-bottom: 1px solid var(--line); }
.brand { display: flex; align-items: baseline; gap: 8px; flex: 0 8 auto; background: none; border: 0; padding: 2px 6px; margin: 0 -6px; border-radius: 6px; text-align: left; }
.brand:hover, .brand[aria-expanded="true"] { background: var(--surface2); }
.brand .chev { color: var(--dim); font-size: 11px; }
#menu { position: fixed; z-index: 55; min-width: 280px; max-width: min(520px, calc(100vw - 16px)); max-height: 70vh; overflow: auto; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--shadow); padding: 4px; }
#menu[hidden] { display: none; }
#menu button, #picker button.pick { display: grid; grid-template-columns: 1fr; gap: 1px; width: 100%; text-align: left; background: none; border: 0; border-radius: 7px; padding: 7px 10px; }
#menu button:hover, #picker button.pick:hover { background: var(--hover); }
#menu button.cur { background: var(--accent-soft); }
#menu .sub, #picker .sub { color: var(--dim); font-size: 12px; }
#menu code, #picker code { color: var(--dim); font-size: 11.5px; overflow-wrap: anywhere; }
#picker { position: absolute; inset: 0; z-index: 15; overflow: auto; background: color-mix(in srgb, var(--bg) 80%, transparent); padding: 24px 16px; }
#picker[hidden] { display: none; }
#picker .box { max-width: 720px; margin: 0 auto; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); padding: 14px 16px 10px; }
#picker .bh { display: flex; align-items: center; gap: 8px; margin: 0 0 4px; } #picker .bh h2 { flex: 1; }
#picker .bh .x { border: 0; background: none; font-size: 22px; line-height: 1; color: var(--dim); padding: 0 6px; }
#picker h2 { margin: 0 0 4px; font-size: 18px; } #picker p { margin: 0 0 8px; color: var(--dim); }
#picker h3 { margin: 12px 0 2px; font-size: 12px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--dim); }
#picker .row { border-radius: 8px; }
#picker .row.latest.on { background: var(--accent-soft); }
#picker button.pick { border: 1px solid var(--line); background: var(--surface); margin-bottom: 8px; padding: 10px 12px; }
#runbtn.busy { opacity: 0.7; }
#morebtn { display: none; font-size: 18px; line-height: 1; padding-top: 4px; padding-bottom: 6px; }
.brand b { font-weight: 650; letter-spacing: 0.01em; }
#board-sub { color: var(--dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
header:has(#runhead:not([hidden])) #board-sub { contain: inline-size; }     /* while the status runs the subtitle takes what is left and the name never gives way */
.brand b { flex: none; white-space: nowrap; }
@media (min-width: 901px) { header { flex-wrap: nowrap; } }       /* wide: one row, whatever the status holds; the subtitle and the stats give way before the status does */
.share { padding: 10px 12px; width: 268px; max-width: 100%; }
.share .qr { display: block; width: 244px; max-width: 100%; height: auto; margin: 8px auto 6px; background: #fff; border-radius: 6px; }
.share .sub { color: var(--dim); font-size: 12px; margin-bottom: 6px; } .share p { margin: 6px 0 0; }
.share .shareurl { box-sizing: border-box; width: 100%; font: 11px var(--mono); padding: 4px 6px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface2); color: var(--ink); }
.sharebtns { display: flex; gap: 6px; margin-top: 6px; } .sharebtns button { flex: 1; border: 1px solid var(--line); background: var(--surface2); border-radius: 6px; padding: 4px 8px; }
#cmdbar { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; padding: 5px 14px; background: var(--accent-soft); color: var(--accent); border-bottom: 1px solid var(--line); font-weight: 600; }
#cmdbar[hidden] { display: none; }
/* the suggestions: the line of a finding that offers one, the bar that says what a try or an apply did, the diff dialog's bar */
#sgbar, #sgdlg { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; padding: 5px 14px; background: var(--surface); color: var(--ink); border-bottom: 1px solid var(--line); font-size: 12.5px; }
#sgbar[hidden], #sgdlg[hidden] { display: none; }
#sgbar b, #sgdlg b { overflow-wrap: anywhere; }
#sgbar .sgx { margin-left: auto; }
#sgbar button, #sgdlg button, .sgbtns button { border: 1px solid var(--line); background: var(--surface2); color: var(--ink); border-radius: 6px; padding: 0 9px; font-size: 12px; line-height: 20px; }
#sgbar button:disabled, .sgbtns button:disabled { opacity: 0.5; }
.sg { margin-top: 3px; font-weight: 400; }
.difffile { position: sticky; top: 0; z-index: 1; padding: 4px 10px; background: var(--surface2); border-bottom: 1px solid var(--line); font-size: 12.5px; }
.sgrow { display: flex; flex-wrap: wrap; align-items: center; gap: 2px 8px; }
.sgrow + .sgrow { margin-top: 2px; }
.sgtext { flex: 1 1 12em; min-width: 0; overflow-wrap: anywhere; color: var(--ink); }
.sgbtns { display: inline-flex; gap: 4px; flex: none; }
.sgmore { cursor: pointer; color: var(--accent); font-size: 12px; }
.pmmap { margin: 3px 0 4px; padding: 6px 8px; background: var(--surface2); border: 1px solid var(--line); border-radius: 6px; font-weight: 400; }
.pmmap table { border-collapse: collapse; font-size: 12px; }
.pmmap td { padding: 0 8px 0 0; }
.pmkey { display: inline-block; width: 18px; height: 0; vertical-align: middle; margin: 0 4px 0 10px; }
.pmkey.before { border-top: 1.5px dashed var(--k-violet); }
.pmkey.after { border-top: 2px solid var(--good); }
.pinmap polyline { fill: none; }
.pinmap .pm-before { stroke: var(--k-violet); stroke-width: 0.15; stroke-dasharray: 0.6 0.4; }
.pinmap .pm-after { stroke: var(--good); stroke-width: 0.2; }
.sgprobe { margin: 3px 0 4px; padding: 6px 8px; background: var(--surface2); border: 1px solid var(--line); border-radius: 6px; font-weight: 400; }
.sgprobe .sgl { display: flex; flex-wrap: wrap; align-items: center; gap: 2px 8px; }
.sgprobe .sgl > span:first-child { flex: 1 1 12em; min-width: 0; overflow-wrap: anywhere; }
.sgprobe button { border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 6px; padding: 0 9px; font-size: 12px; line-height: 20px; }
.sgchart { display: block; width: 100%; max-width: 420px; height: auto; margin: 4px 0; }
.sgchart text { fill: var(--dim); font-size: 9px; font-family: var(--sans); }
.sgchart .ln { stroke: var(--line); stroke-width: 1.5; }
.sgchart .dec { stroke: var(--bad); stroke-width: 1.5; }
.sgchart .ok { fill: var(--good); stroke: var(--surface); stroke-width: 1; }
.sgchart .no { fill: var(--bad); stroke: var(--surface); stroke-width: 1; }
.sgchart .er { fill: var(--surface); stroke: var(--dim); stroke-width: 1.5; }
.sgchart .last { stroke: var(--ink); stroke-width: 1.5; }
.sgcands { margin: 2px 0 0; font-size: 12px; max-height: 12em; overflow-y: auto; }
.sgcands .c { display: flex; flex-wrap: wrap; gap: 0 10px; align-items: baseline; }
.sgcands .c b { min-width: 5.5em; font-weight: 600; }

#cmdbar button { border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 6px; padding: 1px 10px; }
#toast { position: fixed; z-index: 70; left: 50%; transform: translateX(-50%); top: 64px; max-width: calc(100vw - 24px); background: var(--surface); color: var(--ink); border: 1px solid var(--accent); border-radius: 999px; box-shadow: var(--shadow); padding: 6px 16px; cursor: pointer; font-weight: 600; }
#toast[hidden] { display: none; }
/* what a command is: a hue for each kind, apart from the state colours (running blue, done green, failed red) */
.chip.state { min-width: 7ch; text-align: center; }
#status { min-width: 12ch; justify-content: center; }
.fx { display: inline-block; min-width: var(--w, 3ch); text-align: right; }
#nothing { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; padding: 24px; text-align: center; pointer-events: none; }
#nothing[hidden] { display: none; }
#nothing button { pointer-events: auto; }
.xv { padding: 6px 12px 12px; }
.xv .xh { display: flex; align-items: center; gap: 8px; padding: 0 0 6px; }
.xv .xh h3 { margin: 0; padding: 0; }
.xv .xf { display: grid; grid-template-columns: repeat(auto-fill, minmax(132px, 1fr)); gap: 4px 12px; margin: 0 0 8px; }
.xv .xc .k { display: block; color: var(--dim); font-size: 11px; text-transform: uppercase; letter-spacing: 0.04em; }
.xv .xc .v { display: block; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.xv .xshow { margin: 2px 0 4px; }
.xv .xlist { margin: 4px 0; font-size: 12px; }
.xv .xlist .xl { display: grid; grid-template-columns: 6ch 7ch 1fr; gap: 8px; padding: 1px 4px; border-radius: 4px; cursor: pointer; }
.xv .xlist .xl:hover { background: var(--hover); }
.xv .xlist .xl.best { color: var(--good); font-weight: 600; }
.xv .xctl button.on { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); font-weight: 600; }
#cmdbar .xline { font-weight: 500; }
#cmdbar .xnote { font-weight: 500; }
#cmdbar .xwarn { font-weight: 500; color: var(--sev-warning); }
#cmdbar .xline > span { display: inline-block; margin-right: 12px; white-space: nowrap; }
.row.cmd.step .l2 { white-space: normal; overflow: visible; }
#cmdbar .cbt { font-weight: 600; }
.xv svg.plot { width: 100%; height: 130px; display: block; background: var(--surface2); border-radius: 8px; }
.xv .xctl { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin: 6px 0; }
.xv .xctl button, .xv .xctl select { border: 1px solid var(--line); background: var(--surface2); border-radius: 6px; padding: 1px 9px; }
.xthumbs { display: flex; gap: 6px; overflow-x: auto; padding: 4px 0; }
.xthumbs button { flex: none; border: 1px solid var(--line); background: var(--surface); border-radius: 6px; padding: 2px; text-align: center; font-size: 10.5px; color: var(--dim); }
.xthumbs button.on { border-color: var(--accent); } .xthumbs button.best { border-color: var(--good); }
.xthumbs svg { width: 78px; height: 56px; display: block; }
.xv .xrow { display: flex; gap: 8px; font-size: 12px; padding: 1px 0; }
.xplain { fill: none; stroke: var(--dim); stroke-width: 0.12; stroke-dasharray: 0.4 0.3; pointer-events: none; }
.xlatest { fill: var(--mark); fill-opacity: 0.18; stroke: var(--mark); stroke-width: 0.2; pointer-events: none; }
.xbest { fill: var(--good); fill-opacity: 0.18; stroke: var(--good); stroke-width: 0.2; pointer-events: none; }
.xarr { stroke: var(--mark); stroke-width: 0.12; fill: none; pointer-events: none; } .xarr.best { stroke: var(--good); }
.xdens { fill: var(--accent); fill-opacity: 0.25; pointer-events: none; }
[hidden] { display: none !important; }       /* an element hidden by the page stays hidden whatever display its class sets */
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 2px 10px 2px 8px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); font-size: 12px; font-weight: 600; white-space: nowrap; flex: none; }
.pill i { width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.pill.live { background: var(--good-soft); color: var(--good); }
.pill.busy { background: var(--accent-soft); color: var(--accent); }
.pill.busy i { animation: pulse 1s ease-in-out infinite; }
.pill.stale { background: var(--warn-soft); color: var(--warn); }
.pill.error { background: var(--bad-soft); color: var(--bad); }
.pill.accent { background: var(--accent-soft); color: var(--accent); }
/* a resolve is running: a spinner, the time, the steps so far, and the step being worked on */
/* the running status is a strip above the timeline: the same fields as the step display, a bar, the time */
#runstrip { box-sizing: border-box; width: 100%; max-width: 100%; min-width: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow); padding: 5px 10px; color: var(--accent); font-weight: 600; }
#runstrip[hidden] { display: none; }
/* wide layouts: the same fields on one line in the header (the strip above the timeline is for narrow ones) */
#runhead { flex: 1 1 300px; min-width: 120px; flex-wrap: nowrap; overflow: hidden; color: var(--accent); font-weight: 600; container: rh / inline-size; }
#runhead[hidden] { display: none; }
/* what gives way as the header narrows, in order: the phase, then the kind pill, then the item's name; the counters (the step's place in the
   resolve, the item's rank in the search) and the time never shrink */
#runhead .f-steps { flex: none; white-space: nowrap; font-variant-numeric: tabular-nums; }   /* its width is set to the widest it gets */
#runhead .f-phase { width: 13ch; flex: 0 1 13ch; min-width: 0; overflow: hidden; }
#runhead .f-item { flex: 0 1 18ch; width: 18ch; overflow: hidden; text-overflow: ellipsis; }   /* a fixed width: a longer or shorter name moves nothing after it */
#runhead .info { flex: none; }
#runhead > .bar { flex: 1 1 90px; min-width: 60px; max-width: 420px; }
@container rh (max-width: 500px) { #runhead .f-phase { display: none; } }
@container rh (max-width: 360px) { #runhead .chip { display: none; } }
@container rh (max-width: 300px) { #runhead .f-item { display: none; } }
#runhead .f-item { color: var(--ink); font-weight: 600; }
#runhead .f-el { width: 2.8em; flex: none; text-align: right; font-variant-numeric: tabular-nums; }
#runhead:not(.settled) .f-time { display: none; }       /* the time on the step is the elapsed field's neighbour: shown only for the settled step */
/* between one step settling and the next beginning, the step that settled stays, dimmed, with the time it took */
.flds.settled > :not(.spin):not(.f-steps):not(.f-el):not(.bar) { opacity: 0.55; }
.row.pending.settled .sb { opacity: 0.55; }
#runstrip .f-el { width: 2.8em; font-variant-numeric: tabular-nums; }
#runstrip .f-steps { width: 15em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-variant-numeric: tabular-nums; }
#runstrip .flds + .flds { margin-top: 2px; font-weight: 400; color: var(--ink); }
#runstrip .flds > .bar { flex: 1 1 2em; min-width: 1.5em; }
#runstrip .mini { border: 1px solid var(--line); background: var(--surface2); color: var(--ink); border-radius: 6px; padding: 0 8px; font-size: 11.5px; line-height: 18px; flex: none; }
.spin { display: inline-block; flex: none; width: 13px; height: 13px; border-radius: 50%; border: 2px solid color-mix(in srgb, var(--accent) 25%, transparent); border-top-color: var(--accent); animation: spin 0.8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.bar { position: relative; height: 5px; border-radius: 3px; background: var(--surface2); overflow: hidden; }
.bar b { position: absolute; top: 0; bottom: 0; left: 0; width: 0; background: var(--accent); transition: width 0.3s, left 0.3s; }
.bar b.p-in { background: var(--sel); }                  /* the step under way: how far its phase has got, after the steps done */
.bar.ind b.p-done { width: 35%; animation: slide 1.3s ease-in-out infinite; }
.bar.ind b.p-in { display: none; }
@keyframes slide { from { margin-left: -35%; } to { margin-left: 100%; } }
.row.pending { cursor: default; align-items: flex-start; background: var(--accent-soft); }
.row.pending .i { display: flex; justify-content: flex-end; padding-top: 4px; overflow: hidden; }
.row.pending .pbar { height: 3px; border-radius: 2px; background: var(--surface2); margin-top: 4px; overflow: hidden; }
.row.pending .pbar b { display: block; height: 100%; background: var(--accent); }
.workmark circle { fill: none; stroke: var(--accent); stroke-width: 2px; vector-effect: non-scaling-stroke; pointer-events: none; }
.workmark .wm2 { animation: wm 1.2s ease-out infinite; transform-box: fill-box; transform-origin: center; }
@keyframes wm { from { transform: scale(0.6); opacity: 0.9; } to { transform: scale(2.4); opacity: 0; } }
@media (prefers-reduced-motion: reduce) { .spin, .workmark .wm2, .bar.ind b { animation-duration: 3s; } }
@keyframes pulse { 50% { opacity: 0.25; } }
#stats { display: flex; gap: 4px 16px; margin-left: auto; flex: none; min-width: 0; white-space: nowrap; overflow-x: auto; scrollbar-width: none; color: var(--dim); }
#stats::-webkit-scrollbar { display: none; }
.stat b { color: var(--ink); font-weight: 650; margin-right: 3px; }
.stat.bad b { color: var(--bad); } .stat.warn b { color: var(--warn); }
#notice { display: none; padding: 6px 14px; background: var(--warn-soft); color: var(--warn); border-bottom: 1px solid var(--line); }
#notice.err { background: var(--bad-soft); color: var(--bad); }
#notice a { color: inherit; font-weight: 600; }
#notice .nrow { display: flex; align-items: center; gap: 10px; }
#notice .ntext { flex: 1 1 auto; min-width: 0; }
#notice .x { flex: none; border: 0; background: none; color: inherit; font-size: 18px; line-height: 1; cursor: pointer; padding: 0 4px; }
#notice code { color: var(--ink); }

/* layout */
main { flex: 1; min-height: 0; display: grid; grid-template-columns: fit-content(300px) minmax(0, 1fr) 440px; }
#boardwrap { position: relative; min-width: 0; min-height: 0; background: var(--canvas); overflow: hidden; }
#grid, #board { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
#grid { pointer-events: none; }
#board { cursor: grab; touch-action: none; -webkit-user-select: none; user-select: none; }
#board.drag { cursor: grabbing; }
#boardwrap.stale #board { opacity: 0.5; }
#bar { position: absolute; top: 24px; left: 36px; right: 8px; display: flex; gap: 8px; align-items: flex-start; pointer-events: none; z-index: 4; }
#bar > * { pointer-events: auto; }
.seg { display: inline-flex; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; box-shadow: var(--shadow); }
.seg button, .tool { border: 0; background: none; padding: 6px 12px; min-height: 32px; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button.on { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
#viewbar, #bodybar, #spreadbar { display: none; }
body[data-mode="3d"] #board, body[data-mode="3d"] #grid, body[data-mode="3d"] #facebar { display: none; }
body[data-mode="3d"] #viewbar, body[data-mode="3d"] #bodybar, body[data-mode="3d"] #spreadbar { display: inline-flex; }
body[data-mode="3d"] #bar { flex-wrap: wrap; }                 /* 2D | 3D, the views, Fit and Key: more than a phone is wide */
body[data-mode="3d"] #viewbar button, body[data-mode="3d"] #bodybar button, body[data-mode="3d"] #spreadbar button { padding-left: 9px; padding-right: 9px; }
.m3 { margin: 4px 0 8px; padding: 0 12px; font-size: 12px; }
.m3 .row3 { display: flex; gap: 6px; align-items: baseline; flex-wrap: wrap; padding: 1px 0; }

.m3 .row3 b { font-weight: 600; }
.m3 button { border: 1px solid var(--line); background: var(--surface2); color: var(--ink); border-radius: 6px; padding: 0 9px; font-size: 12px; line-height: 20px; }
.tool { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; box-shadow: var(--shadow); white-space: nowrap; }
.tool.on { background: var(--accent-soft); color: var(--accent); }
#dock { position: absolute; left: 8px; right: 8px; bottom: 8px; display: flex; flex-direction: column; gap: 6px; align-items: flex-start; pointer-events: none; z-index: 3; }
#dock > * { pointer-events: auto; }
#card { display: none; width: min(380px, 100%); max-height: 46vh; overflow: auto; font-size: 13px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--shadow); padding: 8px 10px 9px; }
#card .h { display: flex; gap: 8px; align-items: center; position: sticky; top: 0; z-index: 2; background: var(--surface); margin: -8px -10px 0; padding: 8px 10px 4px; }
#card .h b { font-size: 14px; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#card .x { border: 0; background: none; color: var(--dim); font-size: 18px; line-height: 1; padding: 2px 6px; }
#card .sub { color: var(--dim); margin: 1px 0 4px; }
#card .note { margin: 4px 0 0; overflow-wrap: anywhere; }
.facts { margin: 2px 0 0; }
#card .src { margin-top: 5px; }
#card .kv { display: grid; grid-template-columns: auto 1fr; gap: 1px 10px; margin: 3px 0 0; font-size: 12px; }
#card .kv span:nth-child(odd) { color: var(--dim); }
.cs { margin-top: 8px; padding-top: 5px; border-top: 1px solid var(--line); }
.cst { font-size: 10.5px; font-weight: 650; text-transform: uppercase; letter-spacing: 0.06em; color: var(--dim); margin-bottom: 3px; }
.cl > div { padding: 1px 0; overflow-wrap: anywhere; }
.pills { display: flex; flex-wrap: wrap; gap: 4px; }
.facts { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; margin: 0; }
.fndrow.go { cursor: pointer; } .fndrow.go:hover { text-decoration: underline; }
.num.ok { color: var(--good); }
#card a { color: var(--accent); cursor: pointer; text-decoration: none; }
#card .src a { font-family: var(--mono); font-size: 12px; }
#replay { display: flex; gap: 10px; align-items: center; width: 100%; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--shadow); padding: 4px 12px 4px 4px; }
#play { border: 0; background: var(--accent); color: #fff; border-radius: 7px; flex: none; min-width: 70px; padding-left: 8px; padding-right: 8px; padding: 6px 0; font-weight: 600; }
#slider { flex: 1; min-width: 0; height: 30px; margin: 0; accent-color: var(--accent); touch-action: none; }
/* the label and the button have fixed widths: the slider's own width never changes while it is dragged */
#steplabel { flex: none; width: 6em; text-align: right; white-space: nowrap; overflow: hidden; }
#stepnow { display: none; box-sizing: border-box; width: 100%; max-width: 100%; min-width: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow); padding: 4px 10px; }
/* the current step as fields: each keeps its width where its value changes, the name takes the rest, and the line wraps rather than overflows */
.flds { display: flex; flex-wrap: wrap; align-items: center; gap: 2px 8px; min-width: 0; max-width: 100%; font-size: 12.5px; }
.flds > * { min-width: 0; flex: none; }
.flds .f-n { width: 4.6em; color: var(--dim); }
.flds .f-item { flex: 1 1 0; min-width: 2.2em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }       /* takes what is left, so only the others' minimum can make the line wrap */
.flds .f-rank { width: 6.4em; color: var(--dim); white-space: nowrap; }
.flds .f-phase { width: 8.6em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.flds .f-time { width: 3.3em; text-align: right; color: var(--dim); font-variant-numeric: tabular-nums; white-space: nowrap; }
.flds .chip { max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 11px; line-height: 17px; padding: 0 6px; }
@media (max-width: 420px) { .flds { gap: 2px 6px; } .flds .f-rank { width: 3.8em; } .flds .f-rank .lbl { display: none; } }
.row.pending .flds { margin-top: 2px; }
#tip { position: absolute; pointer-events: none; background: #20252b; color: #f2f4f6; padding: 6px 9px; border-radius: 6px; font-size: 12px; max-width: 360px; display: none; white-space: pre-wrap; z-index: 7; box-shadow: var(--shadow); }

/* the sidebar */
#side { display: flex; flex-direction: column; min-height: 0; border-left: 1px solid var(--line); background: var(--surface); }
.tabs, #ntabs { display: flex; border-bottom: 1px solid var(--line); background: var(--surface); }
.tabs button, #ntabs button { flex: 1; min-width: 0; border: 0; background: none; padding: 9px 4px 8px; color: var(--dim); border-bottom: 2px solid transparent; white-space: nowrap; }
.tabs button.on, #ntabs button.on { color: var(--ink); font-weight: 600; border-bottom-color: var(--accent); }
.tabs em, #ntabs em { font-style: normal; font-size: 11px; color: var(--dim); background: var(--surface2); border-radius: 999px; padding: 0 6px; margin-left: 4px; font-weight: 500; }
.tabs em.bad, #ntabs em.bad { background: var(--warn-soft); color: var(--warn); }
.tab { flex: 1 1 55%; min-height: 0; overflow: auto; display: none; }
.tab.on { display: block; }
#ntabs { display: none; }
#script { display: none; flex-direction: column; min-height: 0; background: var(--surface); }
#linechips { display: flex; flex-wrap: wrap; gap: 6px; padding: 6px 12px; border-bottom: 1px solid var(--line); min-height: 38px; align-items: center; color: var(--dim); }
#linechips button { border: 1px solid var(--line); background: var(--accent-soft); color: var(--accent); border-radius: 999px; padding: 1px 10px; font-weight: 600; }
main { position: relative; }
/* the legend and the right panel each fold away on a wide screen; a phone has its own sheet and tabs */
.edge { display: none; }
#scripthead .unfold[hidden] { display: none; }              /* the source dialog covers the panels' handles: while one is folded, its own unfold button is in the dialog's head */
@media (min-width: 901px) {
  main.nolegend { grid-template-columns: minmax(0, 1fr) 440px; }
  main.noside { grid-template-columns: fit-content(300px) minmax(0, 1fr); }
  main.nolegend.noside { grid-template-columns: minmax(0, 1fr); }
  main.nolegend #legend, main.noside #side { display: none; }
  .edge { display: block; position: absolute; top: 50%; z-index: 5; width: 16px; height: 52px; margin-top: -26px; padding: 0; border: 1px solid var(--line); background: var(--surface); color: var(--dim); font-size: 14px; line-height: 1; box-shadow: var(--shadow); }
  .edge:hover { color: var(--accent); border-color: var(--accent); }
  #legtoggle { left: 0; border-left: 0; border-radius: 0 8px 8px 0; }
  #sidetoggle { right: 0; border-right: 0; border-radius: 8px 0 0 8px; }
}
/* the script is a dialog over the board, opened on a line; "full screen" widens it over the legend and the board and leaves the panel at the right */
#script { display: none; flex-direction: column; position: fixed; z-index: 30; left: var(--dlgl, 240px); top: calc(var(--hh, 56px) + 12px); width: min(780px, calc(100vw - var(--dlgl, 240px) - var(--sidew, 440px) - 30px));
  max-height: calc(100vh - var(--hh, 56px) - 96px); background: var(--surface); border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--shadow); overflow: hidden; }
#script.open { display: flex; }
#script.full { left: 0; right: var(--sidew, 440px); top: var(--hh, 56px); bottom: 0; width: auto; max-height: none; border-radius: 0; }
#scriptbody { min-height: 140px; }
.tk { color: var(--tk); } .ts { color: var(--ts); } .tc { color: var(--tc); font-style: italic; } .tn { color: var(--tn); } .tf { color: var(--tf); } .td { color: var(--td); }
#scripthead { display: flex; gap: 8px; align-items: center; padding: 6px 10px; border-bottom: 1px solid var(--line); background: var(--surface); }
#scripthead select { background: var(--surface2); border: 1px solid var(--line); border-radius: 6px; padding: 3px 6px; min-width: 0; }
#scripthead button { border: 1px solid var(--line); background: var(--surface2); border-radius: 6px; padding: 2px 9px; }
#scripthead #scriptclose { font-size: 18px; line-height: 1; padding: 0 8px; }
.ln.more { color: var(--dim); font-style: italic; cursor: pointer; padding: 2px 0 2px 56px; }
.ln.more:hover { background: var(--hover); }
#scriptbody { flex: 1; overflow: auto; font: 13px/1.55 var(--mono); tab-size: 4; }
.ln { display: flex; white-space: pre; }
.ln:hover { background: var(--hover); }
.ln .no { width: 44px; flex: none; text-align: right; padding-right: 8px; color: var(--dim); user-select: none; cursor: pointer; }
.ln .dot { width: 12px; flex: none; text-align: center; color: var(--accent); user-select: none; }
.ln .tx { flex: 1; padding-right: 8px; }
.ln.decl { background: var(--accent-soft); }
.ln.chg .no { background: var(--good-soft); color: var(--good); }
.ln.chgdecl { background: var(--warn-soft); }
.ln.sel { outline: 2px solid var(--accent); outline-offset: -2px; }


/* the legend: the colour key and the switch for each kind of thing */
#legend { min-width: 224px; background: var(--surface); border-right: 1px solid var(--line); overflow: auto; min-height: 0; padding-bottom: 12px; z-index: 8; }
#legend h4 { margin: 0; padding: 12px 12px 4px; font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--dim); font-weight: 650; }
#legend .lgh { display: none; align-items: center; padding: 10px 12px 6px; font-weight: 650; position: sticky; top: 0; z-index: 3; background: var(--surface); }
#legend .lgh button { margin-left: auto; border: 0; background: none; font-size: 24px; line-height: 1; color: var(--dim); padding: 2px 10px; }
.lg { display: flex; align-items: center; gap: 8px; padding: 5px 12px; cursor: pointer; user-select: none; }
.lg:hover { background: var(--hover); }
.lg.off { opacity: 0.45; }
.lg.off span.nm { text-decoration: line-through; }
.lg.sub { padding-left: 34px; font-size: 12px; }
.lg.zero { opacity: 0.4; }
.lg .sw { width: 26px; height: 14px; flex: none; overflow: visible; }
.lg .nm { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.lg em { font-style: normal; color: var(--dim); font-size: 12px; }
.lg.grp.none { opacity: 0.55; } .lg.grp.none span.nm { text-decoration: line-through; } .lg.grp.some .sw { opacity: 0.6; }
.lgscale { display: flex; align-items: center; gap: 6px; margin: 0 12px 4px 46px; font-size: 11px; color: var(--dim); }
.lgscale i { flex: 1; height: 8px; border-radius: 4px; }
.lg .car { width: 14px; color: var(--dim); text-align: center; flex: none; }
.lg .only { border: 1px solid var(--line); background: var(--surface2); border-radius: 6px; font-size: 11px; padding: 0 6px; color: var(--dim); }
.info { width: 16px; height: 16px; padding: 0; margin: 0 0 0 7px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface2); color: var(--dim); font: italic 700 10.5px/14px Georgia, serif; text-transform: none; letter-spacing: 0; vertical-align: middle; cursor: help; }
span.info { display: inline-block; text-align: center; }
.info:hover { color: var(--accent); border-color: var(--accent); }
#infopop { position: fixed; z-index: 60; max-width: min(320px, calc(100vw - 16px)); background: var(--surface); color: var(--ink); border: 1px solid var(--line); border-radius: 8px; box-shadow: var(--shadow); padding: 8px 11px; font-size: 12px; line-height: 1.45; }
#infopop[hidden] { display: none; }
#keybtn { display: none; }

/* lists */
.row { display: flex; gap: 8px; padding: 6px 12px; border-bottom: 1px solid var(--line); cursor: pointer; align-items: baseline; }
.row:hover { background: var(--hover); }
.row.sel { background: var(--accent-soft); }
.row.later { opacity: 0.35; }
.row.now { box-shadow: inset 3px 0 0 var(--accent); }
.row .i { width: 26px; text-align: right; flex: none; color: var(--dim); }
.row .k { font-weight: 600; flex: none; max-width: 45%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row.unp { align-items: flex-start; }
.row .unpbody { white-space: normal; overflow: visible; color: var(--ink); }
.unpbody .cs { margin-top: 4px; } .unpbody .cs:first-child { margin-top: 0; }
.refrow { display: inline-flex; flex-wrap: wrap; align-items: center; gap: 2px 5px; }
.blk { display: inline-flex; align-items: center; gap: 3px; white-space: nowrap; }
a.chip.act { cursor: pointer; }
.row .dur { margin-left: auto; color: var(--dim); font-variant-numeric: tabular-nums; white-space: nowrap; }
.row .n { color: var(--dim); min-width: 0; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row.open .n, .row .n.wrap { white-space: normal; }
.row .go { display: none; border: 1px solid var(--line); background: var(--surface2); border-radius: 6px; padding: 1px 8px; flex: none; }
/* A chip is tinted by --c: informational blue unless its class says what it is. A kind of step or command has a hue of its own, and a state has the state's. Never grey. */
.chip { --c: var(--accent); font-size: 11px; line-height: 17px; padding: 0 7px; border-radius: 999px; background: color-mix(in srgb, var(--c) 17%, var(--surface)); color: color-mix(in srgb, var(--c) 80%, var(--ink)); flex: none; font-weight: 600; }
/* a step's kind has its own colour from the board's palette: a tint of it behind the colour itself */
.chip.decided, .chip.running, .chip.phase { --c: var(--accent); } .chip.searched { --c: var(--courtyard); } .chip.pocket { --c: var(--tk); } .chip.rides { --c: var(--k-violet); }
.chip.track, .chip.copper { --c: var(--copper); } .chip.via { --c: var(--via); } .chip.plane { --c: var(--body); } .chip.label { --c: var(--ref); } .chip.escape { --c: var(--k-teal); }
.chip.cutout, .chip.keepout { --c: var(--k-pink); }
.chip.kind-preview { --c: var(--k-teal); } .chip.kind-run { --c: var(--courtyard); } .chip.kind-explore { --c: var(--k-pink); } .chip.kind-route { --c: var(--copper); } .chip.kind-apply { --c: var(--k-violet); }
.chip.bad, .chip.error, .chip.lost, .chip.unplaced { background: var(--bad-soft); color: var(--bad); }
.chip.warn, .chip.refusal { background: var(--warn-soft); color: var(--warn); } .chip.good, .chip.done { background: var(--good-soft); color: var(--good); }
.chip.notice { background: var(--accent-soft); color: var(--sev-notice); }
.chip.net { font-family: var(--mono); font-size: 11.5px; }
h3 { margin: 0; padding: 12px 12px 5px; font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--dim); font-weight: 650; }
h3.fold { cursor: pointer; display: flex; gap: 6px; }
h3 .c { font-weight: 500; }
.pad8 { padding: 8px 12px; }
.empty { padding: 28px 16px; text-align: center; color: var(--dim); }
.sum { display: flex; flex-wrap: wrap; gap: 4px 14px; padding: 8px 12px; }
.sum b { font-weight: 650; }
.gh { display: flex; gap: 8px; align-items: center; padding: 9px 12px 6px; font-weight: 650; background: var(--surface); position: sticky; top: 0; border-bottom: 1px solid var(--line); cursor: pointer; }
.gh .ct { margin-left: auto; font-weight: 600; font-size: 11px; background: var(--warn-soft); color: var(--warn); border-radius: 999px; padding: 0 8px; }
.cmpbar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; padding: 8px 12px; }
.cmpbar select, .cmpbar .fbtn { background: var(--surface2); border: 1px solid var(--line); border-radius: 6px; padding: 3px 6px; min-width: 0; }
.fbtn.on { background: var(--accent-soft); color: var(--accent); border-color: transparent; font-weight: 600; }
table.diff { border-collapse: collapse; width: 100%; font: 12px/1.45 var(--mono); }
table.diff td { padding: 0 4px; white-space: pre-wrap; word-break: break-all; vertical-align: top; }
table.diff td.no { color: var(--dim); text-align: right; width: 34px; user-select: none; cursor: pointer; }
table.diff tr.p td.tx, table.diff td.r.p { background: var(--good-soft); }
table.diff tr.m td.tx, table.diff td.l.m { background: var(--bad-soft); }
table.diff tr.hunk td { background: var(--accent-soft); color: var(--dim); }
table.diff td.link { color: var(--mark); width: 14px; }


.row.step { align-items: flex-start; }
.row.step .sb, .row.pending .sb { flex: 1; min-width: 0; }
.row.step .l1, .row.pending .l1 { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.row.step .l1 b, .row.pending .l1 b { overflow-wrap: anywhere; }
.row.step .l2 { color: var(--dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row.step .full { display: none; margin-top: 3px; white-space: normal; overflow-wrap: anywhere; cursor: auto; }
.row.step .full .cs:first-child { margin-top: 4px; }
.row.step .full .fndrow.go { cursor: pointer; }
.row.step.open .l2 { display: none; }
.row.step.open .full { display: block; }
.fdot { display: inline-flex; align-items: center; justify-content: center; min-width: 17px; height: 17px; border-radius: 999px; font-size: 11px; font-weight: 700; color: #10151b; background: var(--sev-warning-mark); padding: 0 4px; }
.fdot.critical { background: var(--sev-critical); color: #fff; } .fdot.notice { background: var(--sev-notice); color: #fff; }
.sev { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em; padding: 0 7px; border-radius: 999px; background: var(--warn-soft); color: var(--sev-warning); flex: none; }
.sev.critical { background: var(--bad-soft); color: var(--sev-critical); } .sev.notice { background: var(--accent-soft); color: var(--sev-notice); }
.filters { display: flex; gap: 6px; padding: 8px 12px; flex-wrap: wrap; border-bottom: 1px solid var(--line); }
.filters button { border: 1px solid var(--line); background: var(--surface2); border-radius: 999px; padding: 1px 10px; }
.filters button.on { background: var(--accent-soft); color: var(--accent); border-color: transparent; font-weight: 600; }
.fixslot { flex: none; }
.runbar { display: flex; align-items: center; gap: 8px; padding: 8px 12px; border-bottom: 1px solid var(--line); }
.runlog { margin: 0; padding: 8px 12px; max-height: 190px; overflow: auto; font: 11.5px/1.45 var(--mono); color: var(--dim); background: var(--surface2); white-space: pre-wrap; }
.notice-run { padding: 6px 12px; color: var(--warn); }
.row.run .go { display: inline-block; }
.row.run .full { display: block; }
a.srcl { color: var(--accent); font-family: var(--mono); font-size: 11.5px; cursor: pointer; }
.fixslot:empty { display: none; }
.kvl { margin: 4px 0 0; }
.kr { display: grid; grid-template-columns: 6.5em minmax(0, 1fr); gap: 0 8px; position: relative; padding: 0.5px 0; }
.kk { color: var(--dim); }
.kvv { overflow-wrap: anywhere; }
.sep { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: pre; }      /* copied as "label: value", not seen */
.val { font-weight: 600; } .val.bad { color: var(--bad); } .val.warn { color: var(--warn); } .val.good { color: var(--good); }
.chip.face-front { --c: var(--copper); } .chip.face-back { --c: var(--copperB); }
#card .lrow { display: flex; gap: 6px; align-items: baseline; padding: 2px 0; cursor: pointer; font-size: 12px; }
#card .lrow .num { margin-left: auto; white-space: nowrap; }
#card .chip.SHORT { background: var(--warn-soft); color: var(--warn); } #card .chip.PREFER { background: var(--accent-soft); color: var(--accent); }
#card .mods { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }
#card .mods button, #card .act { border: 1px solid var(--line); background: var(--surface2); border-radius: 999px; padding: 0 9px; }
#card .act { color: var(--accent); }
#card a.chip.act { padding: 0 9px; line-height: 17px; }

/* the board drawing: every colour is a variable, so it follows the theme */
svg text { user-select: none; font-family: var(--sans); }
.outline { fill: var(--substrate); stroke: var(--outline); stroke-width: 0.15; }
.outline.undrawn { stroke-dasharray: 0.4 0.4; }
.ko { fill: var(--keepout); fill-opacity: 0.16; stroke: var(--keepout); stroke-width: 0.08; }
.kolabel { fill: var(--keepout); font-size: 0.8px; }
.res { fill: var(--reserve); fill-opacity: 0.12; stroke: var(--reserve); stroke-width: 0.05; stroke-dasharray: 0.3 0.3; }
.cy { fill: var(--courtyard); fill-opacity: 0.05; stroke: var(--courtyard); stroke-width: 0.06; stroke-dasharray: 0.25 0.2; }
.bd { fill: none; stroke: var(--body); stroke-width: 0.07; }

.plane.l-B { fill: var(--copperB); stroke: var(--copperB); } .plane.l-In { fill: var(--copperIn); stroke: var(--copperIn); }

.lkdot.ok { fill: var(--ok); } .lkdot.over { fill: var(--over); } .lkdot.free { fill: var(--free); }
.lk, .lkdot, .lklabel { pointer-events: none; }

<body>

  <span class="chip latest" id="latestchip" hidden>latest</span><span class="chip kind" id="kindchip" hidden></span><span class="pill" id="status"><i></i><span id="statustext">connecting</span></span>
  <span class="pill stale" id="nativepill" hidden>native off</span>
  <div class="flds" id="runhead" hidden></div>
  <button class="tool" id="runbtn" title="placemat run: writes the board, runs the design checks and KiCad's DRC, scores and records the run; the live view is only a preview">Full run</button>
  <button class="tool" id="resolvebtn" title="cancel what is running and resolve again now: the menu offers a full resolve from scratch">Resolve</button>
  <button class="tool" id="sharebtn" title="open this view on another device: a QR code of its address">Share</button>
  <button class="tool" id="morebtn" aria-haspopup="menu" title="Run, Resolve, Share, Source">&#8943;</button>
  <button class="tool" id="srcbtn" title="the layout script, at the selected item's line">Source</button>
  <div id="stats"></div>
</header>

    <svg id="board" xmlns="http://www.w3.org/2000/svg"></svg>

      <div class="seg" id="modebar" title="draw the board flat (2D) or built (3D, from the parts' real models)"><button data-mode="2d" class="on">2D</button><button data-mode="3d">3D</button></div>

    <div id="sgdlg" hidden></div>

<script>
"use strict";
// ---------------------------------------------------------------- helpers
const $ = s => document.querySelector(s);
const T = new URLSearchParams(location.search).get("t") || "";
// Every text the page shows passes through esc (or fmtUnits for a tooltip), so an area written "mm2" reads mm squared.
const fmtUnits = s => String(s == null ? "" : s).replace(/\bmm2\b/g, "mm\u00b2");
const deg = v => v + "\u00b0";
const escRaw = s => String(s == null ? "" : s).replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));
const esc = s => escRaw(fmtUnits(s));
const num = v => (Math.round(v * 1000) / 1000).toString();
const getJSON = url => fetch(url + (url.includes("?") ? "&" : "?") + "t=" + encodeURIComponent(T)).then(r => { if (!r.ok) throw new Error(url + ": " + r.status); return r.json(); });
const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
const MARGIN = 3, GAP = 6;

// ---------------------------------------------------------------- state
const S = {
  mode: "2d", models: {}, models3d: {},   // the 3D view: which renderer draws the board, the models' states (studio_3d.py), the converter's status
  hello: null, status: "connecting", resolving: null, stale: false, error: null, changedFiles: [],
  history: [],                 // summaries of the kept resolves
  docs: new Map(),             // id -> {id, doc, texts, changed, timing, reused, notes}
  live: null,                  // the plan being streamed: {id, board, keepouts, reservations, items, steps, copper, ...}
  texts: {}, changed: [],      // the texts and changed files of what is shown
  shownId: null,               // the id of the resolve shown, or null while streaming
  baseId: null,                // the resolve compared against
  cmp: null,                   // {a, b, diff, files, trace}
  follow: true,                // shown follows the latest resolve
  sel: null, marked: new Set(), selLine: null,
  focus: null,                 // the finding being looked at: {refs, pads}, lit on the board
  done: null,                  // "done in 41 s", shown in the running strip for a moment after a resolve
  cmds: new Map(),             // the commands of the project that report over the live channel, by id
  explores: [],                // recorded explores (their result files)
  cmdView: null,               // a command's streamed plan shown in place of the studio's own: {id, plan, next}
  xv: null,                    // the explore being looked at: {source, id|file, start, variants, done, sel, mode, auto, drawn, thumbs, density, lastDraw}
  exploreFps: 2,
  start: null,                 // the dialog that chooses what to look at is open; null until the first hello says whether anything is chosen
  latestOn: false,             // the Latest mode: the view follows the most recent command of the project
  latestKey: null,             // what Latest shows now: "cmd:4", "run:ID", "explore:FILE", "route:FILE"
  latestPending: null,         // a newer command that started while the viewer was looking at something: offered, not shown
  touchedAt: null,             // when the viewer last selected an item, opened a finding or moved the view
  openSeq: 0, opening: null,   // the open of a command, record or explore under way: only the newest one is shown
  projectRuns: [],             // the recorded runs of every board of the project (run.json), newest first
  findingsHand: false, findingsTab: false,   // the findings layer: turned on by hand in the legend (kept in this browser), and on while the Findings tab is open
  routes: [],                  // recorded routes of this script's board (their summaries): replayed from their records
  pinmap: null,                // the pin map suggestion whose airwires are drawn: {sid}
  sg: {more: new Set(), busy: null, show: null, note: null, src: false, confirm: null, found: {}, asked: new Set()},   // suggestions: the finding slots opened, a try in flight, the diff shown, what the last apply said
  try: null,                   // a try shown, not written: {id, base, suggestion, cleared, gained, lost, moved, score, applied}
  applied: [], canApply: true, // the suggestions applied here (for Undo and the history rows); false: this studio does not write
  redo: "",                    // the text of the apply a Redo would make again ("" when there is none)
  notes: [], noteAge: 0, noteFocus: null,    // notes left in the studio (notes.py records), their age limit in seconds, the one looked at
  work: null,                  // the resolve in progress: {t0, total, cur, replayed}, from the engine's begin notices
  scriptOpen: false, scriptFull: false, scriptWhole: false,     // the script dialog
  runs: [], run: null, lastRun: null, openRuns: new Set(),      // recorded runs of the script, the run in progress, the one that just ended
  replay: null,                // null: every placement step shown; k: the first k placement steps
  play: null,                  // the running replay: {t0, k0, rate, n}
  liveQ: [],                   // streamed items waiting to be added to the drawing
  face: "both", off: new Set(["labels", "findings"]), seenRegions: new Set(),   // off: what the legend has switched off
  selRef: null, selRegion: null, module: null, sevFilter: "",
  view: null, tab: "runs", file: null, cmpFile: null, sbs: false, openRows: new Set(), showOther: false, closedKinds: new Set(), cardOff: null, cardLinks: false, sliding: false,
};

function plan() {                      // the plan to draw
  if (S.cmdView) return S.cmdView.plan;           // a command's streamed plan, while one is open
  if (S.resolving && S.live) return S.live;
  const d = S.docs.get(S.shownId);
  return d ? d.doc : S.live;
}
// What the board draws: items with a shape of their own. A keepout or setup step that settled with a placement but
// no parts is not one.
const isDrawn = it => (it.members || []).some(m => (m.shapes || []).length);
const itemsOf = p => ((p && p.items) || []).filter(isDrawn);
const itemMap = p => new Map(itemsOf(p).map(i => [i.key, i]));

// The replay's positions, in the order the layout made them: each item the board draws (at its first step), each
// copper step and each cutout. Keepouts and the other setup steps draw nothing of their own and are not positions.
// The slider, the step list and the drawing all index this list.
function replaySteps(p) {
  const drawn = new Set(itemsOf(p).map(i => i.key)), seen = new Set(), out = [];
  (p && p.steps || []).forEach((s, i) => {
    if (drawn.has(s.item) && !seen.has(s.item)) { seen.add(s.item); out.push(Object.assign({}, s, {n: out.length, at: i, type: "place"})); }
    else if (!drawn.has(s.item) && (s.kind === "copper" || s.kind === "cutout")) out.push(Object.assign({}, s, {n: out.length, at: i, type: s.kind}));
  });
  return out;
}
// The steps that are not positions, for the step list's second section.
function otherSteps(p) {
  const pos = new Set(replaySteps(p).map(s => s.at));
  return (p && p.steps || []).map((s, i) => Object.assign({}, s, {at: i})).filter(s => !pos.has(s.at) && !((p.unplaced || []).some(u => u.item === s.item) && s.kind !== "copper"));
}
// The item keys the drawing shows at slider position k (null: all of them): the first k placement steps' items.
function itemsAtStep(p, k) {
  const order = replaySteps(p);
  return (k == null ? order : order.slice(0, clamp(k, 0, order.length))).filter(s => s.type === "place").map(s => s.item);
}
const replayCount = () => replaySteps(plan()).length;

// ---------------------------------------------------------------- scheduling
const dirty = new Set();
let queued = false;
function schedule(...parts) {
  parts.forEach(p => dirty.add(p));
  if (!queued) { queued = true; requestAnimationFrame(() => { queued = false; const d = [...dirty]; dirty.clear(); render(d); }); }
}
function render(parts) {
  const all = parts.includes("all");

// ---------------------------------------------------------------- the replay

  slider.disabled = false;                                          // usable while a resolve runs: it follows the newest step unless moved back
  if (B.svg && B.plan === p) showSteps(k);

const PLAY_SECONDS = 8, PLAY_MIN = 3, PLAY_MAX = 30;           // a replay takes about this long, at a rate within these steps per second
function playRate(n) { return clamp(n / PLAY_SECONDS, PLAY_MIN, PLAY_MAX); }

// ---------------------------------------------------------------- steps
// A row says plainly: the step's number, the item, how it was placed, the reason in one line (the whole note on

const COPPER_WORDS = {track: "track", via: "via", plane: "plane", pour: "plane", fill: "plane", zone: "plane", label: "label", faces: "label", fanout: "escape", escape: "escape", bridge: "track"};

  if (s.kind === "copper") { const w = item.split(" ")[0], cls = COPPER_WORDS[w] || "copper"; return {cls, word: COPPER_WORDS[w] ? w : "copper", name: COPPER_WORDS[w] && item.includes(" ") ? item.slice(w.length + 1) : item}; }

// ---------------------------------------------------------------- findings

// ---------------------------------------------------------------- script
// A small Python tokenizer: comments, strings (triple-quoted too), numbers, keywords, names being defined or called,
// decorators. Gives one html string per line, a token that spans lines closed and reopened on each.
const PY_KW = new Set("False None True and as assert async await break class continue def del elif else except finally for from global if import in is lambda nonlocal not or pass raise return try while with yield".split(" "));

function highlightPython(text) {
  const lines = [""];
  const put = (cls, s) => {
    s.split("\n").forEach((part, i) => {
      if (i) lines.push("");

    });
  };
  let last = 0, prev = "", m;
  PY_TOKEN.lastIndex = 0;
  while ((m = PY_TOKEN.exec(text)) !== null) {
    if (m[0] === "") { PY_TOKEN.lastIndex++; continue; }
    if (m.index > last) put("", text.slice(last, m.index));

    .catch(err => { const n = $("#notice"); n.className = "err"; n.style.display = "block"; n.textContent = "Could not resolve again: " + err.message; });
}
$("#resolvebtn").onclick = () => resolveMenu($("#resolvebtn"));
$("#rs-again").onclick = () => resolveMenu($("#rs-again"));
$("#menu").onclick = e => {
  if (e.target.closest(".info")) return;
  const b = e.target.closest("[data-script]"); if (b) { switchTo(b.dataset.script); return; }
  const r = e.target.closest("[data-resolve]"); if (r) { resolveNow(r.dataset.resolve === "fresh"); return; }
  const mo = e.target.closest("[data-more]");
  if (mo && !mo.disabled) {
    const w = mo.dataset.more;
    if (w === "share") openMenuAt($("#morebtn"), shareHTML());
    else { closeMenu(); if (w === "run") startRun(); else if (w === "source") $("#srcbtn").onclick(); else resolveNow(w === "fresh"); }
    return;
  }
  if (e.target.closest("[data-copy]")) { const url = shareUrl(), inp = $("#shareurl"); try { navigator.clipboard.writeText(url); } catch (_) { if (inp && inp.select) { inp.select(); try { document.execCommand("copy"); } catch (__) {} } } return; }
  if (e.target.closest("[data-share]")) { try { navigator.share({title: document.title, url: shareUrl()}); } catch (_) {} }
};
document.addEventListener("click", e => { if ($("#menu").hidden) return; if (!(e.target.closest && (e.target.closest("#menu") || e.target.closest("#brandbtn") || e.target.closest("#resolvebtn") || e.target.closest("#rs-again") || e.target.closest("#sharebtn") || e.target.closest("#morebtn")))) closeMenu(); });
// Escape closes the topmost thing that is open, one at a time: a note, the menu, the legend sheet, the script, the card.
document.addEventListener("keydown", e => {
  if (e.key !== "Escape") return;
  if (!$("#infopop").hidden) infoHide();
  else if (!$("#menu").hidden) closeMenu();
  else if (S.start) closeStart();
  else if (narrow() && $("#legend").classList.contains("open")) $("#legend").classList.remove("open");
  else if (S.scriptOpen) closeScript();
  else if ($("#card").style.display === "block") { S.cardOff = cardKey(); renderCard(); }
});
// A tap outside the legend sheet closes it, and so does a swipe down on its header.
document.addEventListener("click", e => { const lg = $("#legend"); if (narrow() && lg.classList.contains("open") && e.target.closest && !e.target.closest("#legend") && !e.target.closest("#keybtn")) lg.classList.remove("open"); });
let lgSwipe = null;
$("#legend").addEventListener("pointerdown", e => { lgSwipe = e.pointerType === "touch" && e.target.closest && e.target.closest(".lgh") ? e.clientY : null; });
$("#legend").addEventListener("pointerup", e => { if (lgSwipe != null && e.clientY - lgSwipe > 50) $("#legend").classList.remove("open"); lgSwipe = null; });
// With no script given, the page opens on a dialog that chooses what to look at, and nothing resolves until a script is chosen: a command running
// now (followed live), a past run (its board and findings, resolved by nothing) or a layout script (the only choice that starts the studio's own preview).
// The brand button in the header opens it again.
function startHTML() {
  const running = [...S.cmds.values()].filter(c => c.state === "running").sort((a, b) => b.started - a.started);
  const past = [...S.projectRuns.map(r => ({at: r.at, html: rowRun(r)})), ...S.explores.map(e => ({at: e.at, html: rowExplore(e)})), ...S.routes.map(r => ({at: r.at, html: rowRoute(r)}))]
    .sort((a, b) => (b.at || 0) - (a.at || 0));
  const shown = past.slice(0, 10), list = S.scripts || [];
  const sec = (title, n, body, none) => "<section><h3>" + title + ' <span class="c">' + n + "</span></h3>" + (body || '<div class="pad8 dim">' + none + "</div>") + "</section>";
  const lt = latestTarget();
  const latest = '<section><h3>Runs</h3><div class="row cmd step latest' + (S.latestOn ? " on" : "") + '"' + (lt ? ' data-latest="1"' : "") + (S.latestOn ? ' aria-current="true"' : "") + ' title="' + esc(LATEST_TITLE) + '">' +
    '<span class="chip state latest">latest</span><div class="sb"><div class="l1">' + (lt ? kindChip(lt.what) + " " : "") + "<b>Follow latest</b>" + (S.latestOn ? ' <span class="chip">current</span>' : "") + '</div><div class="l2">' +
    (lt ? esc((lt.running ? "now " : "last ") + kindTitle(lt.what) + (lt.running ? "" : ", " + ago(lt.at))) : "Nothing has run in this project yet.") + "</div></div></div></section>";
  return '<div class="box" role="dialog" aria-label="open"><div class="bh"><h2>Open</h2><button class="x" id="startclose" aria-label="close" title="close">&times;</button></div>' + latest +
    sec("Running now", running.length, running.map(rowCmd).join(""), "No placemat command is running in this project. A preview, a run, an explore or a route started here shows up as it begins.") +
    sec("Past runs", past.length, shown.map(p => p.html).join("") + (past.length > shown.length ? '<div class="pad8 dim">' + (past.length - shown.length) + " older ones are in the Runs tab.</div>" : ""), "Nothing has been recorded in this project yet.") +
    "<section><h3>Open a script <span class=\"c\">" + list.length + '</span></h3><div class="pad8 dim">Starts the studio\'s own preview of it.</div>' + (list.length ? list.map(s => scriptEntry(s, "pick")).join("") : '<div class="pad8 dim">The layout scripts are being listed ...</div>') +
    "</section></div>";
}
function renderPicker() {
  const el = $("#picker"), open = !!S.start;
  el.hidden = !open;
  $("#brandbtn").setAttribute("aria-expanded", open ? "true" : "false");
  if (!open) return;
  const top = el.scrollTop;
  el.innerHTML = startHTML();
  el.scrollTop = top;
  el.onclick = e => {
    if (e.target === el || e.target.closest("#startclose")) { closeStart(); return; }
    const b = e.target.closest("[data-script]"); if (b) { switchTo(b.dataset.script); return; }
    if (e.target.closest(".info")) return;
    if (e.target.closest("[data-latest]")) { startLatest(); if (narrow()) showNarrow("board"); else goTab("runs"); return; }
    if (runsClick(e)) { if (narrow()) showNarrow("board"); else goTab("runs"); }
  };
}
function openStart() { closeMenu(); S.start = true; schedule("start", "status"); refreshPast(); }
function closeStart() { S.start = false; schedule("start", "status"); }
$("#nothingpick").onclick = openStart;
function startRun(regenerate) {
  if (S.run) return;
  fetch("/run?t=" + encodeURIComponent(T), {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify({regenerate: regenerate === true})})
    .then(r => { if (!r.ok) return r.text().then(m => { throw new Error(m); }); })
    .catch(err => { const n = $("#notice"); n.className = "err"; n.style.display = "block"; n.textContent = "Could not start a run: " + err.message; });
}
$("#runbtn").onclick = () => startRun();
// A file the server names by its full path, as the page's texts name it (relative to the script's folder).
const relName = f => { const k = Object.keys(S.texts || {}).find(n => f === n || String(f).endsWith("/" + n)); return k || f; };
const ago = at => { const s = Math.max(0, Date.now() / 1000 - at); return s < 90 ? "just now" : s < 5400 ? Math.round(s / 60) + " min ago" : s < 129600 ? Math.round(s / 3600) + " h ago" : Math.round(s / 86400) + " days ago"; };
const cnt = v => v && typeof v === "object" ? Object.values(v).reduce((a, b) => a + (+b || 0), 0) : (+v || 0);
// A DRC bucket: its total, then the kinds in it.
const drcBucket = (name, v, bad) => v == null ? "" : val(cnt(v) + " " + name, cnt(v) && bad ? "bad" : cnt(v) ? "warn" : "good") + (v && typeof v === "object" ? " " + Object.keys(v).map(k => '<span class="dim">' + esc(k.replace(/_/g, " ")) + " " + v[k] + "</span>").join(", ") : "");
function runDetail(r) {
  const drc = r.drc || {};
  const rows = [["DRC", [drcBucket("real", drc.drc_real, true), drcBucket("outstanding", drc.outstanding, true), drcBucket("other", drc.other, false), drcBucket("permitted", drc.permitted, false), drc.unconnected != null ? val(cnt(drc.unconnected) + " unconnected", "warn") : ""].filter(Boolean).map(x => "<div>" + x + "</div>").join("")],
    ["findings", Object.keys(r.severities || {}).map(k => '<span class="sev ' + k + '">' + k + " " + r.severities[k] + "</span>").join(" ")],
    ["airwire", r.airwire_mm != null ? esc(Math.round(r.airwire_mm) + " mm") + (r.open_nets ? ", " + val(cnt(r.open_nets) + " open nets", "warn") : "") : ""],
    ["checks", r.checks && r.checks.checks_failed != null ? val(r.checks.checks_failed + " failed", r.checks.checks_failed ? "bad" : "good") + (r.checks.checks_unjudged ? esc(", " + r.checks.checks_unjudged + " unjudged") : "") : ""],
    ["time", esc(Object.keys(r.timing || {}).map(k => k + " " + r.timing[k] + " s").join(", "))]];
  const failing = (r.verdicts || []).map(v => '<div>' + pill(v.check) + " " + esc(v.subject || "") + ' <span class="dim">' + esc(v.note || "") + "</span></div>").join("");
  const f = r.failure;
  const rowsHtml = kvl(rows);
  // a module run's arrangements: offered, refused by its proof (a warning) or laid out as another one
  const arrs = (r.arrangements || []).map(a => "<div>" + pill(a.id, a.duplicate_of ? "notice" : a.offered ? "good" : "warn") + " " +
    esc(a.duplicate_of ? "same as " + a.duplicate_of : a.offered ? "offered" : "refused " + a.refused) + "</div>").join("");
  return '<div class="full" style="display:block">' + sect("Result", rowsHtml === '<div class="kvl"></div>' ? "" : rowsHtml) + (arrs ? sect("Arrangements", '<div class="cl">' + arrs + "</div>") : "") + (failing ? sect("Failed checks", '<div class="cl">' + failing + "</div>") : "") +
    (f ? sect("Failure", '<div class="note">' + esc(f.message || "") + "</div>" + (f.line ? '<div class="src"><a data-act="src" data-file="' + esc(relName(f.file)) + '" data-line="' + f.line + '">' + esc(relName(f.file) + ":" + f.line) + "</a>" + (f.source ? " <code>" + esc(String(f.source).trim()) + "</code>" : "") + "</div>" : "")) : "") + "</div>";
}
function runRow(r) {
  const open = S.openRuns.has(r.id);
  const bits = [r.score != null ? "score " + r.score : "", r.drc && r.drc.drc_real != null ? "DRC " + cnt(r.drc.drc_real) + (cnt(r.drc.outstanding) ? " + " + cnt(r.drc.outstanding) + " outstanding" : "") : "", r.findings + " findings", ago(r.at)].filter(Boolean).join(" - ");
  return '<div class="row run step' + (open ? " open" : "") + '" data-run="' + esc(r.id) + '"><span class="chip ' + (r.status === "ok" ? "good" : "bad") + '">' + esc(r.status) + '</span><div class="sb"><div class="l1"><b>' + esc(r.id) + "</b>" +
    (r.label ? ' <span class="dim">' + esc(r.label) + "</span>" : "") + '</div><div class="l2">' + esc(bits) + "</div>" + (open ? runDetail(r) : "") + '</div><button class="go" data-cmp-run="' + esc(r.id) + '" title="compare the newest resolve with this run">compare</button></div>';
}
function runsHTML() {
  const run = S.run, last = S.lastRun;
  let o = '<div class="runbar"><button class="tool" id="runnow"' + (run ? " disabled" : "") + ">" + (run ? "Running..." : "Full run") + "</button>" + infoBtn("runs") +
    '<span class="dim">' + (run ? "a checked run is in progress" : "design checks, DRC and the score, recorded") + "</span></div>";
  if (run) o += '<div class="runlog">' + esc(run.n ? "step " + run.n + ": " + run.step : "starting ...") + "</div>";
  else if (last && !last.run) o += '<div class="notice-run">The run ended' + (last.code != null ? " (exit " + last.code + ")" : "") + " without a record.</div><pre class=\"runlog\">" + esc((last.tail || []).slice(-8).join("\n")) + "</pre>";
  o += '<h3>Runs <span class="c">' + S.runs.length + "</span></h3>";
  o += S.runs.length ? S.runs.map(runRow).join("") : '<div class="pad8 dim">No recorded run of this script yet. Run records the first.</div>';
  return o;
}
async function loadRunCompare(id) {
  try { setCompare(await getJSON("/runcompare?run=" + encodeURIComponent(id))); }
  catch (e) { const n = $("#notice"); n.className = "err"; n.style.display = "block"; n.textContent = "Could not compare with run " + id + ": " + e.message; }
}

// ---------------------------------------------------------------- chrome
const narrow = () => matchMedia("(max-width: 900px)").matches;
function goTab(name) {                         // the board, or a panel: the bar on a phone, the sidebar's tabs on a wide screen
  if (narrow()) { showNarrow(name); return; }
  if (name === "board") return;
  setTab(name);
  document.querySelectorAll(".tabs button").forEach(x => x.classList.toggle("on", x.dataset.tab === name));
  document.querySelectorAll(".tab").forEach(t => t.classList.toggle("on", t.id === "tab-" + name));
}
document.querySelectorAll(".tabs button").forEach(b => b.onclick = () => goTab(b.dataset.tab));
function setFace(f) {
  S.face = f; lay = null;
  document.querySelectorAll("#facebar button").forEach(x => x.classList.toggle("on", x.dataset.face === f));
  schedule("board", "legend"); S.view = null;
}
document.querySelectorAll("#facebar button").forEach(b => b.onclick = () => setFace(b.dataset.face));
$("#fit").onclick = fit;
$("#keybtn").onclick = () => $("#legend").classList.toggle("open");
function showNarrow(v) {
  document.body.dataset.nv = v;
  document.querySelectorAll("#ntabs button").forEach(x => x.classList.toggle("on", x.dataset.nv === v));
  if (v !== "board") setTab(v);
  if (v !== "board") $("#legend").classList.remove("open");
  schedule("all");
  if (v === "board") requestAnimationFrame(applyView);
  layoutScript();
}
document.querySelectorAll("#ntabs button").forEach(b => b.onclick = () => showNarrow(b.dataset.nv));
applyVisibility();
setFace(narrow() ? "front" : "both");            // one face fills a narrow screen
showNarrow("board");
applyPanels();
window.addEventListener("resize", () => { applyView(); layoutScript(); renderProgress(); });
if (window.ResizeObserver) new ResizeObserver(() => { applyView(); layoutScript(); }).observe($("#boardwrap"));   // the notice and the tab bar change its height
schedule("all");
// The board builder is a script of its own, served by the studio beside this page (studio_builder.js); it adds its own tab and panels.
try { const b = document.createElement("script"); b.src = "/builder.js?t=" + encodeURIComponent(T); document.body.appendChild(b); } catch (e) { /* the studio without its builder */ }
</script>
