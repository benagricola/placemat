<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>placemat studio</title>
<style>
:root {
  --bg: #f4f4f1; --panel: #ffffff; --ink: #1d1f23; --dim: #6b7078; --line: #d9d9d3; --accent: #1f5fbf;
  --good: #2f9e44; --bad: #d63333; --warn: #c77700; --sel: #ffd43b; --mark: #f76707;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--ink); font: 13px/1.4 system-ui, sans-serif; display: flex; flex-direction: column; }
header { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; padding: 6px 12px; background: var(--panel); border-bottom: 1px solid var(--line); }
header h1 { font-size: 14px; margin: 0; font-weight: 600; }
.badge { padding: 1px 8px; border-radius: 10px; font-size: 12px; background: #e9ecef; }
.badge.live { background: #d3f9d8; color: #1b6b2a; }
.badge.busy { background: #fff3bf; color: #7a5600; }
.badge.stale { background: #ffe3e3; color: #a61e1e; }
.badge.error { background: #ffc9c9; color: #a61e1e; }
.dim { color: var(--dim); }
header label { white-space: nowrap; cursor: pointer; }
header .grow { flex: 1; }
header button, header select { font: inherit; }
#notice { padding: 4px 12px; background: #fff3bf; border-bottom: 1px solid var(--line); display: none; }
#notice.err { background: #ffe3e3; }
main { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) 460px; }
#boardwrap { position: relative; min-width: 0; min-height: 0; background: #eceae4; overflow: hidden; }
#board { width: 100%; height: 100%; display: block; cursor: grab; touch-action: none; }
#board.drag { cursor: grabbing; }
#boardwrap.stale #board { opacity: 0.45; }
#boardwrap.stale::after { content: "stale: the files have changed since this was resolved"; position: absolute; top: 8px; left: 50%; transform: translateX(-50%); background: #fff; border: 1px solid var(--bad); color: var(--bad); padding: 2px 10px; border-radius: 4px; pointer-events: none; }
#replay { position: absolute; left: 8px; right: 8px; bottom: 8px; display: flex; gap: 8px; align-items: center; background: rgba(255,255,255,0.92); border: 1px solid var(--line); border-radius: 4px; padding: 4px 8px; }
#replay input { flex: 1; }
#tip { position: absolute; pointer-events: none; background: rgba(29,31,35,0.94); color: #fff; padding: 6px 8px; border-radius: 4px; font-size: 12px; max-width: 360px; display: none; white-space: pre-wrap; z-index: 5; }
#side { display: flex; flex-direction: column; min-height: 0; border-left: 1px solid var(--line); background: var(--panel); }
.tabs { display: flex; border-bottom: 1px solid var(--line); }
.tabs button { flex: 1; border: 0; background: none; padding: 6px; font: inherit; cursor: pointer; border-bottom: 2px solid transparent; }
.tabs button.on { border-bottom-color: var(--accent); font-weight: 600; }
.tab { flex: 1 1 55%; min-height: 0; overflow: auto; display: none; }
.tab.on { display: block; }
#script { flex: 1 1 45%; min-height: 0; display: flex; flex-direction: column; border-top: 2px solid var(--line); }
#scripthead { display: flex; gap: 8px; align-items: center; padding: 4px 8px; border-bottom: 1px solid var(--line); }
#scriptbody { flex: 1; overflow: auto; font: 12px/1.45 ui-monospace, Menlo, Consolas, monospace; }
.ln { display: flex; white-space: pre; cursor: default; }
.ln:hover { background: #f1f3f5; }
.ln .no { width: 44px; flex: none; text-align: right; padding-right: 8px; color: var(--dim); user-select: none; cursor: pointer; }
.ln .dot { width: 12px; flex: none; text-align: center; color: var(--accent); user-select: none; }
.ln .tx { flex: 1; padding-right: 8px; }
.ln.decl { background: #fff3bf; }
.ln.chg .no { background: #d3f9d8; color: #1b6b2a; }
.ln.chgdecl { background: #ffd8a8; }
.ln.sel { outline: 2px solid var(--accent); outline-offset: -2px; }
.row { display: flex; gap: 8px; padding: 3px 8px; border-bottom: 1px solid #efefea; cursor: pointer; align-items: baseline; }
.row:hover { background: #f1f3f5; }
.row.sel { background: #fff3bf; }
.row.later { opacity: 0.35; }
.row .k { font-weight: 600; min-width: 0; flex: none; }
.row .n { color: var(--dim); min-width: 0; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row.open .n { white-space: normal; }
.chip { font-size: 11px; padding: 0 6px; border-radius: 8px; background: #e9ecef; flex: none; }
.chip.decided { background: #d0ebff; } .chip.pocket { background: #ffe8cc; } .chip.unplaced { background: #ffc9c9; } .chip.copper { background: #f3d9fa; }
h3 { margin: 10px 8px 4px; font-size: 12px; text-transform: uppercase; letter-spacing: 0.04em; color: var(--dim); }
.pad8 { padding: 4px 8px; }
.sum { display: flex; flex-wrap: wrap; gap: 4px 12px; padding: 6px 8px; }
.add { color: var(--good); } .del { color: var(--bad); }
table.diff { border-collapse: collapse; width: 100%; font: 12px/1.4 ui-monospace, Menlo, Consolas, monospace; }
table.diff td { padding: 0 4px; white-space: pre-wrap; word-break: break-all; vertical-align: top; }
table.diff td.no { color: var(--dim); text-align: right; width: 34px; user-select: none; cursor: pointer; }
table.diff tr.p td.tx { background: #e6fcf5; } table.diff tr.m td.tx { background: #fff0f0; }
table.diff td.l.m { background: #fff0f0; } table.diff td.r.p { background: #e6fcf5; }
table.diff tr.hunk td { background: #edf2ff; color: var(--dim); }
table.diff td.link { color: var(--mark); width: 14px; }
table.diff td.cur { outline: 2px solid var(--mark); outline-offset: -2px; }
.legend { padding: 4px 8px; display: flex; flex-wrap: wrap; gap: 2px 10px; color: var(--dim); font-size: 12px; }
svg text { user-select: none; }
.item.sel .courtyard { stroke: var(--sel) !important; stroke-width: 0.3 !important; stroke-dasharray: none !important; }
.item.marked .courtyard { stroke: var(--mark) !important; stroke-width: 0.35 !important; stroke-dasharray: none !important; }
.item.faded { opacity: 0.25; }
#ntabs, #layerbtn { display: none; }
#replay input { min-width: 0; }
@media (max-width: 900px) {
  /* a phone: one panel at a time, each the full width and the rest of the height, chosen from the bar under the header */
  body { font-size: 15px; }
  header { padding: 6px 10px; }
  header button, header select { font-size: 15px; padding: 4px 8px; }
  #layerbtn { display: inline-block; }
  #layers { display: none; width: 100%; }
  #layers.open { display: flex; flex-wrap: wrap; gap: 6px 14px; }
  #ntabs { display: flex; background: var(--panel); border-bottom: 1px solid var(--line); }
  #ntabs button { flex: 1; min-width: 0; border: 0; background: none; padding: 9px 2px; font: inherit; cursor: pointer; border-bottom: 3px solid transparent; }
  #ntabs button.on { border-bottom-color: var(--accent); font-weight: 600; }
  main { display: block; position: relative; overflow: hidden; }
  #boardwrap, #side { position: absolute; inset: 0; width: auto; height: auto; }
  #side { border-left: 0; }
  body[data-nv="board"] #side, body:not([data-nv="board"]) #boardwrap { display: none; }
  .tabs { display: none; }
  body[data-nv] .tab { display: none; }
  body[data-nv="steps"] #tab-steps, body[data-nv="findings"] #tab-findings, body[data-nv="compare"] #tab-compare { display: block; flex: 1 1 auto; }
  #script { display: none; }
  body[data-nv="script"] #script { display: flex; flex: 1 1 auto; border-top: 0; }
  .row { padding: 8px 10px; gap: 10px; }
  .row .n { white-space: normal; overflow: visible; word-break: break-word; }
  .chip { font-size: 12px; }
  .ln .no { width: 36px; }
  #scriptbody { font-size: 13px; }
  #scripthead select { min-width: 0; max-width: 55%; }
  #tip { max-width: 70vw; }
  #replay { left: 4px; right: 4px; bottom: 4px; }
}
</style>
</head>
<body>
<header>
  <h1>placemat studio <span class="dim" id="script-name"></span></h1>
  <span class="badge" id="status">connecting</span>
  <span class="dim" id="timing"></span>
  <span class="grow"></span>
  <label>face <select id="face"><option value="both">both</option><option value="front">front</option><option value="back">back</option></select></label>
  <span id="layers"></span>
  <button id="fit" title="fit the board to the window">fit</button>
  <button id="layerbtn">layers</button>
</header>
<nav id="ntabs"><button data-nv="board" class="on">Board</button><button data-nv="steps">Steps</button><button data-nv="findings">Findings</button><button data-nv="compare">Compare</button><button data-nv="script">Script</button></nav>
<div id="notice"></div>
<main>
  <div id="boardwrap">
    <svg id="board" xmlns="http://www.w3.org/2000/svg"></svg>
    <div id="replay"><button id="play" title="play the placement">play</button><input type="range" id="slider" min="0" max="0" value="0"><span id="steplabel" class="dim"></span></div>
    <div id="tip"></div>
  </div>
  <div id="side">
    <div class="tabs"><button data-tab="steps" class="on">Steps</button><button data-tab="findings">Findings</button><button data-tab="compare">Compare</button></div>
    <div class="tab on" id="tab-steps"></div>
    <div class="tab" id="tab-findings"></div>
    <div class="tab" id="tab-compare"></div>
    <div id="script">
      <div id="scripthead"><select id="file"></select><span class="dim" id="scriptinfo"></span><span class="grow" style="flex:1"></span><button id="prevchg" title="previous changed line">&uarr;</button><button id="nextchg" title="next changed line">&darr;</button></div>
      <div id="scriptbody"></div>
    </div>
  </div>
</main>
<script>
"use strict";
// ---------------------------------------------------------------- helpers
const $ = s => document.querySelector(s);
const T = new URLSearchParams(location.search).get("t") || "";
const esc = s => String(s == null ? "" : s).replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));
const num = v => (Math.round(v * 1000) / 1000).toString();
const getJSON = url => fetch(url + (url.includes("?") ? "&" : "?") + "t=" + encodeURIComponent(T)).then(r => { if (!r.ok) throw new Error(url + ": " + r.status); return r.json(); });
const MARGIN = 3, GAP = 6;
const COLOUR = {pad: "#e8a33d", through: "#c9a227", courtyard: "#c03cc0", body: "#4a7fc1", silk: "#222222", keepout: "#f2b8c6",
  reservation: "#b8d4f2", track: "#c05050", via: "#8a5a2b", plane: "#d9a0a0", ok: "#2f9e44", over: "#e03131", free: "#999999",
  pocketed: "#f08c00", board: "#333333"};

// ---------------------------------------------------------------- state
const S = {
  hello: null, status: "connecting", resolving: null, stale: false, error: null, changedFiles: [],
  history: [],                 // summaries of the kept resolves
  docs: new Map(),             // id -> {id, doc, texts, changed, timing, reused, notes}
  live: null,                  // the plan being streamed: {id, board, keepouts, reservations, items, steps, copper, ...}
  texts: {}, changed: [],      // the texts and changed files of what is shown
  shownId: null,               // the id of the resolve shown, or null while streaming
  baseId: null,                // the resolve compared against
  cmp: null,                   // {a, b, diff, files, trace}
  follow: true,                // shown follows the latest resolve
  sel: null, marked: new Set(), selLine: null, replay: null, playing: null,
  face: "both", layers: {keepouts: true, courtyards: true, body: true, pads: true, copper: true, links: true, congestion: true, labels: true, changes: true},
  view: null, tab: "steps", file: null, cmpFile: null, sbs: false, openRows: new Set(),
};
const LAYER_NAMES = {keepouts: "keepouts", courtyards: "courtyards", body: "body and silk", pads: "pads", copper: "copper", links: "links", congestion: "congestion", labels: "labels", changes: "changes"};

function plan() {                      // the plan to draw
  if (S.resolving && S.live) return S.live;
  const d = S.docs.get(S.shownId);
  return d ? d.doc : S.live;
}
const itemsOf = p => (p && p.items) || [];
const itemMap = p => new Map(itemsOf(p).map(i => [i.key, i]));

// ---------------------------------------------------------------- scheduling
const dirty = new Set();
let queued = false;
function schedule(...parts) {
  parts.forEach(p => dirty.add(p));
  if (!queued) { queued = true; requestAnimationFrame(() => { queued = false; const d = [...dirty]; dirty.clear(); render(d); }); }
}
function render(parts) {
  const all = parts.includes("all");
  const has = p => all || parts.includes(p);
  if (has("status")) renderStatus();
  if (has("board")) renderBoard();
  if (has("steps")) renderSteps();
  if (has("findings")) renderFindings();
  if (has("compare")) renderCompare();
  if (has("script")) renderScript();
}

// ---------------------------------------------------------------- events
const es = new EventSource("/events?t=" + encodeURIComponent(T));
const on = (name, f) => es.addEventListener(name, e => f(JSON.parse(e.data)));
es.onopen = () => { S.status = S.status === "connecting" ? "waiting" : S.status; schedule("status"); };
es.onerror = () => { S.status = "disconnected"; schedule("status"); };

on("hello", d => {
  S.hello = d; S.history = d.history; S.error = d.error; S.resolving = d.resolving;
  $("#script-name").textContent = d.script;
  schedule("all");
});
on("state", d => {                       // the latest resolve, whole
  const rec = {id: d.id, doc: d.doc, texts: d.texts, changed: d.changed, timing: d.timing, reused: d.reused, notes: d.notes};
  S.docs.set(d.id, rec);
  S.latestId = d.id;
  showResolve(d.id, d.compare);
});
on("changed", d => { S.stale = true; S.changedFiles = d.files; S.status = "stale"; schedule("status", "board"); });
on("started", d => {
  S.resolving = d.id; S.stale = true; S.error = null; S.status = "resolving";
  S.changedFiles = d.stale_files;
  S.texts = d.texts; S.changed = d.changed;
  const prev = plan();
  S.live = {id: d.id, board: prev && prev.board, keepouts: (prev && prev.keepouts) || [], reservations: [], items: [], steps: [], copper: [], links: [],
            congestion: null, findings: [], unplaced: [], pocketed: [], counts: {placed: 0, findings: 0}, score: null, fromStart: true};
  S.live.board = null;
  S.shownId = null; S.cmp = null; S.replay = null;
  S.marked = new Set();
  schedule("all");
});
on("board", d => { if (!S.live || d.id !== S.live.id) return; S.live.board = d.board; S.live.keepouts = d.keepouts; S.live.reservations = d.reservations; if (!S.view) fit(); schedule("board"); });
on("step", d => {
  if (!S.live || d.id !== S.live.id) return;
  const it = d.item, L = S.live;
  const at = L.items.findIndex(i => i.key === it.key);
  if (it.placed) { if (at >= 0) L.items[at] = it; else L.items.push(it); }
  L.steps.push({i: L.steps.length, item: it.key, kind: it.kind, placed: it.placed, note: it.note, freedom: it.freedom, how: it.how});
  if (!it.placed) L.unplaced.push({item: it.key, why: it.note});
  schedule("board", "steps", "script");
});
on("copper", d => { if (S.live && d.id === S.live.id) { S.live.copper = d.copper; schedule("board"); } });
on("links", d => { if (S.live && d.id === S.live.id) { S.live.links = d.links; schedule("board"); } });
on("congestion", d => { if (S.live && d.id === S.live.id) { S.live.congestion = d.congestion; schedule("board"); } });
on("findings", d => { if (S.live && d.id === S.live.id) { S.live.findings = d.findings; schedule("findings"); } });
on("items", d => {
  if (!S.live || d.id !== S.live.id) return;
  Object.assign(S.live, {items: d.items, steps: d.steps, unplaced: d.unplaced, pocketed: d.pocketed, board: d.board, keepouts: d.keepouts, reservations: d.reservations});
  schedule("board", "steps", "script");
});
on("finished", d => {
  const L = S.live;
  if (!L || d.id !== L.id) return;
  L.counts = d.counts; L.score = d.score;
  const rec = {id: d.id, doc: L, texts: S.texts, changed: S.changed, timing: d.timing, reused: d.reused, notes: d.notes};
  S.docs.set(d.id, rec);
  S.latestId = d.id; S.history = d.history; S.resolving = null; S.stale = false; S.status = "live";
  trimDocs();
  if (S.follow) showResolve(d.id, null); else schedule("status", "compare");
});
on("compare", d => {
  if (S.follow && S.shownId === d.b) { setCompare(d); }
});
on("cancelled", d => { if (S.resolving === d.id) { S.resolving = null; S.status = "stale"; schedule("status", "board"); } });
on("superseded", d => { if (S.resolving === d.id) { S.resolving = null; S.status = "stale"; schedule("status", "board"); } });
on("error", d => {
  S.resolving = null; S.error = d; S.status = "error"; S.stale = true;
  const last = S.docs.get(S.latestId);
  if (last && S.follow) { S.shownId = last.id; S.texts = Object.assign({}, last.texts, S.texts); }
  schedule("all");
});

function trimDocs() {
  const keep = new Set(S.history.map(h => h.id));
  for (const id of [...S.docs.keys()]) if (!keep.has(id)) S.docs.delete(id);
}

function showResolve(id, cmp) {
  const rec = S.docs.get(id);
  if (!rec) return;
  S.shownId = id; S.live = null; S.resolving = S.resolving === id ? null : S.resolving;
  S.texts = rec.texts; S.changed = rec.changed;
  S.stale = false; S.error = null; S.status = S.latestId === id ? "live" : "history";
  S.replay = null; S.sel = null; S.marked = new Set();
  const hist = S.history.slice().sort((a, b) => a.id - b.id);
  const at = hist.findIndex(h => h.id === id);
  S.baseId = at > 0 ? hist[at - 1].id : null;
  if (cmp) setCompare(cmp); else if (S.baseId != null) loadCompare(S.baseId, id); else { S.cmp = null; }
  if (!S.view) fit();
  schedule("all");
}
async function loadCompare(a, b) {
  S.baseId = a;
  try {
    for (const id of [a, b]) if (!S.docs.has(id)) S.docs.set(id, await getJSON("/resolve/" + id));
    setCompare(await getJSON("/diff?a=" + a + "&b=" + b));
  } catch (e) { S.cmp = null; schedule("compare", "board"); }
}
function setCompare(c) {
  S.cmp = c; S.baseId = c.a;
  if (!S.cmpFile || !c.files[S.cmpFile]) S.cmpFile = Object.keys(c.files)[0] || null;
  schedule("compare", "board", "script");
}
async function pickShown(id) {
  S.follow = id === S.latestId;
  if (!S.docs.has(id)) S.docs.set(id, await getJSON("/resolve/" + id));
  showResolve(id, null);
}

// ---------------------------------------------------------------- status
function renderStatus() {
  const b = $("#status");
  const label = {live: "live", resolving: "resolving #" + S.resolving, stale: "stale", error: "error", history: "an earlier resolve", waiting: "waiting for the first resolve", connecting: "connecting", disconnected: "disconnected"}[S.status] || S.status;
  b.textContent = label;
  b.className = "badge " + ({live: "live", resolving: "busy", stale: "stale", error: "error", disconnected: "error"}[S.status] || "");
  const rec = S.docs.get(S.shownId);
  $("#timing").textContent = rec && rec.timing ? "#" + rec.id + " resolved in " + rec.timing.total_s + " s (first step " + rec.timing.first_step_s + " s)" + (rec.reused ? " - " + rec.reused : "") : "";
  const n = $("#notice");
  if (S.error) {
    n.className = "err"; n.style.display = "block";
    n.innerHTML = "<b>" + esc(S.error.message) + "</b>" + (S.error.line ? ' <a href="#" id="goerr">' + esc(S.error.file || "") + " line " + S.error.line + "</a>" : "") + (S.error.source ? ' <code>' + esc(String(S.error.source).trim()) + "</code>" : "") + ' <span class="dim">showing the last good plan, stale</span>';
    const a = $("#goerr");
    if (a) a.onclick = e => { e.preventDefault(); gotoLine(S.error.file || S.file, S.error.line); };
  } else if (S.stale) {
    n.className = ""; n.style.display = "block";
    n.textContent = (S.resolving ? "resolving #" + S.resolving : "waiting to resolve") + (S.changedFiles.length ? " - changed: " + S.changedFiles.join(", ") : "");
  } else if (rec && rec.notes && rec.notes.length) {
    n.className = ""; n.style.display = "block"; n.textContent = rec.notes.join("; ");
  } else n.style.display = "none";
  $("#boardwrap").classList.toggle("stale", S.stale && !S.resolving);
}

// ---------------------------------------------------------------- the board
let lay = null;
function layout(p) {
  const e = p && p.board ? p.board.extent : [0, 0, 100, 60];
  const L = e[0] - MARGIN, T0 = e[1] - MARGIN, R = e[2] + MARGIN, B = e[3] + MARGIN;
  const faces = S.face === "both" ? ["front", "back"] : [S.face];
  return {L, T: T0, R, B, W: R - L, H: B - T0, panels: faces.map((f, k) => ({face: f, dx: k * (R - L + GAP), mirror: f === "back"}))};
}
const panelPt = (pn, x, y) => pn.mirror ? [pn.dx + lay.L + lay.R - x, y] : [pn.dx + x, y];
function polyPts(poly) { return poly.map(p => num(p[0]) + "," + num(p[1])).join(" "); }
function bboxOf(polys) {
  let l = 1e9, t = 1e9, r = -1e9, b = -1e9;
  for (const poly of polys) for (const p of poly) { l = Math.min(l, p[0]); t = Math.min(t, p[1]); r = Math.max(r, p[0]); b = Math.max(b, p[1]); }
  return l > r ? null : [l, t, r, b];
}
function itemBox(it) {
  const polys = [];
  for (const m of it.members || []) {
    const c = m.shapes.filter(s => s.kind === "courtyard");
    (c.length ? c : m.shapes).forEach(s => polys.push(s.poly));
  }
  return bboxOf(polys);
}
function visibleKeys(p) {
  if (S.replay == null) return null;
  const out = new Set();
  (p.steps || []).slice(0, S.replay).forEach(s => out.add(s.item));
  return out;
}

function panelSVG(p, pn, first, shown, diffLayer) {
  const f = pn.face, o = [];
  const tr = pn.mirror ? "translate(" + num(pn.dx + lay.L + lay.R) + " 0) scale(-1 1)" : "translate(" + num(pn.dx) + " 0)";
  o.push('<g class="panel ' + f + '" transform="' + tr + '">');
  o.push('<rect x="' + num(lay.L) + '" y="' + num(lay.T) + '" width="' + num(lay.W) + '" height="' + num(lay.H) + '" fill="#fff"/>');
  // grid
  o.push('<g stroke="#e6e6e6" stroke-width="0.05">');
  for (let x = Math.floor(lay.L / 5) * 5; x <= lay.R; x += 5) o.push('<line x1="' + x + '" y1="' + num(lay.T) + '" x2="' + x + '" y2="' + num(lay.B) + '"/>');
  for (let y = Math.floor(lay.T / 5) * 5; y <= lay.B; y += 5) o.push('<line x1="' + num(lay.L) + '" y1="' + y + '" x2="' + num(lay.R) + '" y2="' + y + '"/>');
  o.push("</g>");
  const text = (x, y, s, size, colour, cls) => {
    const t = pn.mirror ? ' transform="translate(' + num(x) + " " + num(y) + ') scale(-1 1)" x="0" y="0"' : ' x="' + num(x) + '" y="' + num(y) + '"';
    return '<text class="' + cls + '"' + t + ' font-size="' + size + '" text-anchor="middle" dominant-baseline="middle" fill="' + colour + '">' + esc(s) + "</text>";
  };
  for (let x = Math.ceil(lay.L / 10) * 10; x <= lay.R; x += 10) o.push(text(x, lay.B - 0.9, x, 0.9, "#999", "axis"));
  for (let y = Math.ceil(lay.T / 10) * 10; y <= lay.B; y += 10) o.push(text(lay.L + 1.4, y, y, 0.9, "#999", "axis"));
  if (p.board && p.board.loops.length) {
    o.push('<path d="' + p.board.loops.map(l => "M " + polyPts(l).replace(/ /g, " L ") + " Z").join(" ") + '" fill="#fbfaf5" fill-rule="evenodd" stroke="' + COLOUR.board + '" stroke-width="0.15"' + (p.board.drawn ? "" : ' stroke-dasharray="0.4 0.4"') + "/>");
  }
  const full = shown === null;
  if (S.layers.congestion && first && full && p.congestion && p.congestion.cells) {
    const c = p.congestion, cs = c.cell;
    o.push('<g class="heat">');
    for (const [i, j, u] of c.cells) {
      const t = Math.min(u, 1.5) / 1.5;
      o.push('<rect x="' + num(c.origin[0] + i * cs) + '" y="' + num(c.origin[1] + j * cs) + '" width="' + cs + '" height="' + cs + '" fill="rgb(255,' + Math.round(240 * (1 - t) + 15) + "," + Math.round(160 * (1 - t)) + ')" fill-opacity="' + (0.25 + 0.4 * t).toFixed(2) + '"/>');
    }
    o.push("</g>");
    o.push('<circle cx="' + c.worst_at[0] + '" cy="' + c.worst_at[1] + '" r="' + num(cs * 1.6) + '" fill="none" stroke="#c92a2a" stroke-width="0.15"/>');
  }
  if (S.layers.keepouts) {
    for (const k of p.keepouts || []) {
      o.push('<polygon points="' + polyPts(k.poly) + '" fill="' + COLOUR.keepout + '" fill-opacity="0.45" stroke="#d6336c" stroke-width="0.08"/>');
      const b = bboxOf([k.poly]);
      if (b && S.layers.labels) o.push(text((b[0] + b[2]) / 2, (b[1] + b[3]) / 2, k.name, 0.8, "#a61e1e", "keepout-label"));
    }
    for (const r of p.reservations || []) {
      if (r.face && r.face !== f) continue;
      o.push('<polygon points="' + polyPts(r.poly) + '" fill="' + COLOUR.reservation + '" fill-opacity="0.2" stroke="#4c6ef5" stroke-width="0.05" stroke-dasharray="0.3 0.3"><title>' + esc(r.why) + "</title></polygon>");
    }
  }
  if (S.layers.copper && full) o.push(copperSVG(p.copper || [], f, text, ""));
  const items = itemsOf(p);
  for (const it of items) {
    if (shown && !shown.has(it.key)) continue;
    const cls = "item" + (S.sel === it.key ? " sel" : "") + (S.marked.has(it.key) ? " marked" : "") + (S.marked.size && !S.marked.has(it.key) && S.sel !== it.key ? " faded" : "");
    o.push('<g class="' + cls + '" data-key="' + esc(it.key) + '">');
    for (const m of it.members) {
      for (const s of m.shapes) {
        if (!s.faces.includes(f)) continue;
        if (s.kind === "courtyard" && S.layers.courtyards) o.push('<polygon class="courtyard" points="' + polyPts(s.poly) + '" fill="rgba(192,60,192,0.05)" stroke="' + COLOUR.courtyard + '" stroke-width="0.06" stroke-dasharray="0.25 0.2"/>');
        else if (s.kind === "body" && S.layers.body) o.push('<polygon points="' + polyPts(s.poly) + '" fill="none" stroke="' + COLOUR.body + '" stroke-width="0.07"/>');
        else if (s.kind === "silk" && S.layers.body) o.push('<polygon points="' + polyPts(s.poly) + '" fill="' + COLOUR.silk + '"/>');
        else if ((s.kind === "pad" || s.kind === "through") && S.layers.pads) o.push('<polygon points="' + polyPts(s.poly) + '" fill="' + COLOUR[s.kind] + '"/>');
      }
      if (S.layers.labels) {
        const c = m.shapes.filter(s => s.kind === "courtyard" && s.faces.includes(f));
        const b = bboxOf((c.length ? c : m.shapes.filter(s => s.faces.includes(f))).map(s => s.poly));
        if (b) o.push(text((b[0] + b[2]) / 2, (b[1] + b[3]) / 2, m.ref, 0.9, "#1f3b73", "ref"));
      }
    }
    if ((p.pocketed || []).includes(it.key)) {
      const b = itemBox(it);
      if (b) o.push('<rect x="' + num(b[0] - 0.3) + '" y="' + num(b[1] - 0.3) + '" width="' + num(b[2] - b[0] + 0.6) + '" height="' + num(b[3] - b[1] + 0.6) + '" fill="none" stroke="' + COLOUR.pocketed + '" stroke-width="0.12" stroke-dasharray="0.4 0.25"/>');
    }
    o.push("</g>");
  }
  if (S.layers.links && full) {
    o.push('<g class="links">');
    for (const l of p.links || []) {
      o.push('<line x1="' + l.pa[0] + '" y1="' + l.pa[1] + '" x2="' + l.pb[0] + '" y2="' + l.pb[1] + '" stroke="' + COLOUR[l.state] + '" stroke-width="0.12" stroke-dasharray="0.5 0.25"><title>' + esc(l.a.join(".") + " - " + l.b.join(".") + "  " + l.length + " mm" + (l.limit != null ? " (limit " + l.limit + ")" : "") + (l.why ? "  " + l.why : "")) + "</title></line>");
    }
    o.push("</g>");
  }
  o.push(diffLayer(f, text));
  o.push("</g>");
  return o.join("");
}

function copperSVG(ops, f, text, mode) {
  const o = ['<g class="copper">'];
  const extra = mode === "added" ? ' stroke-dasharray="none"' : "";
  const col = mode === "added" ? "#2f9e44" : mode === "removed" ? "#d63333" : null;
  for (const c of ops) {
    if (c.t === "track" && (c.face === f || c.face === "inner")) {
      const op = c.face === "inner" ? "0.4" : "1", stroke = col || COLOUR.track, dash = mode === "removed" ? ' stroke-dasharray="0.4 0.3"' : "";
      if (c.arc) o.push('<path d="M ' + c.a[0] + " " + c.a[1] + " A " + c.arc[0] + " " + c.arc[0] + " 0 " + c.arc[1] + " " + c.arc[2] + " " + c.b[0] + " " + c.b[1] + '" fill="none" stroke="' + stroke + '" stroke-width="' + c.width + '" stroke-linecap="round" stroke-opacity="' + op + '"' + dash + "/>");
      else o.push('<line x1="' + c.a[0] + '" y1="' + c.a[1] + '" x2="' + c.b[0] + '" y2="' + c.b[1] + '" stroke="' + stroke + '" stroke-width="' + c.width + '" stroke-linecap="round" stroke-opacity="' + op + '"' + dash + "/>");
    } else if (c.t === "via") {
      o.push('<circle cx="' + c.at[0] + '" cy="' + c.at[1] + '" r="' + num(c.size / 2) + '" fill="' + (col || COLOUR.via) + '" stroke="#fff" stroke-width="' + num(Math.max(c.size - c.drill, 0.05) / 4) + '"' + (mode === "removed" ? ' fill-opacity="0.6"' : "") + "/>");
    } else if ((c.t === "plane" || c.t === "pour") && (c.face === f || c.face === "inner") && !mode) {
      o.push('<polygon points="' + polyPts(c.points) + '" fill="none" stroke="' + COLOUR.plane + '" stroke-width="0.1" stroke-dasharray="0.6 0.3"/>');
    } else if (c.t === "text" && c.face === f && !mode && S.layers.labels) {
      o.push(text(c.at[0], c.at[1], c.text, Math.max(c.size, 0.6), COLOUR.silk, "silk-text"));
    }
  }
  o.push("</g>");
  return o.join("");
}

// The diagram diff: what `diff` (diff_plans) says changed, drawn over the plan shown. Takes the diff and the old
// and new items, so it serves any two sets of placements (a whole resolve, or a partial set of variants).
function diffLayerSVG(diff, itemsA, itemsB, f, text) {
  const o = ['<g class="changes">'];
  const polysOf = (it, kinds) => (it.members || []).flatMap(m => m.shapes.filter(s => kinds.includes(s.kind) && s.faces.includes(f)));
  for (const m of diff.moved) {
    const old = itemsA.get(m.key);
    if (old) for (const s of polysOf(old, ["courtyard"])) o.push('<polygon points="' + polyPts(s.poly) + '" fill="rgba(74,127,193,0.12)" stroke="#4a7fc1" stroke-width="0.12" stroke-dasharray="0.4 0.3"/>');
    if (m.distance > 0 && m.from.at && m.to.at && (m.from.face === f || m.to.face === f || true)) {
      o.push('<line x1="' + m.from.at[0] + '" y1="' + m.from.at[1] + '" x2="' + m.to.at[0] + '" y2="' + m.to.at[1] + '" stroke="#4a7fc1" stroke-width="0.18" marker-end="url(#arrow)"/>');
    }
  }
  for (const a of diff.added) {
    const it = itemsB.get(a.key);
    if (it) for (const s of polysOf(it, ["courtyard"])) o.push('<polygon points="' + polyPts(s.poly) + '" fill="rgba(47,158,68,0.15)" stroke="#2f9e44" stroke-width="0.25"/>');
  }
  for (const r of diff.removed) {
    const it = itemsA.get(r.key);
    if (it) for (const s of polysOf(it, ["courtyard"])) o.push('<polygon points="' + polyPts(s.poly) + '" fill="rgba(214,51,51,0.12)" stroke="#d63333" stroke-width="0.25" stroke-dasharray="0.5 0.3"/>');
  }
  o.push(copperSVG(diff.copper.removed, f, text, "removed"), copperSVG(diff.copper.added, f, text, "added"));
  for (const [list, colour] of [[diff.findings.gained, "#d63333"], [diff.findings.lost, "#2f9e44"]]) {
    for (const g of list) if (g.at) o.push('<circle cx="' + g.at[0] + '" cy="' + g.at[1] + '" r="0.8" fill="none" stroke="' + colour + '" stroke-width="0.2"><title>' + esc(g.text) + "</title></circle>");
  }
  o.push("</g>");
  return o.join("");
}

function renderBoard() {
  const p = plan();
  const svg = $("#board");
  if (!p || !p.board) { svg.innerHTML = ""; return; }
  lay = layout(p);
  const shown = visibleKeys(p);
  const showDiff = S.layers.changes && S.cmp && !S.resolving && S.cmp.b === S.shownId && !S.cmp.diff.empty && shown === null;
  const itemsA = showDiff && S.docs.get(S.cmp.a) ? itemMap(S.docs.get(S.cmp.a).doc) : new Map();
  const itemsB = itemMap(p);
  const diffLayer = showDiff ? (f, text) => diffLayerSVG(S.cmp.diff, itemsA, itemsB, f, text) : () => "";
  const defs = '<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="1" markerHeight="1" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7fc1"/></marker></defs>';
  const prevView = svg.getAttribute("viewBox");
  svg.innerHTML = defs + lay.panels.map((pn, k) => panelSVG(p, pn, k === 0, shown, diffLayer)).join("");
  if (!S.view) fit(); else applyView();
}
function fit() {
  if (!lay) { const p = plan(); if (!p || !p.board) return; lay = layout(p); }
  const w = lay.panels.length * lay.W + (lay.panels.length - 1) * GAP;
  S.view = {x: lay.L, y: lay.T, w, h: lay.H};
  applyView();
}
function applyView() {
  const svg = $("#board"), v = S.view;
  if (!v) return;
  const r = svg.getBoundingClientRect();
  if (!r.width || !r.height) return;                 // hidden: the view is applied when it is shown again
  const aspect = r.width / r.height;
  let w = v.w, h = v.h;
  if (w / h < aspect) w = h * aspect; else h = w / aspect;
  svg.setAttribute("viewBox", [v.x - (w - v.w) / 2, v.y - (h - v.h) / 2, w, h].map(num).join(" "));
  S.vb = {x: v.x - (w - v.w) / 2, y: v.y - (h - v.h) / 2, w, h};
}
function zoomTo(box) {
  if (!box || !lay) return;
  const pn = lay.panels[0];
  const a = panelPt(pn, box[0], box[1]), b = panelPt(pn, box[2], box[3]);
  const pad = Math.max(5, 0.5 * Math.max(Math.abs(b[0] - a[0]), Math.abs(b[1] - a[1])));
  const x0 = Math.min(a[0], b[0]) - pad, y0 = Math.min(a[1], b[1]) - pad, x1 = Math.max(a[0], b[0]) + pad, y1 = Math.max(a[1], b[1]) + pad;
  S.view = {x: x0, y: y0, w: x1 - x0, h: y1 - y0};
  applyView();
}
function zoomItems(keys) {
  const m = itemMap(plan()), bs = [];
  for (const k of keys) { const it = m.get(k), b = it && itemBox(it); if (b) bs.push(b); }
  if (bs.length) zoomTo([Math.min(...bs.map(b => b[0])), Math.min(...bs.map(b => b[1])), Math.max(...bs.map(b => b[2])), Math.max(...bs.map(b => b[3]))]);
}

// pan and zoom
(function () {
  const svg = $("#board");
  let drag = null;
  svg.addEventListener("wheel", e => {
    e.preventDefault();
    const v = S.vb; if (!v) return;
    const r = svg.getBoundingClientRect();
    const px = v.x + (e.clientX - r.left) / r.width * v.w, py = v.y + (e.clientY - r.top) / r.height * v.h;
    const k = Math.exp(e.deltaY * 0.0015);
    S.view = {x: px - (px - v.x) * k, y: py - (py - v.y) * k, w: v.w * k, h: v.h * k};
    applyView();
  }, {passive: false});
  svg.addEventListener("pointerdown", e => { drag = {x: e.clientX, y: e.clientY, moved: false, vb: S.vb}; svg.setPointerCapture(e.pointerId); });
  svg.addEventListener("pointermove", e => {
    if (drag) {
      const r = svg.getBoundingClientRect(), dx = e.clientX - drag.x, dy = e.clientY - drag.y;
      if (Math.abs(dx) + Math.abs(dy) > 3) { drag.moved = true; svg.classList.add("drag"); hideTip(); }
      if (drag.moved) { S.view = {x: drag.vb.x - dx / r.width * drag.vb.w, y: drag.vb.y - dy / r.height * drag.vb.h, w: drag.vb.w, h: drag.vb.h}; applyView(); }
      return;
    }
    hover(e);
  });
  svg.addEventListener("pointerup", e => {
    const moved = drag && drag.moved; drag = null; svg.classList.remove("drag");
    if (!moved) { const t = document.elementFromPoint(e.clientX, e.clientY), g = t && t.closest(".item"); selectItem(g ? g.dataset.key : null, {zoom: false}); }
  });
  svg.addEventListener("pointerleave", hideTip);
})();

// hover
function hover(e) {
  const g = e.target.closest && e.target.closest(".item");
  if (!g) { hideTip(); return; }
  const p = plan(), it = itemMap(p).get(g.dataset.key);
  if (!it) { hideTip(); return; }
  const refs = new Set(it.members.map(m => m.ref));
  const links = (p.links || []).filter(l => refs.has(l.a[0]) || refs.has(l.b[0]));
  const lines = [it.key + (it.members.length === 1 && it.members[0].value ? "  " + it.members[0].value : ""),
    it.members.length > 1 ? "cell/block of " + it.members.length + ": " + it.members.map(m => m.ref).join(" ") : (it.members[0] && it.members[0].cell ? "cell " + it.members[0].cell : ""),
    it.face + ", rotation " + it.rotation + (it.how ? ", " + it.how + (it.freedom ? " (" + it.freedom + ")" : "") : ""),
    it.note ? it.note : ""];
  for (const f of it.findings || []) lines.push("finding: " + f);
  if (links.length) { lines.push("links:"); links.slice(0, 8).forEach(l => lines.push("  " + l.a.join(".") + " - " + l.b.join(".") + "  " + l.length + " mm" + (l.limit != null ? " / " + l.limit : ""))); if (links.length > 8) lines.push("  ... " + (links.length - 8) + " more"); }
  if (it.file) lines.push(it.file + ":" + it.line);
  const tip = $("#tip"), r = $("#boardwrap").getBoundingClientRect();
  tip.textContent = lines.filter(Boolean).join("\n");
  tip.style.display = "block";
  tip.style.left = Math.min(e.clientX - r.left + 14, r.width - 370) + "px";
  tip.style.top = Math.min(e.clientY - r.top + 14, r.height - tip.offsetHeight - 6) + "px";
}
function hideTip() { $("#tip").style.display = "none"; }

// ---------------------------------------------------------------- selection
function selectItem(key, opt = {}) {
  S.sel = key; S.selLine = null;
  if (key) {
    const p = plan(), it = itemMap(p).get(key);
    S.marked = S.cmp && S.cmp.trace.items[key] ? new Set([key]) : new Set();
    if (it && opt.zoom) zoomItems([key]);
    if (it && it.file) { S.file = it.file; }
  } else S.marked = new Set();
  schedule("board", "steps", "script", "compare", "findings");
  if (key) setTimeout(() => { const r = $("#tab-steps .row.sel"); if (r) r.scrollIntoView({block: "nearest"}); const l = $("#scriptbody .decl, #scriptbody .chgdecl"); if (l) l.scrollIntoView({block: "center"}); }, 30);
}
function markItems(keys, zoom) {
  S.marked = new Set(keys); S.sel = keys[0] || null;
  if (zoom) zoomItems(keys);
  schedule("board", "steps", "script", "compare");
}

// ---------------------------------------------------------------- steps
function renderSteps() {
  const p = plan(), el = $("#tab-steps");
  if (!p) { el.innerHTML = '<div class="pad8 dim">waiting for the first resolve</div>'; return; }
  const steps = p.steps || [];
  const slider = $("#slider");
  slider.max = steps.length; if (S.replay == null) slider.value = steps.length; else slider.value = S.replay;
  $("#steplabel").textContent = S.replay == null ? steps.length + " steps" : "step " + S.replay + " of " + steps.length + (steps[S.replay - 1] ? ": " + steps[S.replay - 1].item : "");
  const rows = steps.map((s, i) => {
    const how = !s.placed && (s.kind === "part" || s.kind === "cell") ? "unplaced" : s.kind === "copper" ? "copper" : (s.how || (p.pocketed && p.pocketed.includes(s.item) ? "pocket" : s.freedom === "searched" ? "searched" : s.freedom ? "decided" : s.kind));
    const later = S.replay != null && i >= S.replay;
    return '<div class="row' + (S.sel === s.item ? " sel" : "") + (later ? " later" : "") + (S.openRows.has(i) ? " open" : "") + '" data-i="' + i + '" data-item="' + esc(s.item) + '"><span class="dim" style="width:26px;text-align:right;flex:none">' + (i + 1) + '</span><span class="k">' + esc(s.item) + '</span><span class="chip ' + how + '">' + esc(how) + '</span><span class="n">' + esc(s.note) + "</span></div>";
  });
  const unplaced = (p.unplaced || []).length ? '<h3>not placed</h3>' + p.unplaced.map(u => '<div class="row" data-item="' + esc(u.item) + '"><span class="k">' + esc(u.item) + '</span><span class="n">' + esc(u.why) + "</span></div>").join("") : "";
  el.innerHTML = rows.join("") + unplaced;
  el.onclick = e => {
    const r = e.target.closest(".row"); if (!r) return;
    if (r.dataset.i != null) { const i = +r.dataset.i; if (S.openRows.has(i)) S.openRows.delete(i); else S.openRows.add(i); }
    const key = r.dataset.item;
    if (itemMap(plan()).has(key)) selectItem(key, {zoom: true}); else schedule("steps");
  };
}
$("#slider").addEventListener("input", e => { const n = +e.target.value, steps = (plan() || {}).steps || []; S.replay = n >= steps.length ? null : n; schedule("board", "steps"); });
$("#play").addEventListener("click", () => {
  if (S.playing) { clearInterval(S.playing); S.playing = null; $("#play").textContent = "play"; return; }
  const steps = (plan() || {}).steps || [];
  S.replay = 0; $("#play").textContent = "stop";
  S.playing = setInterval(() => {
    S.replay = (S.replay || 0) + 1;
    if (S.replay >= steps.length) { S.replay = null; clearInterval(S.playing); S.playing = null; $("#play").textContent = "play"; }
    schedule("board", "steps");
  }, 160);
});

// ---------------------------------------------------------------- findings
function renderFindings() {
  const p = plan(), el = $("#tab-findings");
  const fs = (p && p.findings) || [];
  if (!fs.length) { el.innerHTML = '<div class="pad8 dim">no findings</div>'; return; }
  el.innerHTML = fs.map((f, i) => '<div class="row" data-i="' + i + '"><span class="chip">' + esc(f.kind || "finding") + '</span><span class="n" style="white-space:normal">' + esc(f.text) + "</span></div>").join("");
  el.onclick = e => {
    const r = e.target.closest(".row"); if (!r) return;
    const f = fs[+r.dataset.i];
    if (f.at) { zoomTo([f.at[0] - 2, f.at[1] - 2, f.at[0] + 2, f.at[1] + 2]); }
    if (f.item) selectItem(f.item, {zoom: !f.at});
  };
}

// ---------------------------------------------------------------- script
function declIndex(p) {
  const out = {};
  for (const it of itemsOf(p)) {
    if (!it.file || !it.line) continue;
    const span = it.span || [it.line, it.line];
    const f = out[it.file] || (out[it.file] = {});
    for (let n = span[0]; n <= span[1]; n++) (f[n] || (f[n] = [])).push(it.key);
  }
  return out;
}
// What the file select lists: the layout script and the Python modules it imports, the files the line diff and the
// line links apply to; the toml, lock and board files that are watched too are not shown.
function scriptFiles(texts) { return Object.keys(texts || {}).filter(n => /\.py$/.test(n)); }
function renderScript() {
  const names = scriptFiles(S.texts);
  const sel = $("#file");
  if (!names.includes(S.file)) S.file = (S.hello && names.includes(S.hello.script)) ? S.hello.script : names[0];
  if (sel.dataset.names !== names.join("|")) { sel.innerHTML = names.map(n => "<option>" + esc(n) + "</option>").join(""); sel.dataset.names = names.join("|"); }
  sel.value = S.file;
  const body = $("#scriptbody");
  const text = S.texts[S.file];
  if (text == null) { body.innerHTML = ""; return; }
  const p = plan(), idx = declIndex(p)[S.file] || {};
  const it = S.sel ? itemMap(p).get(S.sel) : null;
  const span = it && it.file === S.file ? (it.span || [it.line, it.line]) : null;
  const cmpf = S.cmp && S.cmp.files[S.file];
  const chg = new Set(cmpf ? cmpf.changed_new : []);
  const trItem = it && S.cmp && S.cmp.trace.items[it.key];
  const chgDecl = new Set(trItem && it.file === S.file ? trItem.lines.new : []);
  const lines = text.split("\n");
  if (lines.length && lines[lines.length - 1] === "") lines.pop();
  body.innerHTML = lines.map((l, i) => {
    const n = i + 1;
    const cls = "ln" + (chgDecl.has(n) ? " chgdecl" : span && n >= span[0] && n <= span[1] ? " decl" : "") + (chg.has(n) ? " chg" : "") + (S.selLine && S.selLine.file === S.file && S.selLine.n === n ? " sel" : "");
    return '<div class="' + cls + '" data-n="' + n + '"><span class="no">' + n + '</span><span class="dot">' + (idx[n] ? "&#9679;" : "") + '</span><span class="tx">' + esc(l) + "</span></div>";
  }).join("");
  $("#scriptinfo").textContent = cmpf ? "+" + cmpf.added + " -" + cmpf.removed + " since #" + S.cmp.a : "";
  body.onclick = e => {
    const r = e.target.closest(".ln"); if (!r) return;
    const n = +r.dataset.n;
    S.selLine = {file: S.file, n};
    const keys = new Set(idx[n] || []);
    const t = S.cmp && S.cmp.trace.lines[S.file] && S.cmp.trace.lines[S.file].new[String(n)];
    (t || []).forEach(k => keys.add(k));
    if (keys.size) { S.marked = keys; S.sel = [...keys][0]; zoomItems([...keys]); } else { S.marked = new Set(); S.sel = null; }
    schedule("board", "steps", "script", "compare");
  };
}
$("#file").addEventListener("change", e => { S.file = e.target.value; schedule("script"); });
function gotoLine(file, n) {
  if (file && S.texts[file] != null) S.file = file;
  S.selLine = {file: S.file, n};
  schedule("script");
  setTimeout(() => { const l = $('#scriptbody .ln[data-n="' + n + '"]'); if (l) l.scrollIntoView({block: "center"}); }, 30);
}
function stepChange(dir) {
  const c = S.cmp && S.cmp.files[S.file]; if (!c || !c.changed_new.length) return;
  const cur = S.selLine && S.selLine.file === S.file ? S.selLine.n : 0;
  const ls = c.changed_new;
  const next = dir > 0 ? (ls.find(n => n > cur) || ls[0]) : ([...ls].reverse().find(n => n < cur) || ls[ls.length - 1]);
  gotoLine(S.file, next);
}
$("#nextchg").onclick = () => stepChange(1);
$("#prevchg").onclick = () => stepChange(-1);

// ---------------------------------------------------------------- compare
function renderCompare() {
  const el = $("#tab-compare");
  const hist = S.history.slice().sort((a, b) => a.id - b.id);
  const opt = (sel, none) => (none ? '<option value="">none</option>' : "") + hist.map(h => '<option value="' + h.id + '"' + (h.id === sel ? " selected" : "") + ">#" + h.id + " " + new Date(h.at * 1000).toLocaleTimeString() + (h.changed.length ? " (" + h.changed.length + " file" + (h.changed.length > 1 ? "s" : "") + " changed)" : "") + "</option>").join("");
  const head = '<div class="pad8">compare <select id="cmpA">' + opt(S.baseId, true) + '</select> with <select id="cmpB">' + opt(S.shownId, false) + "</select></div>";
  let out = head;
  if (S.changed && S.changed.length) {
    out += "<h3>changed since the resolve before</h3>" + S.changed.map(c => '<div class="row" data-file="' + esc(c.file) + '"><span class="k">' + esc(c.file) + '</span><span class="n"><span class="add">+' + c.added + '</span> <span class="del">-' + c.removed + "</span> " + esc(c.status) + "</span></div>").join("");
  }
  const c = S.cmp;
  if (!c) { el.innerHTML = out + '<div class="pad8 dim">' + (hist.length < 2 ? "one resolve so far: nothing to compare yet" : "pick two resolves") + "</div>"; wireCompare(el); return; }
  const d = c.diff;
  out += '<div class="sum"><b>#' + c.a + " to #" + c.b + "</b>" + (d.empty ? '<span class="dim">no change in the plan</span>' : "") +
    (d.moved.length ? "<span>" + d.moved.length + " moved</span>" : "") + (d.added.length ? '<span class="add">' + d.added.length + " added</span>" : "") + (d.removed.length ? '<span class="del">' + d.removed.length + " removed</span>" : "") +
    (d.copper.added.length || d.copper.removed.length ? '<span>copper <span class="add">+' + d.copper.added.length + '</span> <span class="del">-' + d.copper.removed.length + "</span></span>" : "") +
    (d.findings.gained.length || d.findings.lost.length ? '<span>findings <span class="del">+' + d.findings.gained.length + '</span> <span class="add">-' + d.findings.lost.length + "</span></span>" : "") +
    (d.score ? "<span>score " + d.score.a + " to " + d.score.b + ' (<span class="' + (d.score.delta < 0 ? "add" : "del") + '">' + (d.score.delta > 0 ? "+" : "") + d.score.delta + "</span>)</span>" : "") +
    (d.congestion ? "<span>worst congestion " + d.congestion.a + " to " + d.congestion.b + "</span>" : "") + "</div>";
  const tr = c.trace.items;
  const itemRow = (e, label) => {
    const t = tr[e.key], ln = t ? t.lines.new.concat(t.lines.old.filter(n => !t.lines.new.includes(n))) : [];
    return '<div class="row' + (S.sel === e.key ? " sel" : "") + '" data-item="' + esc(e.key) + '"><span class="k">' + esc(e.key) + '</span><span class="n">' + label + (t ? (ln.length ? " - declared on changed line" + (ln.length > 1 ? "s " : " ") + ln.join(", ") : " - moved by something else the change did") : "") + "</span></div>";
  };
  if (d.moved.length) out += "<h3>moved</h3>" + d.moved.map(m => itemRow(m, m.distance + " mm" + (m.turned ? ", turned " + m.from.rotation + " to " + m.to.rotation : "") + (m.flipped ? ", flipped to " + m.to.face : ""))).join("");
  if (d.added.length) out += "<h3>added</h3>" + d.added.map(a => itemRow(a, "at " + a.at.join(", "))).join("");
  if (d.removed.length) out += "<h3>removed</h3>" + d.removed.map(a => itemRow(a, "was at " + a.at.join(", "))).join("");
  if (d.findings.gained.length) out += "<h3>findings gained</h3>" + d.findings.gained.map(f => '<div class="row" data-at="' + (f.at || "") + '" data-item="' + esc(f.item) + '"><span class="n del" style="white-space:normal">' + esc(f.text) + "</span></div>").join("");
  if (d.findings.lost.length) out += "<h3>findings lost</h3>" + d.findings.lost.map(f => '<div class="row"><span class="n add" style="white-space:normal">' + esc(f.text) + "</span></div>").join("");
  const names = Object.keys(c.files);
  if (names.length) {
    out += "<h3>lines</h3>" + '<div class="pad8">' + names.map(n => '<button class="fbtn' + (n === S.cmpFile ? " on" : "") + '" data-f="' + esc(n) + '"' + (n === S.cmpFile ? ' style="font-weight:600"' : "") + ">" + esc(n) + " (+" + c.files[n].added + " -" + c.files[n].removed + ")</button>").join(" ") +
      ' <label><input type="checkbox" id="sbs"' + (S.sbs ? " checked" : "") + "> side by side</label></div>" + diffTable(c, S.cmpFile);
  } else out += '<div class="pad8 dim">no file changed between these two</div>';
  el.innerHTML = out;
  wireCompare(el);
}
function diffTable(c, file) {
  const fd = c.files[file]; if (!fd) return "";
  const trl = c.trace.lines[file] || {new: {}, old: {}};
  const mark = (side, n) => n != null && trl[side][String(n)] ? trl[side][String(n)].length : 0;
  const cur = S.selLine;
  const o = ['<table class="diff">'];
  for (const h of fd.hunks) {
    o.push('<tr class="hunk"><td colspan="' + (S.sbs ? 6 : 5) + '">@@ -' + h.old_start + "," + h.old_len + " +" + h.new_start + "," + h.new_len + " @@</td></tr>");
    if (!S.sbs) {
      for (const r of h.lines) {
        const side = r.tag === "-" ? "old" : "new", n = r.tag === "-" ? r.old : r.new, k = mark(side, n);
        o.push('<tr class="' + (r.tag === "+" ? "p" : r.tag === "-" ? "m" : "") + '"><td class="no" data-side="old" data-n="' + (r.old || "") + '">' + (r.old || "") + '</td><td class="no" data-side="new" data-n="' + (r.new || "") + '">' + (r.new || "") + '</td><td class="link" title="' + k + ' item(s)">' + (k ? "&#9679;" : "") + '</td><td>' + (r.tag === " " ? "" : r.tag) + '</td><td class="tx" data-side="' + side + '" data-n="' + n + '">' + esc(r.text) + "</td></tr>");
      }
    } else {
      const rows = h.lines; let i = 0;
      while (i < rows.length) {
        if (rows[i].tag === " ") { const r = rows[i++]; o.push("<tr>" + cell("old", r.old, r.text, "") + cell("new", r.new, r.text, "") + "</tr>"); continue; }
        const del = [], add = [];
        while (i < rows.length && rows[i].tag === "-") del.push(rows[i++]);
        while (i < rows.length && rows[i].tag === "+") add.push(rows[i++]);
        for (let j = 0; j < Math.max(del.length, add.length); j++) o.push("<tr>" + (del[j] ? cell("old", del[j].old, del[j].text, "m") : "<td></td><td></td><td></td>") + (add[j] ? cell("new", add[j].new, add[j].text, "p") : "<td></td><td></td><td></td>") + "</tr>");
      }
    }
  }
  function cell(side, n, text, cls) {
    const k = mark(side, n);
    return '<td class="no" data-side="' + side + '" data-n="' + n + '">' + n + '</td><td class="link">' + (k ? "&#9679;" : "") + '</td><td class="tx ' + (side === "old" ? "l " : "r ") + cls + '" data-side="' + side + '" data-n="' + n + '">' + esc(text) + "</td>";
  }
  o.push("</table>");
  return o.join("");
}
function wireCompare(el) {
  const a = $("#cmpA"), b = $("#cmpB");
  if (a) a.onchange = () => { if (a.value) loadCompare(+a.value, +b.value); else { S.cmp = null; S.baseId = null; schedule("compare", "board", "script"); } };
  if (b) b.onchange = async () => { const id = +b.value; await pickShown(id); if (a && a.value) loadCompare(+a.value, id); };
  el.querySelectorAll(".fbtn").forEach(x => x.onclick = () => { S.cmpFile = x.dataset.f; schedule("compare"); });
  const sbs = $("#sbs"); if (sbs) sbs.onchange = () => { S.sbs = sbs.checked; schedule("compare"); };
  el.onclick = e => {
    const td = e.target.closest("td[data-n]");
    if (td && td.dataset.n) {
      const side = td.dataset.side, n = td.dataset.n, c = S.cmp, keys = c && c.trace.lines[S.cmpFile] ? (c.trace.lines[S.cmpFile][side][n] || []) : [];
      S.selLine = null;
      if (side === "new") gotoLine(S.cmpFile, +n);
      if (keys.length) markItems(keys, true); else { S.marked = new Set(); S.sel = null; schedule("board", "script"); }
      return;
    }
    const r = e.target.closest(".row"); if (!r) return;
    if (r.dataset.file) { S.cmpFile = r.dataset.file; schedule("compare"); return; }
    if (r.dataset.at) { const [x, y] = r.dataset.at.split(",").map(Number); zoomTo([x - 2, y - 2, x + 2, y + 2]); }
    if (r.dataset.item && itemMap(plan()).has(r.dataset.item)) selectItem(r.dataset.item, {zoom: true});
  };
}

// ---------------------------------------------------------------- chrome
document.querySelectorAll(".tabs button").forEach(b => b.onclick = () => {
  S.tab = b.dataset.tab;
  document.querySelectorAll(".tabs button").forEach(x => x.classList.toggle("on", x === b));
  document.querySelectorAll(".tab").forEach(t => t.classList.toggle("on", t.id === "tab-" + S.tab));
});
$("#layers").innerHTML = Object.keys(LAYER_NAMES).map(k => '<label><input type="checkbox" data-layer="' + k + '" checked> ' + LAYER_NAMES[k] + "</label>").join(" ");
$("#layers").addEventListener("change", e => { const k = e.target.dataset.layer; if (k) { S.layers[k] = e.target.checked; schedule("board"); } });
$("#face").addEventListener("change", e => { S.face = e.target.value; lay = null; schedule("board"); setTimeout(fit, 0); });
$("#fit").onclick = fit;
$("#layerbtn").onclick = () => $("#layers").classList.toggle("open");
function showNarrow(v) {
  document.body.dataset.nv = v;
  document.querySelectorAll("#ntabs button").forEach(x => x.classList.toggle("on", x.dataset.nv === v));
  if (v !== "board") { S.tab = v === "script" ? S.tab : v; document.querySelectorAll(".tabs button").forEach(x => x.classList.toggle("on", x.dataset.tab === S.tab)); document.querySelectorAll(".tab").forEach(t => t.classList.toggle("on", t.id === "tab-" + S.tab)); }
  schedule("all");
  if (v === "board") requestAnimationFrame(applyView);
}
document.querySelectorAll("#ntabs button").forEach(b => b.onclick = () => showNarrow(b.dataset.nv));
if (matchMedia("(max-width: 900px)").matches) { S.face = "front"; $("#face").value = "front"; }   // one face fills a narrow screen
showNarrow("board");
window.addEventListener("resize", applyView);
if (window.ResizeObserver) new ResizeObserver(() => applyView()).observe($("#boardwrap"));   // the notice and the tab bar change its height
schedule("all");
</script>
