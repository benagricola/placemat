<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>placemat studio</title>
<style>
:root {
  color-scheme: light dark;
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
  /* chrome */
  --bg: #f4f5f7; --surface: #ffffff; --surface2: #eef0f3; --hover: #f3f5f8; --ink: #1b1f24; --dim: #5b6570; --line: #dde1e7;
  --accent: #2563eb; --accent-soft: #e2ebfd; --sel: #f5b301;
  /* meaning: good, bad, warning, changed */
  --good: #1a7f47; --good-soft: #dcf3e4; --bad: #c8312c; --bad-soft: #fde4e2; --warn: #9a5b00; --warn-soft: #fdf0cf; --mark: #d9480f;
  /* the board */
  --canvas: #e6e9ed; --substrate: #fbfbf8; --outline: #3a4350; --grid-minor: rgba(20,30,50,0.07); --grid-major: rgba(20,30,50,0.18); --grid-ink: #6b7480;
  --copper: #b45f2c; --via: #7d4a22; --plane: #c98a5e; --pad: #dca21e; --thru: #b7870c; --courtyard: #5b54c9; --body: #4d78a3; --silk: #6b7480;
  --keepout: #d6336c; --reserve: #3b6fe0; --ok: #1a7f47; --over: #d1342f; --free: #8a929d; --pocket: #e8590c; --finding: #d97706; --ref: #26396b;
  --shadow: 0 1px 2px rgba(0,0,0,0.08), 0 4px 14px rgba(0,0,0,0.10);
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #111418; --surface: #1a1e23; --surface2: #232930; --hover: #20262d; --ink: #e5e8ec; --dim: #9ba5b0; --line: #2d343c;
    --accent: #6f9cff; --accent-soft: #1f2c4a; --sel: #ffcc33;
    --good: #4cc27e; --good-soft: #17301f; --bad: #ff7a73; --bad-soft: #3a1b1a; --warn: #f0b24a; --warn-soft: #382a0d; --mark: #ff8a4d;
    --canvas: #0e1114; --substrate: #1b2025; --outline: #aab4c0; --grid-minor: rgba(255,255,255,0.06); --grid-major: rgba(255,255,255,0.15); --grid-ink: #8c97a4;
    --copper: #e8895a; --via: #c47a45; --plane: #b8734a; --pad: #f0b93a; --thru: #d4a021; --courtyard: #9a90ff; --body: #6f9bc9; --silk: #8c97a4;
    --keepout: #ff6b9a; --reserve: #6f9cff; --ok: #4cc27e; --over: #ff6a62; --free: #7d8793; --pocket: #ff8a4d; --finding: #f5a524; --ref: #b4c4ee;
    --shadow: 0 1px 2px rgba(0,0,0,0.4), 0 4px 14px rgba(0,0,0,0.45);
  }
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--ink); font: 13px/1.45 var(--sans); display: flex; flex-direction: column; font-variant-numeric: tabular-nums; touch-action: manipulation; -webkit-text-size-adjust: 100%; }
button, select, input { font: inherit; color: inherit; }
button { cursor: pointer; }
code, .mono { font-family: var(--mono); font-size: 0.92em; }
.dim { color: var(--dim); }
.add { color: var(--good); } .del { color: var(--bad); }

/* header */
header { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 14px; padding: 8px 14px; background: var(--surface); border-bottom: 1px solid var(--line); }
.brand { display: flex; align-items: baseline; gap: 8px; min-width: 0; }
.brand b { font-weight: 650; letter-spacing: 0.01em; }
#script-name { color: var(--dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 2px 10px 2px 8px; border-radius: 999px; background: var(--surface2); color: var(--dim); font-size: 12px; font-weight: 600; white-space: nowrap; }
.pill i { width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.pill.live { background: var(--good-soft); color: var(--good); }
.pill.busy { background: var(--accent-soft); color: var(--accent); }
.pill.busy i { animation: pulse 1s ease-in-out infinite; }
.pill.stale { background: var(--warn-soft); color: var(--warn); }
.pill.error { background: var(--bad-soft); color: var(--bad); }
@keyframes pulse { 50% { opacity: 0.25; } }
#stats { display: flex; gap: 4px 16px; margin-left: auto; white-space: nowrap; overflow-x: auto; scrollbar-width: none; color: var(--dim); }
#stats::-webkit-scrollbar { display: none; }
.stat b { color: var(--ink); font-weight: 650; margin-right: 3px; }
.stat.bad b { color: var(--bad); } .stat.warn b { color: var(--warn); }
#notice { display: none; padding: 6px 14px; background: var(--warn-soft); color: var(--warn); border-bottom: 1px solid var(--line); }
#notice.err { background: var(--bad-soft); color: var(--bad); }
#notice a { color: inherit; font-weight: 600; }
#notice code { color: var(--ink); }

/* layout */
main { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) 440px; }
#boardwrap { position: relative; min-width: 0; min-height: 0; background: var(--canvas); overflow: hidden; }
#grid, #board { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
#grid { pointer-events: none; }
#board { cursor: grab; touch-action: none; -webkit-user-select: none; user-select: none; }
#board.drag { cursor: grabbing; }
#boardwrap.stale #board { opacity: 0.5; }
#bar { position: absolute; top: 24px; left: 36px; right: 8px; display: flex; gap: 8px; align-items: flex-start; pointer-events: none; z-index: 4; }
#bar > * { pointer-events: auto; }
.seg { display: inline-flex; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; box-shadow: var(--shadow); }
.seg button, .tool { border: 0; background: none; padding: 6px 12px; min-height: 32px; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button.on { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.tool { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; box-shadow: var(--shadow); }
.tool.on { background: var(--accent-soft); color: var(--accent); }
#layers { display: none; position: absolute; top: 64px; left: 36px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--shadow); padding: 6px 4px; z-index: 6; min-width: 190px; }
#layers.open { display: block; }
#layers label { display: flex; gap: 8px; align-items: center; padding: 5px 10px; cursor: pointer; }
#layers label i { width: 12px; height: 12px; border-radius: 3px; flex: none; }
#layers input { margin: 0; }
#dock { position: absolute; left: 8px; right: 8px; bottom: 8px; display: flex; flex-direction: column; gap: 6px; align-items: flex-start; pointer-events: none; z-index: 3; }
#dock > * { pointer-events: auto; }
#card { display: none; width: min(380px, 100%); max-height: 46vh; overflow: auto; font-size: 13px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--shadow); padding: 8px 10px 9px; }
#card .h { display: flex; gap: 8px; align-items: center; }
#card .h b { font-size: 14px; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#card .x { border: 0; background: none; color: var(--dim); font-size: 18px; line-height: 1; padding: 2px 6px; }
#card .sub { color: var(--dim); margin: 1px 0 4px; }
#card .note { margin: 4px 0 0; overflow-wrap: anywhere; }
#card .facts { margin: 2px 0 0; }
#card .src { margin-top: 5px; }
#card .kv { display: grid; grid-template-columns: auto 1fr; gap: 1px 10px; margin: 3px 0 0; font-size: 12px; }
#card .kv span:nth-child(odd) { color: var(--dim); }
#card .fnd { color: var(--warn); margin-top: 3px; }
#card a { color: var(--accent); cursor: pointer; text-decoration: none; }
#card .src a { font-family: var(--mono); font-size: 12px; }
#replay { display: flex; gap: 10px; align-items: center; width: 100%; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--shadow); padding: 4px 12px 4px 4px; }
#play { border: 0; background: var(--accent); color: #fff; border-radius: 7px; flex: none; width: 70px; padding: 6px 0; font-weight: 600; }
#slider { flex: 1; min-width: 0; height: 30px; margin: 0; accent-color: var(--accent); touch-action: none; }
/* the label and the button have fixed widths: the slider's own width never changes while it is dragged */
#steplabel { flex: none; width: 6em; text-align: right; white-space: nowrap; overflow: hidden; }
#stepnow { display: none; max-width: 100%; background: var(--surface); border: 1px solid var(--line); border-radius: 999px; box-shadow: var(--shadow); padding: 3px 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#tip { position: absolute; pointer-events: none; background: #20252b; color: #f2f4f6; padding: 6px 9px; border-radius: 6px; font-size: 12px; max-width: 360px; display: none; white-space: pre-wrap; z-index: 7; box-shadow: var(--shadow); }

/* the sidebar */
#side { display: flex; flex-direction: column; min-height: 0; border-left: 1px solid var(--line); background: var(--surface); }
.tabs, #ntabs { display: flex; border-bottom: 1px solid var(--line); background: var(--surface); }
.tabs button, #ntabs button { flex: 1; min-width: 0; border: 0; background: none; padding: 9px 4px 8px; color: var(--dim); border-bottom: 2px solid transparent; white-space: nowrap; }
.tabs button.on, #ntabs button.on { color: var(--ink); font-weight: 600; border-bottom-color: var(--accent); }
.tabs em, #ntabs em { font-style: normal; font-size: 11px; color: var(--dim); background: var(--surface2); border-radius: 999px; padding: 0 6px; margin-left: 4px; font-weight: 500; }
.tabs em.bad, #ntabs em.bad { background: var(--warn-soft); color: var(--warn); }
.tab { flex: 1 1 55%; min-height: 0; overflow: auto; display: none; }
.tab.on { display: block; }
#ntabs { display: none; }
#script { flex: 1 1 45%; min-height: 0; display: flex; flex-direction: column; border-top: 1px solid var(--line); }
#scripthead { display: flex; gap: 8px; align-items: center; padding: 6px 10px; border-bottom: 1px solid var(--line); background: var(--surface); }
#scripthead select { background: var(--surface2); border: 1px solid var(--line); border-radius: 6px; padding: 3px 6px; min-width: 0; }
#scripthead button { border: 1px solid var(--line); background: var(--surface2); border-radius: 6px; padding: 2px 9px; }
#scriptbody { flex: 1; overflow: auto; font: 12px/1.5 var(--mono); }
.ln { display: flex; white-space: pre; }
.ln:hover { background: var(--hover); }
.ln .no { width: 44px; flex: none; text-align: right; padding-right: 8px; color: var(--dim); user-select: none; cursor: pointer; }
.ln .dot { width: 12px; flex: none; text-align: center; color: var(--accent); user-select: none; }
.ln .tx { flex: 1; padding-right: 8px; }
.ln.decl { background: var(--accent-soft); }
.ln.chg .no { background: var(--good-soft); color: var(--good); }
.ln.chgdecl { background: var(--warn-soft); }
.ln.sel { outline: 2px solid var(--accent); outline-offset: -2px; }

/* lists */
.row { display: flex; gap: 8px; padding: 6px 12px; border-bottom: 1px solid var(--line); cursor: pointer; align-items: baseline; }
.row:hover { background: var(--hover); }
.row.sel { background: var(--accent-soft); }
.row.later { opacity: 0.35; }
.row.now { box-shadow: inset 3px 0 0 var(--accent); }
.row .i { width: 26px; text-align: right; flex: none; color: var(--dim); }
.row .k { font-weight: 600; flex: none; max-width: 45%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .n { color: var(--dim); min-width: 0; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row.open .n, .row .n.wrap { white-space: normal; }
.row .go { display: none; border: 1px solid var(--line); background: var(--surface2); border-radius: 6px; padding: 1px 8px; flex: none; }
.chip { font-size: 11px; line-height: 17px; padding: 0 7px; border-radius: 999px; background: var(--surface2); color: var(--dim); flex: none; font-weight: 600; }
.chip.decided { background: var(--accent-soft); color: var(--accent); }
.chip.searched { background: var(--surface2); color: var(--dim); }
.chip.pocket { background: var(--warn-soft); color: var(--warn); }
.chip.unplaced { background: var(--bad-soft); color: var(--bad); }
.chip.copper { background: var(--surface2); color: var(--dim); }
h3 { margin: 0; padding: 12px 12px 5px; font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--dim); font-weight: 650; }
h3.fold { cursor: pointer; display: flex; gap: 6px; }
h3 .c { font-weight: 500; }
.pad8 { padding: 8px 12px; }
.empty { padding: 28px 16px; text-align: center; color: var(--dim); }
.sum { display: flex; flex-wrap: wrap; gap: 4px 14px; padding: 8px 12px; }
.sum b { font-weight: 650; }
.gh { display: flex; gap: 8px; align-items: center; padding: 9px 12px 6px; font-weight: 650; background: var(--surface); position: sticky; top: 0; border-bottom: 1px solid var(--line); cursor: pointer; }
.gh .ct { margin-left: auto; font-weight: 600; font-size: 11px; background: var(--warn-soft); color: var(--warn); border-radius: 999px; padding: 0 8px; }
.cmpbar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; padding: 8px 12px; }
.cmpbar select, .cmpbar .fbtn { background: var(--surface2); border: 1px solid var(--line); border-radius: 6px; padding: 3px 6px; min-width: 0; }
.fbtn.on { background: var(--accent-soft); color: var(--accent); border-color: transparent; font-weight: 600; }
table.diff { border-collapse: collapse; width: 100%; font: 12px/1.45 var(--mono); }
table.diff td { padding: 0 4px; white-space: pre-wrap; word-break: break-all; vertical-align: top; }
table.diff td.no { color: var(--dim); text-align: right; width: 34px; user-select: none; cursor: pointer; }
table.diff tr.p td.tx, table.diff td.r.p { background: var(--good-soft); }
table.diff tr.m td.tx, table.diff td.l.m { background: var(--bad-soft); }
table.diff tr.hunk td { background: var(--accent-soft); color: var(--dim); }
table.diff td.link { color: var(--mark); width: 14px; }

/* the board drawing: every colour is a variable, so it follows the theme */
svg text { user-select: none; font-family: var(--sans); }
.outline { fill: var(--substrate); stroke: var(--outline); stroke-width: 0.15; }
.outline.undrawn { stroke-dasharray: 0.4 0.4; }
.ko { fill: var(--keepout); fill-opacity: 0.16; stroke: var(--keepout); stroke-width: 0.08; }
.kolabel { fill: var(--keepout); font-size: 0.8px; }
.res { fill: var(--reserve); fill-opacity: 0.12; stroke: var(--reserve); stroke-width: 0.05; stroke-dasharray: 0.3 0.3; }
.cy { fill: var(--courtyard); fill-opacity: 0.05; stroke: var(--courtyard); stroke-width: 0.06; stroke-dasharray: 0.25 0.2; }
.bd { fill: none; stroke: var(--body); stroke-width: 0.07; }
.sk { fill: var(--silk); }
.pad { fill: var(--pad); } .thru { fill: var(--thru); }
.trk { fill: none; stroke: var(--copper); stroke-linecap: round; }
.via { fill: var(--via); stroke: var(--substrate); }
.plane { fill: none; stroke: var(--plane); stroke-width: 0.1; stroke-dasharray: 0.6 0.3; }
.silktxt { fill: var(--silk); }
.ref { fill: var(--ref); font-size: 0.9px; stroke: var(--substrate); stroke-width: 0.25px; paint-order: stroke; stroke-linejoin: round; }
.lk { stroke-width: 0.12; stroke-dasharray: 0.5 0.25; }
.lk.ok { stroke: var(--ok); } .lk.over { stroke: var(--over); stroke-width: 0.2; } .lk.free { stroke: var(--free); }
.pocket { fill: none; stroke: var(--pocket); stroke-width: 0.12; stroke-dasharray: 0.4 0.25; }
.worst { fill: none; stroke: var(--bad); stroke-width: 0.15; }
.fmark { fill: var(--finding); fill-opacity: 0.18; stroke: var(--finding); stroke-width: 0.2; }
.item.sel .cy { stroke: var(--sel); stroke-width: 0.3; stroke-dasharray: none; fill-opacity: 0.12; }
.item.marked .cy { stroke: var(--mark); stroke-width: 0.35; stroke-dasharray: none; }
.item.faded { opacity: 0.25; }
.d-old { fill: var(--accent); fill-opacity: 0.1; stroke: var(--accent); stroke-width: 0.12; stroke-dasharray: 0.4 0.3; }
.d-arrow { stroke: var(--accent); stroke-width: 0.18; }
.d-add { fill: var(--good); fill-opacity: 0.15; stroke: var(--good); stroke-width: 0.25; }
.d-del { fill: var(--bad); fill-opacity: 0.12; stroke: var(--bad); stroke-width: 0.25; stroke-dasharray: 0.5 0.3; }
.trk.d-cadd { stroke: var(--good); } .via.d-cadd { fill: var(--good); }
.trk.d-cdel { stroke: var(--bad); stroke-dasharray: 0.4 0.3; } .via.d-cdel { fill: var(--bad); fill-opacity: 0.6; }
.d-fgain { fill: none; stroke: var(--bad); stroke-width: 0.2; } .d-flost { fill: none; stroke: var(--good); stroke-width: 0.2; }
.arrowhead { fill: var(--accent); }
#board.replaying .copper, #board.replaying .links, #board.replaying .heat, #board.replaying .changes, #board.replaying .fnds { display: none; }
#board.lowzoom .ref, #board.lowzoom .silktxt { display: none; }
#grid .minor { stroke: var(--grid-minor); fill: none; }
#grid .major { stroke: var(--grid-major); fill: none; }
#grid text { fill: var(--grid-ink); font-family: var(--sans); }

@media (max-width: 900px) {
  /* a phone: one panel at a time, each the full width and the rest of the height, chosen from the bar under the header */
  body { font-size: 15px; }
  header { padding: 8px 12px 6px; gap: 2px 10px; }
  #stats { margin-left: 0; width: 100%; gap: 14px; font-size: 13px; }
  #ntabs { display: flex; }
  #ntabs button { padding: 10px 1px 9px; border-bottom-width: 3px; font-size: 14px; }
  #ntabs em { padding: 0 5px; margin-left: 3px; font-size: 11px; }
  #notice { font-size: 12.5px; padding: 5px 12px; }
  .tabs { display: none; }
  main { display: block; position: relative; overflow: hidden; }
  #boardwrap, #side { position: absolute; inset: 0; width: auto; height: auto; }
  #side { border-left: 0; }
  body[data-nv="board"] #side, body:not([data-nv="board"]) #boardwrap { display: none; }
  body[data-nv] .tab { display: none; }
  body[data-nv="steps"] #tab-steps, body[data-nv="findings"] #tab-findings, body[data-nv="compare"] #tab-compare { display: block; flex: 1 1 auto; }
  #script { display: none; }
  body[data-nv="script"] #script { display: flex; flex: 1 1 auto; border-top: 0; }
  .row { padding: 10px 12px; gap: 10px; }
  .row { flex-wrap: wrap; }
  .row .n { white-space: normal; overflow: visible; word-break: break-word; flex: 1 1 100%; }
  .row[data-n] .n { padding-left: 34px; }
  .row .n:empty { display: none; }
  .row .n.wrap { flex: 1 1 0; }
  .row.open .go { display: inline-block; }
  .chip { font-size: 12px; line-height: 19px; }
  .ln .no { width: 36px; }
  #scriptbody { font-size: 13px; }
  #scripthead select { max-width: 55%; }
  .seg button, .tool { min-height: 38px; padding: 6px 13px; }
  #layers { top: 72px; }
  #card { width: 100%; }
  #tip { max-width: 70vw; }
}
</style>
</head>
<body>
<header>
  <div class="brand"><b>placemat studio</b><span id="script-name"></span></div>
  <span class="pill" id="status"><i></i><span id="statustext">connecting</span></span>
  <div id="stats"></div>
</header>
<nav id="ntabs"><button data-nv="board" class="on">Board</button><button data-nv="steps">Steps<em data-count="steps"></em></button><button data-nv="findings">Findings<em data-count="findings"></em></button><button data-nv="compare">Compare<em data-count="compare"></em></button><button data-nv="script">Script</button></nav>
<div id="notice"></div>
<main>
  <div id="boardwrap">
    <svg id="grid" xmlns="http://www.w3.org/2000/svg"></svg>
    <svg id="board" xmlns="http://www.w3.org/2000/svg"></svg>
    <div id="bar">
      <div class="seg" id="facebar"><button data-face="front">Front</button><button data-face="back">Back</button><button data-face="both">Both</button></div>
      <button class="tool" id="fit" title="fit the board to the window (or double-tap the board)">Fit</button>
      <button class="tool" id="layerbtn">Layers</button>
    </div>
    <div id="layers"></div>
    <div id="dock">
      <div id="card"></div>
      <div id="stepnow"></div>
      <div id="replay"><button id="play" title="replay the placement, one item at a time">Play</button><input type="range" id="slider" min="0" max="0" value="0"><span id="steplabel" class="dim"></span></div>
    </div>
    <div id="tip"></div>
  </div>
  <div id="side">
    <div class="tabs"><button data-tab="steps" class="on">Steps<em data-count="steps"></em></button><button data-tab="findings">Findings<em data-count="findings"></em></button><button data-tab="compare">Compare<em data-count="compare"></em></button></div>
    <div class="tab on" id="tab-steps"></div>
    <div class="tab" id="tab-findings"></div>
    <div class="tab" id="tab-compare"></div>
    <div id="script">
      <div id="scripthead"><select id="file"></select><span class="dim" id="scriptinfo"></span><span style="flex:1"></span><button id="prevchg" title="previous changed line">&uarr;</button><button id="nextchg" title="next changed line">&darr;</button></div>
      <div id="scriptbody"></div>
    </div>
  </div>
</main>
<script>
"use strict";
// ---------------------------------------------------------------- helpers
const $ = s => document.querySelector(s);
const T = new URLSearchParams(location.search).get("t") || "";
const esc = s => String(s == null ? "" : s).replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));
const num = v => (Math.round(v * 1000) / 1000).toString();
const getJSON = url => fetch(url + (url.includes("?") ? "&" : "?") + "t=" + encodeURIComponent(T)).then(r => { if (!r.ok) throw new Error(url + ": " + r.status); return r.json(); });
const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
const MARGIN = 3, GAP = 6;
const LAYER_NAMES = {keepouts: ["keepouts", "keepout"], courtyards: ["courtyards", "courtyard"], body: ["body and silk", "body"], pads: ["pads", "pad"], copper: ["copper", "copper"],
  links: ["links", "ok"], congestion: ["congestion", "pocket"], findings: ["findings", "finding"], labels: ["labels", "ref"], changes: ["changes", "accent"]};

// ---------------------------------------------------------------- state
const S = {
  hello: null, status: "connecting", resolving: null, stale: false, error: null, changedFiles: [],
  history: [],                 // summaries of the kept resolves
  docs: new Map(),             // id -> {id, doc, texts, changed, timing, reused, notes}
  live: null,                  // the plan being streamed: {id, board, keepouts, reservations, items, steps, copper, ...}
  texts: {}, changed: [],      // the texts and changed files of what is shown
  shownId: null,               // the id of the resolve shown, or null while streaming
  baseId: null,                // the resolve compared against
  cmp: null,                   // {a, b, diff, files, trace}
  follow: true,                // shown follows the latest resolve
  sel: null, marked: new Set(), selLine: null,
  replay: null,                // null: every placement step shown; k: the first k placement steps
  play: null,                  // the running replay: {t0, k0, rate, n}
  liveQ: [],                   // streamed items waiting to be added to the drawing
  face: "both", layers: {keepouts: true, courtyards: true, body: true, pads: true, copper: true, links: true, congestion: true, findings: true, labels: true, changes: true},
  view: null, tab: "steps", file: null, cmpFile: null, sbs: false, openRows: new Set(), showOther: false, closedKinds: new Set(), cardOff: null, cardLinks: false, sliding: false,
};

function plan() {                      // the plan to draw
  if (S.resolving && S.live) return S.live;
  const d = S.docs.get(S.shownId);
  return d ? d.doc : S.live;
}
const itemsOf = p => (p && p.items) || [];
const itemMap = p => new Map(itemsOf(p).map(i => [i.key, i]));

// The replay's positions: the placement steps, in order, one for each item the board draws. Copper steps (fanouts,
// escapes, vias, pours) and steps that placed nothing draw nothing as a step of their own, so they are not positions;
// an item named by two steps is shown at the first. The slider, the step list and the drawing all index this list.
function placementSteps(p) {
  const drawn = new Set(itemsOf(p).map(i => i.key)), seen = new Set(), out = [];
  (p && p.steps || []).forEach((s, i) => {
    if (!drawn.has(s.item) || seen.has(s.item)) return;
    seen.add(s.item);
    out.push(Object.assign({}, s, {n: out.length, at: i}));
  });
  return out;
}
// The steps that are not positions, for the step list's second section.
function otherSteps(p) {
  const pos = new Set(placementSteps(p).map(s => s.at));
  return (p && p.steps || []).map((s, i) => Object.assign({}, s, {at: i})).filter(s => !pos.has(s.at) && !((p.unplaced || []).some(u => u.item === s.item) && s.kind !== "copper"));
}
// The item keys the drawing shows at slider position k (null: all of them): the first k placement steps' items.
function itemsAtStep(p, k) {

  return (k == null ? order : order.slice(0, clamp(k, 0, order.length))).map(s => s.item);
}
const replayCount = () => placementSteps(plan()).length;

// ---------------------------------------------------------------- scheduling
const dirty = new Set();
let queued = false;
function schedule(...parts) {
  parts.forEach(p => dirty.add(p));
  if (!queued) { queued = true; requestAnimationFrame(() => { queued = false; const d = [...dirty]; dirty.clear(); render(d); }); }
}
function render(parts) {
  const all = parts.includes("all");
  const has = p => all || parts.includes(p);
  if (has("status")) renderStatus();
  if (has("board")) renderBoard();
  if (has("steps")) renderSteps();
  if (has("findings")) renderFindings();
  if (has("compare")) renderCompare();
  if (has("script")) renderScript();
  if (has("live")) flushLive();
  if (has("marks")) applyMarks();
  if (has("replay") || has("steps") || has("board")) renderReplay();
  if (has("card") || has("marks") || has("board")) renderCard();
  if (has("counts") || all || has("steps") || has("findings") || has("compare")) renderCounts();
}

// ---------------------------------------------------------------- events
const es = new EventSource("/events?t=" + encodeURIComponent(T));
const on = (name, f) => es.addEventListener(name, e => f(JSON.parse(e.data)));
es.onopen = () => { S.status = S.status === "connecting" ? "waiting" : S.status; schedule("status"); };
es.onerror = () => { S.status = "disconnected"; schedule("status"); };

on("hello", d => {
  S.hello = d; S.history = d.history; S.error = d.error; S.resolving = d.resolving;
  $("#script-name").textContent = d.script;
  schedule("all");
});
on("state", d => {                       // the latest resolve, whole
  const rec = {id: d.id, doc: d.doc, texts: d.texts, changed: d.changed, timing: d.timing, reused: d.reused, notes: d.notes};
  S.docs.set(d.id, rec);
  S.latestId = d.id;
  showResolve(d.id, d.compare);
});
on("changed", d => { S.stale = true; S.changedFiles = d.files; S.status = "stale"; schedule("status"); });
on("started", d => {
  stopPlay();
  S.resolving = d.id; S.stale = true; S.error = null; S.status = "resolving";
  S.changedFiles = d.stale_files;
  S.texts = d.texts; S.changed = d.changed;
  S.live = {id: d.id, board: null, keepouts: [], reservations: [], items: [], steps: [], copper: [], links: [],
            congestion: null, findings: [], unplaced: [], pocketed: [], counts: {placed: 0, findings: 0}, score: null, fromStart: true};
  S.shownId = null; S.cmp = null; S.replay = null; S.liveQ = [];
  S.marked = new Set();
  schedule("all");
});
on("board", d => { if (!S.live || d.id !== S.live.id) return; S.live.board = d.board; S.live.keepouts = d.keepouts; S.live.reservations = d.reservations; if (!S.view) fit(); schedule("board"); });
on("step", d => {
  if (!S.live || d.id !== S.live.id) return;
  const it = d.item, L = S.live;
  const at = L.items.findIndex(i => i.key === it.key);
  L.steps.push({i: L.steps.length, item: it.key, kind: it.kind, placed: it.placed, note: it.note, why: it.why, freedom: it.freedom, how: it.how});
  if (it.placed) {
    if (at >= 0) { L.items[at] = it; schedule("board"); } else { L.items.push(it); S.liveQ.push(it); schedule("live"); }
  } else { L.unplaced.push({item: it.key, why: it.note}); schedule("steps"); }
});
on("copper", d => { if (S.live && d.id === S.live.id) { S.live.copper = d.copper; schedule("board"); } });
on("links", d => { if (S.live && d.id === S.live.id) { S.live.links = d.links; schedule("board"); } });
on("congestion", d => { if (S.live && d.id === S.live.id) { S.live.congestion = d.congestion; schedule("board"); } });
on("findings", d => { if (S.live && d.id === S.live.id) { S.live.findings = d.findings; schedule("findings", "status"); } });
on("items", d => {
  if (!S.live || d.id !== S.live.id) return;
  Object.assign(S.live, {items: d.items, steps: d.steps, unplaced: d.unplaced, pocketed: d.pocketed, board: d.board, keepouts: d.keepouts, reservations: d.reservations});
  S.liveQ = [];
  schedule("board", "steps");
});
on("finished", d => {
  const L = S.live;
  if (!L || d.id !== L.id) return;
  L.counts = d.counts; L.score = d.score;
  const rec = {id: d.id, doc: L, texts: S.texts, changed: S.changed, timing: d.timing, reused: d.reused, notes: d.notes};
  S.docs.set(d.id, rec);
  S.latestId = d.id; S.history = d.history; S.resolving = null; S.stale = false; S.status = "live";
  trimDocs();
  if (S.follow) showResolve(d.id, null); else schedule("status", "compare");
});
on("compare", d => {
  if (S.follow && S.shownId === d.b) { setCompare(d); }
});
on("cancelled", d => { if (S.resolving === d.id) { S.resolving = null; S.status = "stale"; schedule("status", "board"); } });
on("superseded", d => { if (S.resolving === d.id) { S.resolving = null; S.status = "stale"; schedule("status", "board"); } });
on("error", d => {
  stopPlay();
  S.resolving = null; S.error = d; S.status = "error"; S.stale = true;
  const last = S.docs.get(S.latestId);
  if (last && S.follow) { S.shownId = last.id; S.texts = Object.assign({}, last.texts, S.texts); }
  schedule("all");
});

function trimDocs() {
  const keep = new Set(S.history.map(h => h.id));
  for (const id of [...S.docs.keys()]) if (!keep.has(id)) S.docs.delete(id);
}

function showResolve(id, cmp) {
  const rec = S.docs.get(id);
  if (!rec) return;
  stopPlay();
  S.shownId = id; S.live = null; S.resolving = S.resolving === id ? null : S.resolving; S.liveQ = [];
  S.texts = rec.texts; S.changed = rec.changed;
  S.stale = false; S.error = null; S.status = S.latestId === id ? "live" : "history";
  S.replay = null; S.sel = null; S.marked = new Set();
  const hist = S.history.slice().sort((a, b) => a.id - b.id);
  const at = hist.findIndex(h => h.id === id);
  S.baseId = at > 0 ? hist[at - 1].id : null;
  if (cmp) setCompare(cmp); else if (S.baseId != null) loadCompare(S.baseId, id); else { S.cmp = null; }
  if (!S.view) fit();
  schedule("all");
}
async function loadCompare(a, b) {
  S.baseId = a;
  try {
    for (const id of [a, b]) if (!S.docs.has(id)) S.docs.set(id, await getJSON("/resolve/" + id));
    setCompare(await getJSON("/diff?a=" + a + "&b=" + b));
  } catch (e) { S.cmp = null; schedule("compare", "board"); }
}
function setCompare(c) {
  S.cmp = c; S.baseId = c.a;
  if (!S.cmpFile || !c.files[S.cmpFile]) S.cmpFile = Object.keys(c.files)[0] || null;
  schedule("compare", "board", "script");
}
async function pickShown(id) {
  S.follow = id === S.latestId;
  if (!S.docs.has(id)) S.docs.set(id, await getJSON("/resolve/" + id));
  showResolve(id, null);
}

// ---------------------------------------------------------------- status
function statNumbers(p, rec) {
  if (!p) return [];
  const placed = itemsOf(p).length, unplaced = (p.unplaced || []).length, findings = (p.findings || []).length;
  const out = [["placed", placed, ""], ["unplaced", unplaced, unplaced ? "bad" : ""], ["findings", findings, findings ? "warn" : ""]];
  if (p.score && p.score.total != null) out.push(["score", Math.round(p.score.total * 10) / 10, ""]);
  if (rec && rec.timing) out.push(["s", rec.timing.total_s, ""]);
  return out;
}
function renderStatus() {
  const b = $("#status");
  const label = {live: "live", resolving: "resolving #" + S.resolving, stale: "stale", error: "error", history: "earlier resolve", waiting: "waiting", connecting: "connecting", disconnected: "disconnected"}[S.status] || S.status;
  $("#statustext").textContent = label;
  b.className = "pill " + ({live: "live", resolving: "busy", stale: "stale", error: "error", disconnected: "error"}[S.status] || "");
  const rec = S.docs.get(S.shownId), p = plan();
  $("#stats").innerHTML = statNumbers(p, rec).map(([k, v, c]) => '<span class="stat ' + c + '"><b>' + v + "</b>" + (k === "s" ? "s" : k) + "</span>").join("");
  const n = $("#notice");
  if (S.error) {
    n.className = "err"; n.style.display = "block";
    n.innerHTML = "<b>" + esc(S.error.message) + "</b>" + (S.error.line ? ' <a href="#" id="goerr">' + esc(S.error.file || "") + " line " + S.error.line + "</a>" : "") + (S.error.source ? ' <code>' + esc(String(S.error.source).trim()) + "</code>" : "") + " (showing the last good plan)";
    const a = $("#goerr");
    if (a) a.onclick = e => { e.preventDefault(); goTab("script"); gotoLine(S.error.file || S.file, S.error.line); };
  } else if (S.stale && !S.resolving) {
    n.className = ""; n.style.display = "block";
    n.textContent = "Waiting to resolve" + (S.changedFiles.length ? ": " + S.changedFiles.join(", ") + " changed" : "");
  } else if (rec && rec.notes && rec.notes.length && !S.resolving) {
    n.className = ""; n.style.display = "block"; n.textContent = rec.notes.join("; ") + (rec.reused ? "" : "");
  } else n.style.display = "none";
  $("#boardwrap").classList.toggle("stale", S.stale && !S.resolving);
}
function renderCounts() {
  const p = plan(), c = {steps: placementSteps(p).length, findings: ((p && p.findings) || []).length, compare: S.cmp && !S.cmp.diff.empty ? S.cmp.diff.moved.length + S.cmp.diff.added.length + S.cmp.diff.removed.length : 0};
  document.querySelectorAll("[data-count]").forEach(e => { const v = c[e.dataset.count]; e.textContent = v || ""; e.style.display = v ? "" : "none"; });
}

// ---------------------------------------------------------------- the board
let lay = null;
let B = {byStep: [], layers: [], groups: new Map(), k: 0, n: 0, plan: null};   // the drawing's handles, for the incremental updates
function layout(p) {
  const e = p && p.board ? p.board.extent : [0, 0, 100, 60];
  const L = e[0] - MARGIN, T0 = e[1] - MARGIN, R = e[2] + MARGIN, B_ = e[3] + MARGIN;
  const faces = S.face === "both" ? ["front", "back"] : [S.face];
  const W = R - L;
  // A mirrored panel's offset puts its board x = n on svg x = n + 10 m (offset + L + R = 10 m), so the one grid
  // behind the panels lines up with both.
  const panels = faces.map((f, k) => {
    const mirror = f === "back", base = k * (W + GAP);
    return {face: f, mirror, dx: mirror ? Math.ceil((base + L + R) / 10) * 10 - (L + R) : base};
  });
  return {L, T: T0, R, B: B_, W, H: B_ - T0, panels};
}
const panelPt = (pn, x, y) => pn.mirror ? [pn.dx + lay.L + lay.R - x, y] : [pn.dx + x, y];
function polyPts(poly) { return poly.map(p => num(p[0]) + "," + num(p[1])).join(" "); }
function bboxOf(polys) {
  let l = 1e9, t = 1e9, r = -1e9, b = -1e9;
  for (const poly of polys) for (const p of poly) { l = Math.min(l, p[0]); t = Math.min(t, p[1]); r = Math.max(r, p[0]); b = Math.max(b, p[1]); }
  return l > r ? null : [l, t, r, b];
}
function itemBox(it) {
  const polys = [];
  for (const m of it.members || []) {
    const c = m.shapes.filter(s => s.kind === "courtyard");
    (c.length ? c : m.shapes).forEach(s => polys.push(s.poly));
  }
  return bboxOf(polys);
}
const textAt = (pn, x, y, s, size, cls) => {
  const t = pn.mirror ? ' transform="translate(' + num(x) + " " + num(y) + ') scale(-1 1)" x="0" y="0"' : ' x="' + num(x) + '" y="' + num(y) + '"';
  return '<text class="' + cls + '"' + t + ' font-size="' + size + '" text-anchor="middle" dominant-baseline="middle">' + esc(s) + "</text>";
};

// One item's group on one face: its shapes, and its label. `n` is its position in the replay.
function itemSVG(it, f, pn, p, n) {
  const o = [], keep = (p.pocketed || []).includes(it.key);
  const cls = "item" + (S.sel === it.key ? " sel" : "") + (S.marked.has(it.key) ? " marked" : "") + (S.marked.size && !S.marked.has(it.key) && S.sel !== it.key ? " faded" : "");
  let any = false;
  o.push('<g class="' + cls + '" data-key="' + esc(it.key) + '" data-s="' + n + '">');
  for (const m of it.members) {
    for (const s of m.shapes) {
      if (!s.faces.includes(f)) continue;
      if (s.kind === "courtyard" && S.layers.courtyards) { any = true; o.push('<polygon class="cy" points="' + polyPts(s.poly) + '"/>'); }
      else if (s.kind === "body" && S.layers.body) { any = true; o.push('<polygon class="bd" points="' + polyPts(s.poly) + '"/>'); }
      else if (s.kind === "silk" && S.layers.body) { any = true; o.push('<polygon class="sk" points="' + polyPts(s.poly) + '"/>'); }
      else if ((s.kind === "pad" || s.kind === "through") && S.layers.pads) { any = true; o.push('<polygon class="' + (s.kind === "pad" ? "pad" : "thru") + '" points="' + polyPts(s.poly) + '"/>'); }
    }
    if (S.layers.labels) {
      const c = m.shapes.filter(s => s.kind === "courtyard" && s.faces.includes(f));
      const b = bboxOf((c.length ? c : m.shapes.filter(s => s.faces.includes(f))).map(s => s.poly));
      if (b) { any = true; o.push(textAt(pn, (b[0] + b[2]) / 2, (b[1] + b[3]) / 2, m.ref, 0.9, "ref")); }
    }
  }
  if (keep) {
    const b = itemBox(it);
    if (b) o.push('<rect class="pocket" x="' + num(b[0] - 0.3) + '" y="' + num(b[1] - 0.3) + '" width="' + num(b[2] - b[0] + 0.6) + '" height="' + num(b[3] - b[1] + 0.6) + '"/>');
  }
  o.push("</g>");
  return any || keep ? o.join("") : "";
}

function panelSVG(p, pn, first, order, diffLayer) {
  const f = pn.face, o = [];
  const tr = pn.mirror ? "translate(" + num(pn.dx + lay.L + lay.R) + " 0) scale(-1 1)" : "translate(" + num(pn.dx) + " 0)";
  o.push('<g class="panel ' + f + '" transform="' + tr + '">');
  if (p.board && p.board.loops.length) {
    o.push('<path class="outline' + (p.board.drawn ? "" : " undrawn") + '" fill-rule="evenodd" d="' + p.board.loops.map(l => "M " + polyPts(l).replace(/ /g, " L ") + " Z").join(" ") + '"/>');
  }
  if (S.layers.congestion && first && p.congestion && p.congestion.cells) {
    const c = p.congestion, cs = c.cell;
    o.push('<g class="heat">');
    for (const [i, j, u] of c.cells) {
      const t = Math.min(u, 1.5) / 1.5;
      o.push('<rect x="' + num(c.origin[0] + i * cs) + '" y="' + num(c.origin[1] + j * cs) + '" width="' + cs + '" height="' + cs + '" fill="rgb(255,' + Math.round(200 * (1 - t) + 30) + "," + Math.round(60 * (1 - t)) + ')" fill-opacity="' + (0.2 + 0.4 * t).toFixed(2) + '"/>');
    }
    o.push("</g>");
    o.push('<circle class="worst" cx="' + c.worst_at[0] + '" cy="' + c.worst_at[1] + '" r="' + num(cs * 1.6) + '"/>');
  }
  if (S.layers.keepouts) {
    for (const k of p.keepouts || []) {
      o.push('<polygon class="ko" points="' + polyPts(k.poly) + '"/>');
      const b = bboxOf([k.poly]);
      if (b && S.layers.labels) o.push(textAt(pn, (b[0] + b[2]) / 2, (b[1] + b[3]) / 2, k.name, 0.8, "kolabel"));
    }
    for (const r of p.reservations || []) {
      if (r.face && r.face !== f) continue;
      o.push('<polygon class="res" points="' + polyPts(r.poly) + '"><title>' + esc(r.why) + "</title></polygon>");
    }
  }
  if (S.layers.copper) o.push(copperSVG(p.copper || [], f, pn, ""));
  o.push('<g class="items">');
  for (const s of order) { const it = S.itemAt.get(s.item); if (it) o.push(itemSVG(it, f, pn, p, s.n)); }
  o.push("</g>");
  if (S.layers.links) {
    o.push('<g class="links">');
    for (const l of p.links || []) {
      o.push('<line class="lk ' + l.state + '" x1="' + l.pa[0] + '" y1="' + l.pa[1] + '" x2="' + l.pb[0] + '" y2="' + l.pb[1] + '"><title>' + esc(l.a.join(".") + " - " + l.b.join(".") + "  " + l.length + " mm" + (l.limit != null ? " (limit " + l.limit + ")" : "") + (l.why ? "  " + l.why : "")) + "</title></line>");
    }
    o.push("</g>");
  }
  if (S.layers.findings) {
    o.push('<g class="fnds">');
    for (const fd of p.findings || []) if (fd.at) o.push('<circle class="fmark" cx="' + fd.at[0] + '" cy="' + fd.at[1] + '" r="0.9"><title>' + esc(fd.text) + "</title></circle>");
    o.push("</g>");
  }
  o.push(diffLayer(f, pn));
  o.push("</g>");
  return o.join("");
}

function copperSVG(ops, f, pn, mode) {
  const o = ['<g class="copper">'];
  const cls = mode === "added" ? " d-cadd" : mode === "removed" ? " d-cdel" : "";
  for (const c of ops) {
    if (c.t === "track" && (c.face === f || c.face === "inner")) {
      const op = c.face === "inner" ? "0.4" : "1";
      if (c.arc) o.push('<path class="trk' + cls + '" d="M ' + c.a[0] + " " + c.a[1] + " A " + c.arc[0] + " " + c.arc[0] + " 0 " + c.arc[1] + " " + c.arc[2] + " " + c.b[0] + " " + c.b[1] + '" fill="none" stroke-width="' + c.width + '" stroke-opacity="' + op + '"/>');
      else o.push('<line class="trk' + cls + '" x1="' + c.a[0] + '" y1="' + c.a[1] + '" x2="' + c.b[0] + '" y2="' + c.b[1] + '" stroke-width="' + c.width + '" stroke-opacity="' + op + '"/>');
    } else if (c.t === "via") {
      o.push('<circle class="via' + cls + '" cx="' + c.at[0] + '" cy="' + c.at[1] + '" r="' + num(c.size / 2) + '" stroke-width="' + num(Math.max(c.size - c.drill, 0.05) / 4) + '"/>');
    } else if ((c.t === "plane" || c.t === "pour") && (c.face === f || c.face === "inner") && !mode) {
      o.push('<polygon class="plane" points="' + polyPts(c.points) + '"/>');
    } else if (c.t === "text" && c.face === f && !mode && S.layers.labels) {
      o.push(textAt(pn, c.at[0], c.at[1], c.text, Math.max(c.size, 0.6), "silktxt"));
    }
  }
  o.push("</g>");
  return o.join("");
}

// The diagram diff: what `diff` (diff_plans) says changed, drawn over the plan shown. Takes the diff and the old

    if (m.distance > 0 && m.from.at && m.to.at) {
      o.push('<line class="d-arrow" x1="' + m.from.at[0] + '" y1="' + m.from.at[1] + '" x2="' + m.to.at[0] + '" y2="' + m.to.at[1] + '" marker-end="url(#arrow)"/>');
    }

function renderBoard() {

  lay = layout(p);

// ---------------------------------------------------------------- the view: fit, zoom, pan, grid
function fit() {

  const aspect = r.width / r.height;

}
function zoomTo(box) {

  const pad = Math.max(5, 0.5 * Math.max(Math.abs(b[0] - a[0]), Math.abs(b[1] - a[1])));
  const x0 = Math.min(a[0], b[0]) - pad, y0 = Math.min(a[1], b[1]) - pad, x1 = Math.max(a[0], b[0]) + pad, y1 = Math.max(a[1], b[1]) + pad;

  S.view = {x: x0, y: y0, w: x1 - x0, h: y1 - y0 + low};

  if (bs.length) zoomTo([Math.min(...bs.map(b => b[0])), Math.min(...bs.map(b => b[1])), Math.max(...bs.map(b => b[2])), Math.max(...bs.map(b => b[3]))]);

// The grid is its own svg under the board with the board's view box, so it spans whatever is visible at any pan and
// zoom: a 1 mm grid when a millimetre is wide enough to see, major lines on a nice step of at least 10 mm, labels on

  o.push("<defs>");

  o.push('<pattern id="pM" width="' + g.major + '" height="' + g.major + '" patternUnits="userSpaceOnUse"><path class="major" d="M ' + g.major + " 0 L 0 0 L 0 " + g.major + '" stroke-width="' + num(k * 1.2) + '"/></pattern></defs>');
  if (g.minor) o.push('<rect id="gridminor" x="' + num(x0) + '" y="' + num(y0) + '" width="' + num(w) + '" height="' + num(h) + '" fill="url(#pm)"/>');
  o.push('<rect id="gridmajor" x="' + num(x0) + '" y="' + num(y0) + '" width="' + num(w) + '" height="' + num(h) + '" fill="url(#pM)"/>');
  const fs = 11 * k;

    const pn = gridOwner(x), v = pn && pn.mirror ? pn.dx + lay.L + lay.R - x : x;
    o.push('<text class="gx" x="' + num(x + 3 * k) + '" y="' + num(vb.y + 14 * k) + '" font-size="' + num(fs) + '">' + num(v) + "</text>");
  }

    o.push('<text class="gy" x="' + num(vb.x + 5 * k) + '" y="' + num(y - 3 * k) + '" font-size="' + num(fs) + '">' + num(y) + "</text>");

// Touch and mouse on the board. One pointer pans; two pinch (zoom about their midpoint, and pan with it); a quick

    it.members.length > 1 ? "cell/block of " + it.members.length + ": " + it.members.map(m => m.ref).join(" ") : (it.members[0] && it.members[0].cell ? "cell " + it.members[0].cell : ""),

// ---------------------------------------------------------------- selection

// The selected item's card on the board: where it is, how it was placed and why, its links and its line.

  const {links} = describe(it, p), m = it.members || [];
  const sub = m.length > 1 ? "block of " + m.length + ": " + m.map(x => x.ref).join(" ") : m[0] ? [m[0].ref, m[0].value, m[0].cell && "cell " + m[0].cell].filter(Boolean).join("  ") : "";
  const stepNo = S.stepNo && S.stepNo.get(it.key);
  const facts = [it.face + ", rotation " + it.rotation, (it.how || "") + (it.freedom ? " (" + it.freedom + ")" : ""), it.moved_mm ? "moved " + it.moved_mm + " mm" : "",
    stepNo != null ? "step " + (stepNo + 1) + " of " + placementSteps(p).length : ""].filter(Boolean).join(", ");
  const over = links.filter(l => l.state === "over").length;
  const sorted = links.slice().sort((a, b) => (b.state === "over") - (a.state === "over"));
  const linkRow = l => "<span>" + (l.state === "over" ? "over" : "link") + "</span><span class=\"" + (l.state === "over" ? "del" : "") + "\">" + esc(l.a.join(".") + " - " + l.b.join(".")) + "  " + l.length + (l.limit != null ? " / " + l.limit : "") + " mm</span>";
  el.innerHTML = '<div class="h"><b>' + esc(it.key) + '</b><span class="chip ' + esc(it.how || "") + '">' + esc(it.how || it.kind) + '</span><button class="x" id="cardx" aria-label="close">&times;</button></div>' +
    (sub ? '<div class="sub">' + esc(sub) + "</div>" : "") +

    (it.why ? '<div class="note dim">' + esc(it.why) + "</div>" : "") +

  if (!S.sliding && +slider.value !== k) slider.value = k;          // not while a finger is on it: the thumb follows the finger
  slider.disabled = !!S.resolving;
  if (B.svg && B.plan === p) showSteps(k);
  const rows = R.rows;
  if (R.k !== k || R.n !== rows.length) {
    const same = R.n === rows.length && R.k >= 0;
    const lo = same ? Math.min(R.k, k) : 0, hi = same ? Math.max(R.k, k) : rows.length;
    for (let i = lo; i < hi && i < rows.length; i++) rows[i].classList.toggle("later", i >= k);
    if (same && rows[R.k - 1]) rows[R.k - 1].classList.remove("now");
    if (S.replay != null && rows[k - 1]) rows[k - 1].classList.add("now");
    R.k = k; R.n = rows.length;
  }
  $("#steplabel").textContent = n ? k + " / " + n : S.resolving ? "..." : "0";
  const now = S.replay != null && order[k - 1], sn = $("#stepnow");
  sn.style.display = now ? "block" : "none";
  if (now) sn.textContent = "Step " + k + ": " + now.item + (now.note || now.why ? " - " + (now.note || now.why) : "");
  $("#play").textContent = S.play ? "Pause" : "Play";
  $("#play").disabled = !n || !!S.resolving;
}
const R = {rows: [], k: -1, n: 0};
function collectRows() { R.rows = [...document.querySelectorAll("#steplist .row[data-n]")]; R.k = -1; }

const PLAY_SECONDS = 8, PLAY_MIN = 3, PLAY_MAX = 30;           // a replay takes about this long, at a rate within these steps per second
function playRate(n) { return clamp(n / PLAY_SECONDS, PLAY_MIN, PLAY_MAX); }
function playPosition(play, now) {                              // the position at `now`: a function of the clock, so it only goes forward
  return Math.min(play.n, play.k0 + Math.floor((now - play.t0) / 1000 * play.rate));
}
function togglePlay() {
  if (S.play) { stopPlay(); schedule("replay"); return; }
  const n = replayCount(); if (!n || S.resolving) return;
  const k0 = S.replay == null ? 0 : S.replay;                   // from the end it starts again
  S.play = {t0: Date.now(), k0, rate: playRate(n), n};
  setReplay(k0);
  requestAnimationFrame(playTick);
}
function playTick() {
  const play = S.play; if (!play) return;
  const k = Math.max(playPosition(play, Date.now()), S.replay == null ? 0 : S.replay);
  setReplay(k);
  if (k >= play.n) { S.play = null; schedule("replay"); return; }
  requestAnimationFrame(playTick);
}
function stopPlay() { S.play = null; }
$("#slider").addEventListener("input", e => { stopPlay(); setReplay(+e.target.value); });
for (const t of ["pointerdown"]) $("#slider").addEventListener(t, () => { S.sliding = true; });
for (const t of ["pointerup", "pointercancel", "blur"]) $("#slider").addEventListener(t, () => { S.sliding = false; schedule("replay"); });
$("#play").addEventListener("click", togglePlay);

// ---------------------------------------------------------------- steps
function howOf(s, p) {
  const it = S.itemAt && S.itemAt.get(s.item);
  if (it && it.how) return it.how;
  if (!s.placed && s.kind !== "copper") return "unplaced";
  if (s.kind === "copper") return "copper";
  return s.how || (p && p.pocketed && p.pocketed.includes(s.item) ? "pocket" : s.freedom === "searched" ? "searched" : "decided");
}
function stepRow(s, p) {
  const how = howOf(s, p);
  return '<div class="row' + (S.sel === s.item ? " sel" : "") + (S.openRows.has(s.at) ? " open" : "") + '" data-n="' + s.n + '" data-at="' + s.at + '" data-item="' + esc(s.item) + '"><span class="i">' + (s.n + 1) + '</span><span class="k">' + esc(s.item) + '</span><span class="chip ' + how + '">' + esc(how) + '</span><span class="n">' + esc(s.note || s.why) + '</span><button class="go">show</button></div>';
}
function renderSteps() {
  const p = plan(), el = $("#tab-steps");
  if (!p) { el.innerHTML = '<div class="empty">Waiting for the first resolve</div>'; R.rows = []; return; }
  S.itemAt = itemMap(p);
  const order = placementSteps(p), other = otherSteps(p);
  const unplaced = p.unplaced || [];
  const head = (title, n, id) => "<h3>" + title + ' <span class="c"' + (id ? ' id="' + id + '"' : "") + ">" + n + "</span></h3>";
  let out = head("Placement steps", order.length, "stepcount") + '<div id="steplist">' + order.map(s => stepRow(s, p)).join("") + "</div>";
  if (unplaced.length) out += head("Not placed", unplaced.length) + unplaced.map(u => '<div class="row" data-item="' + esc(u.item) + '"><span class="k">' + esc(u.item) + '</span><span class="chip unplaced">unplaced</span><span class="n wrap">' + esc(u.why) + "</span></div>").join("");
  if (other.length) {
    out += '<h3 class="fold" data-fold="other">' + (S.showOther ? "&#9662;" : "&#9656;") + " Copper and other steps <span class=\"c\">" + other.length + "</span></h3>";
    if (S.showOther) out += other.map(s => '<div class="row" data-at="' + s.at + '"><span class="k">' + esc(s.item) + '</span><span class="chip ' + (s.kind === "copper" ? "copper" : "") + '">' + esc(s.kind) + '</span><span class="n wrap">' + esc(s.note) + "</span></div>").join("");
  }
  el.innerHTML = out;
  collectRows();
  el.onclick = e => {
    if (e.target.closest("[data-fold]")) { S.showOther = !S.showOther; renderSteps(); return; }
    const r = e.target.closest(".row"); if (!r) return;
    const key = r.dataset.item;
    if (r.dataset.at != null && r.dataset.n != null) { const at = +r.dataset.at; if (S.openRows.has(at)) S.openRows.delete(at); else S.openRows.add(at); r.classList.toggle("open"); }
    if (key && itemMap(plan()).has(key)) selectItem(key, {zoom: true});
    if (e.target.closest(".go")) goTab("board");
  };
}

// ---------------------------------------------------------------- findings
function renderFindings() {
  const p = plan(), el = $("#tab-findings");
  const fs = (p && p.findings) || [];
  if (!fs.length) { el.innerHTML = '<div class="empty">No findings</div>'; return; }
  const groups = new Map();
  fs.forEach((f, i) => { const k = f.kind || "other"; (groups.get(k) || groups.set(k, []).get(k)).push([f, i]); });
  el.innerHTML = [...groups].map(([kind, list]) => {
    const closed = S.closedKinds.has(kind);
    return '<div class="gh" data-kind="' + esc(kind) + '"><span class="dim">' + (closed ? "&#9656;" : "&#9662;") + "</span>" + esc(kind) + '<span class="ct">' + list.length + "</span></div>" +
      (closed ? "" : list.map(([f, i]) => '<div class="row" data-i="' + i + '"><span class="n wrap" style="color:var(--ink)">' + esc(f.text) + "</span></div>").join(""));
  }).join("");
  el.onclick = e => {
    const gh = e.target.closest(".gh");
    if (gh) { const k = gh.dataset.kind; if (S.closedKinds.has(k)) S.closedKinds.delete(k); else S.closedKinds.add(k); renderFindings(); return; }
    const r = e.target.closest(".row"); if (!r) return;
    const f = fs[+r.dataset.i];
    if (f.at) zoomTo([f.at[0] - 2, f.at[1] - 2, f.at[0] + 2, f.at[1] + 2]);
    if (f.item) selectItem(f.item, {zoom: !f.at});
    if (f.at || f.item) goTab("board");
  };
}

// ---------------------------------------------------------------- script
function declIndex(p) {
  const out = {};
  for (const it of itemsOf(p)) {
    if (!it.file || !it.line) continue;
    const span = it.span || [it.line, it.line];
    const f = out[it.file] || (out[it.file] = {});
    for (let n = span[0]; n <= span[1]; n++) (f[n] || (f[n] = [])).push(it.key);
  }
  return out;
}
// What the file select lists: the layout script and the Python modules it imports, the files the line diff and the
// line links apply to; the toml, lock and board files that are watched too are not shown.
function scriptFiles(texts) { return Object.keys(texts || {}).filter(n => /\.py$/.test(n)); }
function renderScript() {
  const names = scriptFiles(S.texts);
  const sel = $("#file");
  if (!names.includes(S.file)) S.file = (S.hello && names.includes(S.hello.script)) ? S.hello.script : names[0];
  if (sel.dataset.names !== names.join("|")) { sel.innerHTML = names.map(n => "<option>" + esc(n) + "</option>").join(""); sel.dataset.names = names.join("|"); }
  sel.value = S.file;
  const body = $("#scriptbody");
  const text = S.texts[S.file];
  if (text == null) { body.innerHTML = ""; return; }
  const p = plan(), idx = declIndex(p)[S.file] || {};
  const it = S.sel ? itemMap(p).get(S.sel) : null;
  const span = it && it.file === S.file ? (it.span || [it.line, it.line]) : null;
  const cmpf = S.cmp && S.cmp.files[S.file];
  const chg = new Set(cmpf ? cmpf.changed_new : []);
  const trItem = it && S.cmp && S.cmp.trace.items[it.key];
  const chgDecl = new Set(trItem && it.file === S.file ? trItem.lines.new : []);
  const lines = text.split("\n");
  if (lines.length && lines[lines.length - 1] === "") lines.pop();
  body.innerHTML = lines.map((l, i) => {
    const n = i + 1;
    const cls = "ln" + (chgDecl.has(n) ? " chgdecl" : span && n >= span[0] && n <= span[1] ? " decl" : "") + (chg.has(n) ? " chg" : "") + (S.selLine && S.selLine.file === S.file && S.selLine.n === n ? " sel" : "");
    return '<div class="' + cls + '" data-n="' + n + '"><span class="no">' + n + '</span><span class="dot">' + (idx[n] ? "&#9679;" : "") + '</span><span class="tx">' + esc(l) + "</span></div>";
  }).join("");
  $("#scriptinfo").textContent = cmpf ? "+" + cmpf.added + " -" + cmpf.removed + " since #" + S.cmp.a : "";
  body.onclick = e => {
    const r = e.target.closest(".ln"); if (!r) return;
    const n = +r.dataset.n;
    S.selLine = {file: S.file, n};
    const keys = new Set(idx[n] || []);
    const t = S.cmp && S.cmp.trace.lines[S.file] && S.cmp.trace.lines[S.file].new[String(n)];
    (t || []).forEach(k => keys.add(k));
    if (keys.size) { S.marked = keys; S.sel = [...keys][0]; S.cardOff = null; zoomItems([...keys]); } else { S.marked = new Set(); S.sel = null; }
    schedule("marks", "script", "compare", "card");
  };
}
$("#file").addEventListener("change", e => { S.file = e.target.value; schedule("script"); });
function gotoLine(file, n) {
  if (file && S.texts[file] != null) S.file = file;
  S.selLine = {file: S.file, n};
  schedule("script");
  setTimeout(() => { const l = $('#scriptbody .ln[data-n="' + n + '"]'); if (l) l.scrollIntoView({block: "center"}); }, 30);
}
function stepChange(dir) {
  const c = S.cmp && S.cmp.files[S.file]; if (!c || !c.changed_new.length) return;
  const cur = S.selLine && S.selLine.file === S.file ? S.selLine.n : 0;
  const ls = c.changed_new;
  const next = dir > 0 ? (ls.find(n => n > cur) || ls[0]) : ([...ls].reverse().find(n => n < cur) || ls[ls.length - 1]);
  gotoLine(S.file, next);
}
$("#nextchg").onclick = () => stepChange(1);
$("#prevchg").onclick = () => stepChange(-1);

// ---------------------------------------------------------------- compare
function renderCompare() {
  const el = $("#tab-compare");
  const hist = S.history.slice().sort((a, b) => a.id - b.id);
  const opt = (sel, none) => (none ? '<option value="">none</option>' : "") + hist.map(h => '<option value="' + h.id + '"' + (h.id === sel ? " selected" : "") + ">#" + h.id + " " + new Date(h.at * 1000).toLocaleTimeString() + (h.changed.length ? " (" + h.changed.length + " file" + (h.changed.length > 1 ? "s" : "") + " changed)" : "") + "</option>").join("");
  const head = '<div class="cmpbar"><span class="dim">compare</span><select id="cmpA">' + opt(S.baseId, true) + '</select><span class="dim">with</span><select id="cmpB">' + opt(S.shownId, false) + "</select></div>";
  let out = head;
  if (S.changed && S.changed.length) {
    out += "<h3>Changed since the resolve before</h3>" + S.changed.map(c => '<div class="row" data-file="' + esc(c.file) + '"><span class="k">' + esc(c.file) + '</span><span class="n"><span class="add">+' + c.added + '</span> <span class="del">-' + c.removed + "</span> " + esc(c.status) + "</span></div>").join("");
  }
  const c = S.cmp;
  if (!c) { el.innerHTML = out + '<div class="empty">' + (hist.length < 2 ? "One resolve so far: nothing to compare yet" : "Pick two resolves") + "</div>"; wireCompare(el); return; }
  const d = c.diff;
  out += '<div class="sum"><b>#' + c.a + " to #" + c.b + "</b>" + (d.empty ? '<span class="dim">no change in the plan</span>' : "") +
    (d.moved.length ? "<span>" + d.moved.length + " moved</span>" : "") + (d.added.length ? '<span class="add">' + d.added.length + " added</span>" : "") + (d.removed.length ? '<span class="del">' + d.removed.length + " removed</span>" : "") +
    (d.copper.added.length || d.copper.removed.length ? '<span>copper <span class="add">+' + d.copper.added.length + '</span> <span class="del">-' + d.copper.removed.length + "</span></span>" : "") +
    (d.findings.gained.length || d.findings.lost.length ? '<span>findings <span class="del">+' + d.findings.gained.length + '</span> <span class="add">-' + d.findings.lost.length + "</span></span>" : "") +
    (d.score ? "<span>score " + d.score.a + " to " + d.score.b + ' (<span class="' + (d.score.delta < 0 ? "add" : "del") + '">' + (d.score.delta > 0 ? "+" : "") + d.score.delta + "</span>)</span>" : "") +
    (d.congestion ? "<span>worst congestion " + d.congestion.a + " to " + d.congestion.b + "</span>" : "") + "</div>";
  const tr = c.trace.items;
  const itemRow = (e, label) => {
    const t = tr[e.key], ln = t ? t.lines.new.concat(t.lines.old.filter(n => !t.lines.new.includes(n))) : [];
    return '<div class="row' + (S.sel === e.key ? " sel" : "") + '" data-item="' + esc(e.key) + '"><span class="k">' + esc(e.key) + '</span><span class="n wrap">' + label + (t ? (ln.length ? " - declared on changed line" + (ln.length > 1 ? "s " : " ") + ln.join(", ") : " - moved by something else the change did") : "") + "</span></div>";
  };
  if (d.moved.length) out += "<h3>Moved</h3>" + d.moved.map(m => itemRow(m, m.distance + " mm" + (m.turned ? ", turned " + m.from.rotation + " to " + m.to.rotation : "") + (m.flipped ? ", flipped to " + m.to.face : ""))).join("");
  if (d.added.length) out += "<h3>Added</h3>" + d.added.map(a => itemRow(a, "at " + a.at.join(", "))).join("");
  if (d.removed.length) out += "<h3>Removed</h3>" + d.removed.map(a => itemRow(a, "was at " + a.at.join(", "))).join("");
  if (d.findings.gained.length) out += "<h3>Findings gained</h3>" + d.findings.gained.map(f => '<div class="row" data-at="' + (f.at || "") + '" data-item="' + esc(f.item) + '"><span class="n del wrap">' + esc(f.text) + "</span></div>").join("");
  if (d.findings.lost.length) out += "<h3>Findings lost</h3>" + d.findings.lost.map(f => '<div class="row"><span class="n add wrap">' + esc(f.text) + "</span></div>").join("");
  const names = Object.keys(c.files);
  if (names.length) {
    out += "<h3>Lines</h3>" + '<div class="cmpbar">' + names.map(n => '<button class="fbtn' + (n === S.cmpFile ? " on" : "") + '" data-f="' + esc(n) + '">' + esc(n) + " (+" + c.files[n].added + " -" + c.files[n].removed + ")</button>").join(" ") +
      ' <label><input type="checkbox" id="sbs"' + (S.sbs ? " checked" : "") + "> side by side</label></div>" + diffTable(c, S.cmpFile);
  } else out += '<div class="pad8 dim">No file changed between these two</div>';
  el.innerHTML = out;
  wireCompare(el);
}
function diffTable(c, file) {
  const fd = c.files[file]; if (!fd) return "";
  const trl = c.trace.lines[file] || {new: {}, old: {}};
  const mark = (side, n) => n != null && trl[side][String(n)] ? trl[side][String(n)].length : 0;
  const o = ['<table class="diff">'];
  for (const h of fd.hunks) {
    o.push('<tr class="hunk"><td colspan="' + (S.sbs ? 6 : 5) + '">@@ -' + h.old_start + "," + h.old_len + " +" + h.new_start + "," + h.new_len + " @@</td></tr>");
    if (!S.sbs) {
      for (const r of h.lines) {
        const side = r.tag === "-" ? "old" : "new", n = r.tag === "-" ? r.old : r.new, k = mark(side, n);
        o.push('<tr class="' + (r.tag === "+" ? "p" : r.tag === "-" ? "m" : "") + '"><td class="no" data-side="old" data-n="' + (r.old || "") + '">' + (r.old || "") + '</td><td class="no" data-side="new" data-n="' + (r.new || "") + '">' + (r.new || "") + '</td><td class="link" title="' + k + ' item(s)">' + (k ? "&#9679;" : "") + '</td><td>' + (r.tag === " " ? "" : r.tag) + '</td><td class="tx" data-side="' + side + '" data-n="' + n + '">' + esc(r.text) + "</td></tr>");
      }
    } else {
      const rows = h.lines; let i = 0;
      while (i < rows.length) {
        if (rows[i].tag === " ") { const r = rows[i++]; o.push("<tr>" + cell("old", r.old, r.text, "") + cell("new", r.new, r.text, "") + "</tr>"); continue; }
        const del = [], add = [];
        while (i < rows.length && rows[i].tag === "-") del.push(rows[i++]);
        while (i < rows.length && rows[i].tag === "+") add.push(rows[i++]);
        for (let j = 0; j < Math.max(del.length, add.length); j++) o.push("<tr>" + (del[j] ? cell("old", del[j].old, del[j].text, "m") : "<td></td><td></td><td></td>") + (add[j] ? cell("new", add[j].new, add[j].text, "p") : "<td></td><td></td><td></td>") + "</tr>");
      }
    }
  }
  function cell(side, n, text, cls) {
    const k = mark(side, n);
    return '<td class="no" data-side="' + side + '" data-n="' + n + '">' + n + '</td><td class="link">' + (k ? "&#9679;" : "") + '</td><td class="tx ' + (side === "old" ? "l " : "r ") + cls + '" data-side="' + side + '" data-n="' + n + '">' + esc(text) + "</td>";
  }
  o.push("</table>");
  return o.join("");
}
function wireCompare(el) {
  const a = $("#cmpA"), b = $("#cmpB");
  if (a) a.onchange = () => { if (a.value) loadCompare(+a.value, +b.value); else { S.cmp = null; S.baseId = null; schedule("compare", "board", "script"); } };
  if (b) b.onchange = async () => { const id = +b.value; await pickShown(id); if (a && a.value) loadCompare(+a.value, id); };
  el.querySelectorAll(".fbtn").forEach(x => x.onclick = () => { S.cmpFile = x.dataset.f; schedule("compare"); });
  const sbs = $("#sbs"); if (sbs) sbs.onchange = () => { S.sbs = sbs.checked; schedule("compare"); };
  el.onclick = e => {
    const td = e.target.closest("td[data-n]");
    if (td && td.dataset.n) {
      const side = td.dataset.side, n = td.dataset.n, c = S.cmp, keys = c && c.trace.lines[S.cmpFile] ? (c.trace.lines[S.cmpFile][side][n] || []) : [];
      S.selLine = null;
      if (side === "new") gotoLine(S.cmpFile, +n);
      if (keys.length) markItems(keys, true); else { S.marked = new Set(); S.sel = null; schedule("marks", "script", "card"); }
      return;
    }
    const r = e.target.closest(".row"); if (!r) return;
    if (r.dataset.file) { S.cmpFile = r.dataset.file; schedule("compare"); return; }
    if (r.dataset.at) { const [x, y] = r.dataset.at.split(",").map(Number); zoomTo([x - 2, y - 2, x + 2, y + 2]); }
    if (r.dataset.item && itemMap(plan()).has(r.dataset.item)) selectItem(r.dataset.item, {zoom: true});
  };
}

// ---------------------------------------------------------------- chrome
const narrow = () => matchMedia("(max-width: 900px)").matches;
function goTab(name) {                         // the board, or a panel: the bar on a phone, the sidebar's tabs on a wide screen
  if (narrow()) { showNarrow(name); return; }
  if (name === "board" || name === "script") return;
  S.tab = name;
  document.querySelectorAll(".tabs button").forEach(x => x.classList.toggle("on", x.dataset.tab === name));
  document.querySelectorAll(".tab").forEach(t => t.classList.toggle("on", t.id === "tab-" + name));
}
document.querySelectorAll(".tabs button").forEach(b => b.onclick = () => goTab(b.dataset.tab));
$("#layers").innerHTML = Object.keys(LAYER_NAMES).map(k => '<label><input type="checkbox" data-layer="' + k + '"' + (S.layers[k] ? " checked" : "") + '><i style="background:var(--' + LAYER_NAMES[k][1] + ')"></i>' + LAYER_NAMES[k][0] + "</label>").join("");
$("#layers").addEventListener("change", e => { const k = e.target.dataset.layer; if (k) { S.layers[k] = e.target.checked; schedule("board"); } });
function setFace(f) {
  S.face = f; lay = null;
  document.querySelectorAll("#facebar button").forEach(x => x.classList.toggle("on", x.dataset.face === f));
  schedule("board"); S.view = null;
}
document.querySelectorAll("#facebar button").forEach(b => b.onclick = () => setFace(b.dataset.face));
$("#fit").onclick = fit;
$("#layerbtn").onclick = () => { $("#layers").classList.toggle("open"); $("#layerbtn").classList.toggle("on"); };
function showNarrow(v) {
  document.body.dataset.nv = v;
  document.querySelectorAll("#ntabs button").forEach(x => x.classList.toggle("on", x.dataset.nv === v));
  if (v !== "board" && v !== "script") S.tab = v;
  schedule("all");
  if (v === "board") requestAnimationFrame(applyView);
}
document.querySelectorAll("#ntabs button").forEach(b => b.onclick = () => showNarrow(b.dataset.nv));
setFace(narrow() ? "front" : "both");            // one face fills a narrow screen
showNarrow("board");
window.addEventListener("resize", applyView);
if (window.ResizeObserver) new ResizeObserver(() => applyView()).observe($("#boardwrap"));   // the notice and the tab bar change its height
schedule("all");
</script>
