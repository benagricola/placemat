# A tagged release (v0.31.0, ...): the suite with and without the native
# module, then prebuilt native wheels for Linux (x86_64, aarch64) and Apple
# Silicon, placemat's own wheel and sdist, all attached to the tag's GitHub
# Release. Nothing runs on a plain push.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0             # the tags: every version is read from them
      - uses: astral-sh/setup-uv@v5
      - name: Suite, pure Python
        run: |
          uv venv --python 3.12
          uv pip install -e ".[dev]"
          PLACEMAT_NATIVE=0 .venv/bin/python -m pytest -q
      - name: The version is the tag, and the plugin manifests say so too
        run: |
          want="${GITHUB_REF_NAME#v}"
          got=$(.venv/bin/python -c "import placemat; print(placemat.__version__)")
          test "$got" = "$want" || { echo "tag $GITHUB_REF_NAME but placemat reports $got"; exit 1; }
          for f in .claude-plugin/plugin.json .claude-plugin/marketplace.json; do
            grep -q "\"version\": \"$want\"" "$f" || { echo "$f does not say $want"; exit 1; }
          done
      - name: Suite, native (built from native/ on install)
        run: |
          uv pip install -e ".[dev,native]"
          .venv/bin/python -c "import placemat.geometry as g; assert g._native is not None"
          .venv/bin/python -m pytest -q

  native-wheels:
    needs: test
    strategy:
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64 }
          - { os: ubuntu-latest, target: aarch64 }
          - { os: macos-14, target: aarch64-apple-darwin }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0             # the tags: every version is read from them
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: The wheel's version is the tag's
        run: sed -i.bak "s/^version = \"0.0.0\"/version = \"${GITHUB_REF_NAME#v}\"/" native/Cargo.toml
      - uses: PyO3/maturin-action@v1
        with:
          working-directory: native
          target: ${{ matrix.target }}
          manylinux: auto
          args: --release --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.os }}-${{ matrix.target }}
          path: native/dist/*.whl

  placemat:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0             # the tags: every version is read from them
      - uses: astral-sh/setup-uv@v5
      - run: uv build --out-dir dist
      - uses: actions/upload-artifact@v4
        with:
          name: placemat
          path: dist/*

  release:
    needs: [native-wheels, placemat]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
