[project]
name = "placemat"
dynamic = ["version"]
description = "Deterministic PCB layout intent and position scanning"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []
authors = [{ name = "Ben Agricola" }]

# pcbnew is NOT a dependency and cannot be one: it ships with system KiCad and
# is not on PyPI. placemat therefore runs in a venv that inherits the system
# interpreter's packages -
#     uv venv --python "$(which python3)" --system-site-packages
# - which is why an isolated `uv tool install` or `uvx` cannot host it.

[project.scripts]
placemat = "placemat.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8"]
# The Rust accelerator (native/): built on install by uv from this checkout,
# which needs a Rust toolchain (cargo) on the installing machine; a tagged
# release also carries prebuilt wheels. placemat runs without it.
native = ["placemat_native"]

[tool.uv.sources]
placemat_native = { path = "native" }

[tool.uv]
# An install is refreshed when the commit or the tags move, so the version
# it reports is the checkout's.
cache-keys = [{ file = "pyproject.toml" }, { git = { commit = true, tags = true } }]

# The version is the git tag (v0.31.0 -> 0.31.0); between tags it is the
# last tag's with a .post/.dev suffix (no-guess-dev keeps the release it
# builds on). Written into src/placemat/_version.py at build or install.
[tool.hatch.version]
source = "vcs"
raw-options = { version_scheme = "no-guess-dev" }

[tool.hatch.build.hooks.vcs]
version-file = "src/placemat/_version.py"

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/placemat"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore:The SWIG-based Python interface:DeprecationWarning"]
