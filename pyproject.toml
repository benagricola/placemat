[project]
name = "placemat"
version = "0.1.0"
description = "PCB layout as code: placement, copper, and the gates around them"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []
authors = [{ name = "Ben Agricola" }]

# pcbnew is NOT a dependency and cannot be one: it ships with system KiCad and
# is not on PyPI. placemat therefore runs in a venv that inherits the system
# interpreter's packages -
#     uv venv --python "$(which python3)" --system-site-packages
# - which is why an isolated `uv tool install` or `uvx` cannot host it.

[project.scripts]
placemat = "placemat.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/placemat"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not board and not trial' --strict-markers -q"
markers = [
    "board: builds or loads a real board and gates the result",
    "trial: runs the router to score closure (slower still)",
]
