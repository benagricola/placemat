[project]
name = "placemat"
dynamic = ["version"]
description = "Deterministic PCB layout intent and position scanning"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []
authors = [{ name = "Ben Agricola" }]

# pcbnew is NOT a dependency and cannot be one: it ships with system KiCad and
# is not on PyPI. placemat therefore runs in a venv that inherits the system
# interpreter's packages -
#     uv venv --python "$(which python3)" --system-site-packages
# - which is why an isolated `uv tool install` or `uvx` cannot host it.

[project.scripts]
placemat = "placemat.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.hatch.version]
path = "src/placemat/__init__.py"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/placemat"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore:The SWIG-based Python interface:DeprecationWarning"]
