[build-system]
requires = ["maturin>=1.15,<2.0"]
build-backend = "maturin"

[project]
name = "placemat_native"
description = "Optional Rust accelerator for placemat's geometry and placement hot path"
requires-python = ">=3.12"
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
]
dynamic = ["version"]

[tool.uv]
# Rebuild when the Rust or the release changes, not only this file: a path
# dependency is otherwise cached on its pyproject.toml alone.
cache-keys = [{ file = "pyproject.toml" }, { file = "Cargo.toml" }, { file = "build.rs" },
              { file = "src/**/*.rs" }, { git = { commit = true, tags = true } }]
