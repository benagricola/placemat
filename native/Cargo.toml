[package]
name = "placemat_native"
version = "0.0.0"       # the wheel's version only, set from the tag by the release workflow; the
                        # module reports the release it was built from (build.rs: the git tag)
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[lib]
name = "placemat_native"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.29.0", features = ["extension-module", "abi3-py312"] }   # one wheel per platform for Python 3.12 on

[profile.release]
lto = true
