[package]
name = "placemat_native"
version = "0.31.0"      # placemat's own version: placemat uses a native module only of its own release
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[lib]
name = "placemat_native"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.29.0", features = ["extension-module", "abi3-py312"] }   # one wheel per platform for Python 3.12 on

[profile.release]
lto = true
